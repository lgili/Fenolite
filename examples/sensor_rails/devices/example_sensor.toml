# SPDX-License-Identifier: CC0-1.0
# Authored for Fenolite as an example; an illustrative device, not a real product. Its values are chosen
# for the example and come from no datasheet.
schema = "fenolite.device.v0"
id = "Example:SENSOR_I2C"
summary = "6-pin I2C sensor with an interrupt output (illustrative)"
manufacturer = "Example Semi"
mpn = "EXS0006"
symbol = "Example:Sensor_6pin"
footprint = "Fenolite:SOT23_6_TI_DBV0006A"
ref_prefix = "U"
evidence = "UNVERIFIED"
ground = "GND"

[pins]
VDD = "1"
GND = "2"
SDA = "3"
SCL = "4"
INT = "5"
ADDR = "6"

[[interfaces]]
name = "vdd"
kind = "power"
direction = "in"
members = { hv = ["VDD"], lv = ["GND"] }
voltage = { min = "1.71V", max = "3.6V" }
current = { max = "20mA" }

[[interfaces]]
name = "i2c"
kind = "i2c"
direction = "inout"
members = { sda = ["SDA"], scl = ["SCL"] }
reference = "vdd"
requires = ["pullup", "supply"]
abs_max = { min = "-0.3V", max = "3.9V" }
input_high_min = "1.26V"
input_low_max = "0.54V"
output_low_max = "0.4V"
output_current_max = "3mA"

[[interfaces]]
name = "int_"
kind = "logic"
direction = "out"
members = { io = ["INT"] }
reference = "vdd"
output_high_min = "2.9V"
output_low_max = "0.4V"
