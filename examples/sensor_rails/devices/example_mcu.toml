# SPDX-License-Identifier: CC0-1.0
# Authored for Fenolite as an example; an illustrative device, not a real product. Its values are chosen
# for the example and come from no datasheet.
schema = "fenolite.device.v0"
id = "Example:MCU_SO8"
summary = "8-pin microcontroller with one I2C port (illustrative)"
manufacturer = "Example Semi"
mpn = "EXM0008"
symbol = "Example:MCU_8pin"
footprint = "Fenolite:SOIC_8"
ref_prefix = "U"
evidence = "UNVERIFIED"
ground = "VSS"

[pins]
VDD = "1"
VDDA = "2"
VSS = "3"
PA3 = "4"
PB6 = "5"
PB7 = "6"
PA0 = "7"
PA1 = "8"

[[interfaces]]
name = "vdd"
kind = "power"
direction = "in"
members = { hv = ["VDD", "VDDA"], lv = ["VSS"] }
voltage = { min = "1.71V", max = "3.6V" }
current = { max = "30mA" }

[[interfaces]]
name = "i2c1"
kind = "i2c"
direction = "inout"
members = { sda = ["PB7"], scl = ["PB6"] }
reference = "vdd"
abs_max = { min = "-0.3V", max = "3.9V" }
input_high_min = "1.3V"
input_low_max = "0.5V"
output_low_max = "0.4V"
output_current_max = "3mA"

[[interfaces]]
name = "pa3"
kind = "logic"
direction = "in"
members = { io = ["PA3"] }
reference = "vdd"
abs_max = { min = "-0.3V", max = "3.9V" }
input_high_min = "2.3V"
input_low_max = "1V"
