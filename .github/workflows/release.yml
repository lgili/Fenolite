name: release

# Publishes `fenolite` and its alias `phenolite` to PyPI when a GitHub Release is published.
# Uses PyPI trusted publishing (OIDC): no token is stored in GitHub. On PyPI, register a
# (pending) trusted publisher for EACH project name with: owner `lgili`, repository `Fenolite`,
# workflow `release.yml`, environment `pypi`.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Versions match the release tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          core=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/fenolite/__init__.py)
          alias=$(sed -n 's/^version = "\(.*\)"$/\1/p' packaging/phenolite/pyproject.toml)
          echo "tag=$tag fenolite=$core phenolite=$alias"
          test "$tag" = "$core" && test "$tag" = "$alias"
      - name: Build fenolite
        run: uv build --out-dir dist
      - name: Build phenolite (alias)
        run: uv build packaging/phenolite --out-dir dist
      - name: Residue scan of the built artefacts
        run: uv run --no-project python tools/residue/scan.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # A version already on PyPI (published earlier, e.g. by a workflow_dispatch run) is skipped, so a
      # GitHub Release made afterwards for that version still ends green; a new version is uploaded.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
