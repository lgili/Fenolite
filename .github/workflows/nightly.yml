name: nightly

# Oracle runs that are too heavy for every push. Nothing here is a check of pull requests or a merge gate.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-app:
    # The kicad-cli of the official KiCad 10.0.6 macOS disk image: what the hypothesis register records
    # as "confirmed with local kicad-cli 10.0.6 (macOS)", repeated in CI (H-K-CI-MACOSAPP). KiCad is run
    # as a subprocess from the mounted image; it is never installed into or copied into the repository.
    # The corpus is not fetched and tests/corpus is not run: the kicad-10 job of ci.yml covers them.
    name: macos-app (kicad-cli of the 10.0.6 macOS disk image)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      KICAD_DMG_URL: https://github.com/KiCad/kicad-source-mirror/releases/download/10.0.6/kicad-unified-universal-10.0.6.dmg
      KICAD_DMG_SHA256: ef4dcd4278c46d3efcd28c8db273d5957d68efda028f6bf79b4811fc5302dc68
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Disk image cache
        id: dmg
        uses: actions/cache@v4
        with:
          path: ~/kicad-dmg
          key: kicad-dmg-ef4dcd4278c46d3efcd28c8db273d5957d68efda028f6bf79b4811fc5302dc68
      - name: Download the disk image
        if: steps.dmg.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/kicad-dmg
          curl --fail --location --silent --show-error --retry 3 -o ~/kicad-dmg/kicad.dmg "$KICAD_DMG_URL"
      - name: Check the SHA-256 of the disk image
        run: echo "ef4dcd4278c46d3efcd28c8db273d5957d68efda028f6bf79b4811fc5302dc68  $HOME/kicad-dmg/kicad.dmg" | shasum -a 256 --check
      - name: Mount the disk image
        run: |
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$RUNNER_TEMP/kicad-image" ~/kicad-dmg/kicad.dmg
          echo "FENOLITE_KICAD_CLI=$RUNNER_TEMP/kicad-image/KiCad/KiCad.app/Contents/MacOS/kicad-cli" >> "$GITHUB_ENV"
      - name: kicad-cli version
        run: |
          "$FENOLITE_KICAD_CLI" version
          "$FENOLITE_KICAD_CLI" version | grep -F 10.0.6
      - name: Sync (locked)
        run: uv sync --locked --extra dev
      - name: Oracle tests
        env:
          FENOLITE_REQUIRE: kicad
        run: uv run pytest tests/kicad -q -n auto --dist loadfile

  yardstick:
    # The yardstick board (examples/yardstick) taken through the loop of its stage by tools/yardstick.py,
    # with a time and memory budget per step (H-K-YARD-STAGE1 and the rows after it). Not a merge gate:
    # no test suite runs here and nothing is written to the repository; the record is an artefact of the
    # run, and docs/evidence/yardstick.md gets a row per stage reached and per release. The official
    # libraries and the two heavy demo boards are fetched into caches, run through and never committed.
    # From stage 4 the job also routes: Freerouting for the board (route, a budget of 3600 s), then
    # KiCadRoutingTools for the pair (route-pairs, after route since c0157), so it takes about one and a
    # half hours and is given three.
    name: yardstick (the 390-part example through the loop, kicad-cli 10.0.6)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: kicad/kicad:10.0.6@sha256:18693567392b80da435f9fa952ce3a3e534c66eb5a6033f5b9c80aa3b19dd3ec
      options: --user 0
    env:
      HOME: /root
      FENOLITE_LIBS_CACHE: /root/.cache/fenolite/libs
      FENOLITE_CORPUS_CACHE: /root/.cache/fenolite/corpus
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync (locked)
        run: uv sync --locked --extra dev
      - name: kicad-cli version
        run: |
          kicad-cli version
          kicad-cli version | grep -F 10.0.6
      - name: Library cache
        uses: actions/cache@v4
        with:
          path: /root/.cache/fenolite/libs
          key: kicad-libs-10.0.6-${{ hashFiles('src/fenolite/backends/kicad/data/libraries.toml') }}
      - name: Fetch the official libraries of tag 10.0.6
        run: uv run python tools/kicad_libs_fetch.py --tag 10.0.6 --cache /root/.cache/fenolite/libs
      - name: Heavy boards cache
        uses: actions/cache@v4
        with:
          path: /root/.cache/fenolite/corpus
          key: corpus-heavy-${{ hashFiles('tests/corpus/manifest.toml') }}
      - name: Fetch the two heavy demo boards
        run: uv run python tools/corpus_fetch.py --uses heavy --only kicad-demo-10-0-6-pcb-06 kicad-demo-10-0-6-pcb-18
      # The routers of stage 4, installed and checked by SHA-256 as the routing job of ci.yml installs them.
      - name: Install system Python venv support
        run: apt-get update && apt-get install -y python3-venv curl
      - name: Install pinned router
        run: |
          git clone --depth 1 --branch v0.22.1 https://github.com/drandyhaas/KiCadRoutingTools.git /tmp/kicadroutingtools
          python3 -m venv /tmp/krt-venv
          /tmp/krt-venv/bin/python -m pip install -r /tmp/kicadroutingtools/requirements.txt
          mkdir -p /tmp/kicadroutingtools/rust_router
          curl -fsSL https://github.com/drandyhaas/KiCadRoutingTools/releases/download/v0.22.1/grid_router-linux-x86_64.so -o /tmp/kicadroutingtools/rust_router/grid_router.so
          echo '652b67e266c58b1e373e503bcf9b5d0b0d3dd4756e1c306100f23edf3d3f989b  /tmp/kicadroutingtools/rust_router/grid_router.so' | sha256sum --check
      - name: Install Java 25 for Freerouting
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install pinned Freerouting jar
        # The command checks the size and the SHA-256 pinned in src/fenolite/cli/data/fetch.toml.
        run: uv run fenolite fetch freerouting --dir /tmp/freerouting --confirm --json
      - name: Yardstick
        env:
          FENOLITE_KRT: /tmp/kicadroutingtools
          FENOLITE_KRT_PYTHON: /tmp/krt-venv/bin/python
          FENOLITE_FREEROUTING_JAR: /tmp/freerouting/freerouting-2.4.1.jar
        run: |
          echo "YARDSTICK_OUT=$RUNNER_TEMP/yardstick" >> "$GITHUB_ENV"
          uv run python tools/yardstick.py run --out "$RUNNER_TEMP/yardstick" --record "$RUNNER_TEMP/yardstick/record.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload the record and the replies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yardstick-record
          path: |
            ${{ env.YARDSTICK_OUT }}/record.json
            ${{ env.YARDSTICK_OUT }}/yardstick-run/replies
          retention-days: 90
