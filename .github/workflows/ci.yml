name: ci

on:
  # Every branch but a backup; a tag push runs nothing, as only branches are filtered (change c0194).
  push:
    branches:
      - "**"
      - "!backup/**"
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      profile:
        description: "Full validation by default; fast is allowed only on a working branch"
        type: choice
        options: [full, fast]
        default: full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select conservative profile
        id: profile
        run: python3 tools/ci_profiles.py plan

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --locked --extra dev --extra geo
      - name: Static quality gates (once per run)
        run: make lint format types residue

  fast:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    needs: [plan]
    if: needs.plan.outputs.profile == 'fast'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --locked --extra dev --extra geo
      - name: Light tool-free partition
        run: uv run python tools/ci_tests.py run --suite fast --shard ${{ matrix.shard }} --shards 3 --out "${{ runner.temp }}/ci-tests/fast"
      - name: Keep fast inventory and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          retention-days: 14
          name: ci-fast-tests-${{ matrix.shard }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ci-tests/fast/receipt.json
            ${{ runner.temp }}/ci-tests/fast/junit.xml

  fast-audit:
    name: light test coverage
    needs: [plan, fast]
    if: always() && needs.plan.outputs.profile == 'fast'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-fast-tests-*
          path: ci-fast-receipts
      - name: Require three complete disjoint light partitions
        run: python3 tools/ci_tests.py audit ci-fast-receipts --fast --commit "$GITHUB_SHA"

  unit:
    needs: [plan, quality]
    if: needs.plan.outputs.profile == 'full'
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --locked --extra dev --extra geo
      - name: Native platform types
        if: matrix.os != 'ubuntu-latest'
        run: uv run pyright src
      - name: Shipped block tests
        run: uv run fenolite blocks test --json

      - name: Check shipped library records and prepare review sheets
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv run fenolite library check src/fenolite/catalog/data --sheets library-review --confirm --json > library-check.json
      - name: Keep library review sheets
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: library-review
          path: |
            library-review/
            library-check.json
      - name: Probe authored Mac byte guard
        id: authored_byte_probe
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        env:
          FENOLITE_BUILD_BYTE_DIAGNOSTICS: ${{ runner.temp }}/fenolite-byte-diagnostics
        run: uv run pytest 'tests/unit/test_build_bytes.py::test_example_keeps_its_bytes[board_40parts@altium]' -q --basetemp "${{ runner.temp }}/fenolite-byte-probe"
      - name: Keep early authored Mac byte-failure evidence
        if: always() && matrix.os == 'macos-latest' && steps.authored_byte_probe.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: authored-mac-byte-failure-early
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/fenolite-byte-diagnostics/board_40parts.PcbDoc
            ${{ runner.temp }}/fenolite-byte-diagnostics/receipt.json
      - name: Tests
        env:
          FENOLITE_BUILD_BYTE_DIAGNOSTICS: ${{ matrix.os == 'macos-latest' && format('{0}/fenolite-byte-diagnostics', runner.temp) || '' }}
        run: uv run python tools/ci_tests.py run --suite unit-${{ matrix.os }}-py${{ matrix.python }} --out "${{ runner.temp }}/ci-tests/unit"
      - name: Keep authored Mac byte-failure evidence
        if: failure() && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: authored-mac-byte-failure
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/fenolite-byte-diagnostics/board_40parts.PcbDoc
            ${{ runner.temp }}/fenolite-byte-diagnostics/receipt.json
      - name: Keep test inventory and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          retention-days: 14
          name: ci-tests-unit-${{ matrix.os }}-py${{ matrix.python }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ci-tests/unit/receipt.json
            ${{ runner.temp }}/ci-tests/unit/junit.xml

  viewer:
    needs: [plan, quality]
    if: needs.plan.outputs.profile == 'full'
    # change c0191: screenshot and interaction tests of the viewer page, in the Chromium of Playwright 1.63.0
    # (153.0.8010.12) with the fonts of fonts-dejavu-core 2.37-8, the versions the references were made with
    name: viewer (visual tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --locked --extra dev
      - name: The viewer bundle is a fresh build of viewer/src (c0304)
        run: uv run python tools/build_viewer.py --check
      - name: Playwright and its Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null && npm install --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          echo "FENOLITE_PLAYWRIGHT=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Fonts
        run: |
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          dpkg-query -W fonts-dejavu-core
      - name: Visual tests
        env:
          FENOLITE_REQUIRE: browser
        run: uv run python tools/ci_tests.py run --suite viewer --workers 0 --out "$RUNNER_TEMP/ci-tests/viewer"
      - name: Keep the screenshots and difference images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: viewer-differences
          path: ${{ runner.temp }}/ci-tests/viewer/tmp/**/*.png
      - name: Keep test inventory and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          retention-days: 14
          name: ci-tests-viewer
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ci-tests/viewer/receipt.json
            ${{ runner.temp }}/ci-tests/viewer/junit.xml

  mcp:
    needs: [plan, quality]
    if: needs.plan.outputs.profile == 'full'
    # change c0195: the official MCP SDK's client (the oracles extra) against fenolite mcp, a legacy and a
    # modern session, with the server's own tests
    name: mcp (the official MCP client against fenolite mcp)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync (locked, with the oracles)
        run: uv sync --locked --extra dev --extra oracles
      - name: MCP tests
        env:
          FENOLITE_REQUIRE: mcp-sdk
        run: uv run python tools/ci_tests.py run --suite mcp --workers 0 --out "${{ runner.temp }}/ci-tests/mcp"
      - name: Keep test inventory and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          retention-days: 14
          name: ci-tests-mcp
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ci-tests/mcp/receipt.json
            ${{ runner.temp }}/ci-tests/mcp/junit.xml

  wheel:
    needs: [plan, quality]
    if: needs.plan.outputs.profile == 'full'
    name: wheel (the built package installs alone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the package and its alias
        run: |
          uv build --out-dir dist
          uv build packaging/phenolite --out-dir dist
      - name: Residue scan of the artefacts
        run: uv run --no-project python tools/residue/scan.py
      - name: Install with no index
        run: |
          uv venv /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv/bin/python --no-index --find-links dist fenolite
      - name: The installed package runs and needs nothing else
        run: |
          cd /tmp
          /tmp/wheel-venv/bin/fenolite capabilities --json > /tmp/capabilities.json
          /tmp/wheel-venv/bin/fenolite blocks test --json > /tmp/block-tests.json
          /tmp/wheel-venv/bin/python -c "import json; assert json.load(open('/tmp/capabilities.json'))['ok']"
          /tmp/wheel-venv/bin/python -c "import importlib.metadata as m; r = m.requires('fenolite') or []; assert all('extra ==' in x for x in r), r"
      - name: The wheel carries the agent guide and a starter project
        run: |
          mkdir /tmp/empty-project
          cd /tmp/empty-project
          /tmp/wheel-venv/bin/fenolite guide start --text > /tmp/guide.txt
          grep -q '^# Fenolite' /tmp/guide.txt
          grep -q '^```fenolite-loop$' /tmp/guide.txt
          /tmp/wheel-venv/bin/fenolite init blink --dry-run --json > /tmp/init.json
          /tmp/wheel-venv/bin/python -c "import json; r = json.load(open('/tmp/init.json'))['result']; assert [p['path'] for p in r['plan']] == ['blink/design.py'], r"
          test -z "$(ls -A /tmp/empty-project)"
      - name: The wheel holds no test, private or example file
        run: |
          python3 - <<'PY'
          import glob, zipfile
          (wheel,) = glob.glob("dist/fenolite-*.whl")
          bad = [n for n in zipfile.ZipFile(wheel).namelist() if n.startswith(("tests/", "private/", "examples/"))]
          assert not bad, bad
          names = set(zipfile.ZipFile(wheel).namelist())
          assert not [n for n in names if n.startswith("viewer/")], "the viewer's sources ship in the wheel"
          static = {f"fenolite/view/static/{n}" for n in ("page.html", "viewer.js", "viewer.css", "manifest.json")}
          assert static <= names, static - names  # the bundle of the viewer page (c0304)
          PY

  dco:
    name: dco (every commit is signed off)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sign-off check
        run: python3 tools/dco_check.py

  kicad-10:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    needs: [plan, quality]
    if: needs.plan.outputs.profile == 'full'
    name: kicad-10 (oracle and corpus shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.6@sha256:18693567392b80da435f9fa952ce3a3e534c66eb5a6033f5b9c80aa3b19dd3ec
      options: --user 0
    env:
      HOME: /root
      FENOLITE_CORPUS_CACHE: /root/.cache/fenolite/corpus
      FENOLITE_HEAVY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: kicad-cli version
        run: kicad-cli version
      - name: Sync (locked)
        run: uv sync --locked --extra dev --extra geo
      - name: Corpus cache
        uses: actions/cache@v4
        with:
          path: /root/.cache/fenolite/corpus
          key: corpus-${{ hashFiles('tests/corpus/manifest.toml') }}
      - name: Fetch corpus
        run: uv run python tools/corpus_fetch.py --uses rt0 --uses sch --uses libs --uses project --uses cfb --uses altium-import --uses altium-pcbdoc --uses altium-pcblib --uses altium-sch --uses altium-schlib --uses altium-text --uses altium-sheet --uses altium-draftsman --uses rta
      - name: Apply the agreed CAC closure scope (geometry remains deferred)
        if: github.ref == 'refs/heads/codex/cac-next'
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          scope = json.loads(Path("tools/ci/cac_geometry_deferred.json").read_text())
          rows = scope["tests"]
          assert scope["status"] == "DEFERRED_NOT_PASSED"
          assert scope["deferred_change"] == "c0332-certified-neck-cut"
          assert len(rows) == len({r["nodeid"] for r in rows}) == 27
          for row in rows:
              node = row["nodeid"]
              assert node.startswith(("tests/kicad/", "tests/corpus/"))
              assert "::" in node and not any(c.isspace() for c in node)
              assert hashlib.sha256(Path(node.split("::")[0]).read_bytes()).hexdigest() == row["test_file_sha256"]
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("PYTEST_ADDOPTS=" + " ".join("--deselect=" + r["nodeid"] for r in rows) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("CAC closure scope: 27 known c0332 geometry cases deferred, NOT passed.\n")
              summary.write("c0332 remains open; this run does not certify its geometry.\n")
              summary.write("\n".join("- `" + r["nodeid"] + "`" for r in rows) + "\n")
          print("CAC closure: 27 known geometry cases deferred, not passed; all other selected tests remain required.")
          PY
      - name: Native viewer action plans (c0303)
        env:
          FENOLITE_REQUIRE: kicad
        run: uv run pytest tests/unit/cli/test_view_actions.py::test_export_plans_files_under_fab tests/unit/cli/test_view_actions.py::test_fill_plan tests/unit/cli/test_view_actions.py::test_tidy_with_the_drc_gate -q -rA --basetemp /tmp/fenolite-view-actions-native -n auto --dist loadfile
      - name: Oracle and corpus tests
        env:
          FENOLITE_REQUIRE: kicad,corpus,libs
        run: uv run python tools/ci_tests.py run --suite kicad-10 --shard ${{ matrix.shard }} --shards 4 --out /tmp/fenolite-kicad-corpus
      - name: Keep aggregate import census measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: import-census-${{ matrix.shard }}
          path: /tmp/fenolite-kicad-corpus/**/import-census.json
          if-no-files-found: ignore
      - name: Keep drawn schematic census measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: drawn-census-kicad-10-${{ matrix.shard }}
          path: /tmp/**/drawn-census.json
          if-no-files-found: ignore
      - name: Keep original-floor and copy-upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: drawn-floor-kicad-10-${{ matrix.shard }}
          path: |
            /tmp/**/drawn-floor.json
            !/tmp/**/*current/**
          if-no-files-found: ignore  # one shard writes it; drawn-floor-bridge requires every row
      - name: Keep test inventory and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          retention-days: 14
          name: ci-tests-kicad-10-${{ matrix.shard }}
          if-no-files-found: error
          path: |
            /tmp/fenolite-kicad-corpus/receipt.json
            /tmp/fenolite-kicad-corpus/junit.xml

  kicad-9:
    needs: [plan, quality]
    if: needs.plan.outputs.profile == 'full'
    name: kicad-9 (kicad-cli 9.0 oracle)
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0.9@sha256:e638b79b0321f29395a5b783e94bb9f3c73303e8da15da27b8f5cb4b67a37729
      options: --user 0
    env:
      HOME: /root
      FENOLITE_CORPUS_CACHE: /root/.cache/fenolite/corpus
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: kicad-cli version
        run: kicad-cli version
      - name: Sync (locked, with geo for the role-copper planner, change c0280)
        run: uv sync --locked --extra dev --extra geo
      - name: Corpus cache (rt2-9 and sch-9 rows)
        uses: actions/cache@v4
        with:
          path: /root/.cache/fenolite/corpus
          key: corpus-rt2-9-sch-9-downgrade-demo-${{ hashFiles('tests/corpus/manifest.toml') }}
      - name: Fetch the rt2-9, sch-9, project and downgrade demo rows
        run: uv run python tools/corpus_fetch.py --uses rt2-9 --uses sch-9 --uses project --uses downgrade-demo
      - name: Native viewer action plans (c0303)
        env:
          FENOLITE_REQUIRE: kicad
        run: uv run pytest tests/unit/cli/test_view_actions.py::test_export_plans_files_under_fab tests/unit/cli/test_view_actions.py::test_fill_plan tests/unit/cli/test_view_actions.py::test_tidy_with_the_drc_gate -q -rA --basetemp /tmp/fenolite-view-actions-native -n auto --dist loadfile
      - name: Oracle tests
        env:
          FENOLITE_REQUIRE: kicad
        run: uv run python tools/ci_tests.py run --suite kicad-9 --out /tmp/fenolite-ci-kicad9
      - name: Keep drawn schematic census measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: drawn-census-kicad-9
          path: /tmp/**/drawn-census.json
          if-no-files-found: ignore
      - name: Keep original-floor and copy-upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drawn-floor-kicad-9
          path: |
            /tmp/**/drawn-floor.json
            !/tmp/**/*current/**
          if-no-files-found: error

      - name: Keep test inventory and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          retention-days: 14
          name: ci-tests-kicad-9
          if-no-files-found: error
          path: |
            /tmp/fenolite-ci-kicad9/receipt.json
            /tmp/fenolite-ci-kicad9/junit.xml

  drawn-floor-bridge:
    name: drawn-floor (same-commit native10 upgrade qualification)
    needs: [plan, kicad-9, kicad-10]
    if: always() && needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download both original-floor evidence sets
        uses: actions/download-artifact@v4
        with:
          pattern: drawn-floor-kicad-*
          path: /tmp/drawn-floor-evidence
      - name: Require complete immutable original and upgraded graphs
        run: python3 tools/verify_drawn_floor.py --reports /tmp/drawn-floor-evidence --commit "$GITHUB_SHA"
      - name: Both complete native jobs remain required
        env:
          NATIVE_NINE_RESULT: ${{ needs.kicad-9.result }}
          NATIVE_TEN_RESULT: ${{ needs.kicad-10.result }}
        run: test "$NATIVE_NINE_RESULT" = success && test "$NATIVE_TEN_RESULT" = success

  routing:
    needs: [plan, quality]
    if: needs.plan.outputs.profile == 'full'
    name: routing (KiCad ${{ matrix.target }}, pinned KiCadRoutingTools and Freerouting)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 9
            image: kicad/kicad:9.0.9@sha256:e638b79b0321f29395a5b783e94bb9f3c73303e8da15da27b8f5cb4b67a37729
          - target: 10
            image: kicad/kicad:10.0.6@sha256:18693567392b80da435f9fa952ce3a3e534c66eb5a6033f5b9c80aa3b19dd3ec
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync (locked)
        run: uv sync --locked --extra dev
      - name: Install system Python venv support
        run: apt-get update && apt-get install -y python3-venv curl
      - name: Install pinned router
        run: |
          git clone --depth 1 --branch v0.22.1 https://github.com/drandyhaas/KiCadRoutingTools.git /tmp/kicadroutingtools
          python3 -m venv /tmp/krt-venv
          /tmp/krt-venv/bin/python -m pip install -r /tmp/kicadroutingtools/requirements.txt
          mkdir -p /tmp/kicadroutingtools/rust_router
          curl -fsSL https://github.com/drandyhaas/KiCadRoutingTools/releases/download/v0.22.1/grid_router-linux-x86_64.so -o /tmp/kicadroutingtools/rust_router/grid_router.so
          echo '652b67e266c58b1e373e503bcf9b5d0b0d3dd4756e1c306100f23edf3d3f989b  /tmp/kicadroutingtools/rust_router/grid_router.so' | sha256sum --check
      - name: Install Java 25 for Freerouting
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install pinned Freerouting jar
        # The command checks the size and the SHA-256 pinned in src/fenolite/cli/data/fetch.toml and
        # writes nothing when they differ: each run settles H-G-FETCH-PIN (ADR-0007).
        run: uv run fenolite fetch freerouting --dir /tmp/freerouting --confirm --json
      - name: Router gate and loop
        env:
          FENOLITE_REQUIRE: kicad,router,freerouting
          FENOLITE_KRT: /tmp/kicadroutingtools
          FENOLITE_KRT_PYTHON: /tmp/krt-venv/bin/python
          FENOLITE_FREEROUTING_JAR: /tmp/freerouting/freerouting-2.4.1.jar
        run: uv run python tools/ci_tests.py run --suite routing-${{ matrix.target }} --workers 0 --out /tmp/fenolite-ci-routing
      - name: Keep test inventory and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          retention-days: 14
          name: ci-tests-routing-${{ matrix.target }}
          if-no-files-found: error
          path: |
            /tmp/fenolite-ci-routing/receipt.json
            /tmp/fenolite-ci-routing/junit.xml


  audit:
    name: complete test coverage
    needs: [plan, unit, viewer, mcp, kicad-10, kicad-9, routing]
    if: always() && needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-tests-*
          path: ci-receipts
      - name: Require exhaustive disjoint coverage on this commit
        run: python3 tools/ci_tests.py audit ci-receipts --commit "$GITHUB_SHA"

  complete:
    name: ${{ needs.plan.outputs.profile == 'fast' && 'ci-complete-not-requested' || 'ci-complete' }}
    needs: [plan, quality, dco, unit, viewer, mcp, wheel, kicad-10, kicad-9, routing, drawn-floor-bridge, audit]
    if: always() && needs.plan.outputs.profile != 'fast'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every full dependency to succeed
        env:
          CI_PROFILE: ${{ needs.plan.outputs.profile }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci_profiles.py gate --kind full

  fast-result:
    name: ci-fast
    needs: [plan, quality, dco, fast, fast-audit]
    if: always() && needs.plan.outputs.profile == 'fast'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fast result cannot satisfy the complete gate
        env:
          CI_PROFILE: ${{ needs.plan.outputs.profile }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci_profiles.py gate --kind fast
