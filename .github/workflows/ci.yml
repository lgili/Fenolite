name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run pyright src
      - name: Residue scan
        run: uv run python tools/residue/scan.py
      - name: Tests
        run: uv run pytest -q -n auto --dist loadfile

  wheel:
    name: wheel (the built package installs alone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the package and its alias
        run: |
          uv build --out-dir dist
          uv build packaging/phenolite --out-dir dist
      - name: Residue scan of the artefacts
        run: uv run --no-project python tools/residue/scan.py
      - name: Install with no index
        run: |
          uv venv /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv/bin/python --no-index --find-links dist fenolite
      - name: The installed package runs and needs nothing else
        run: |
          cd /tmp
          /tmp/wheel-venv/bin/fenolite capabilities --json > /tmp/capabilities.json
          /tmp/wheel-venv/bin/python -c "import json; assert json.load(open('/tmp/capabilities.json'))['ok']"
          /tmp/wheel-venv/bin/python -c "import importlib.metadata as m; r = m.requires('fenolite') or []; assert all('extra ==' in x for x in r), r"
      - name: The wheel holds no test, private or example file
        run: |
          python3 - <<'PY'
          import glob, zipfile
          (wheel,) = glob.glob("dist/fenolite-*.whl")
          bad = [n for n in zipfile.ZipFile(wheel).namelist() if n.startswith(("tests/", "private/", "examples/"))]
          assert not bad, bad
          PY

  dco:
    name: dco (every commit is signed off)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sign-off check
        run: python3 tools/dco_check.py

  kicad-10:
    name: kicad-10 (kicad-cli oracle and corpus)
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.6@sha256:18693567392b80da435f9fa952ce3a3e534c66eb5a6033f5b9c80aa3b19dd3ec
      options: --user 0
    env:
      HOME: /root
      FENOLITE_CORPUS_CACHE: /root/.cache/fenolite/corpus
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: kicad-cli version
        run: kicad-cli version
      - name: Sync (locked)
        run: uv sync --locked --extra dev
      - name: Corpus cache
        uses: actions/cache@v4
        with:
          path: /root/.cache/fenolite/corpus
          key: corpus-${{ hashFiles('tests/corpus/manifest.toml') }}
      - name: Fetch corpus
        run: uv run python tools/corpus_fetch.py --uses rt0 --uses libs --uses project --uses cfb --uses altium-sch --uses altium-schlib --uses altium-text --exclude-uses heavy
      - name: Oracle and corpus tests
        env:
          FENOLITE_REQUIRE: kicad,corpus
        run: uv run pytest tests/kicad tests/corpus -q -n auto --dist loadfile

  kicad-9:
    name: kicad-9 (kicad-cli 9.0 oracle)
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0.9@sha256:e638b79b0321f29395a5b783e94bb9f3c73303e8da15da27b8f5cb4b67a37729
      options: --user 0
    env:
      HOME: /root
      FENOLITE_CORPUS_CACHE: /root/.cache/fenolite/corpus
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: kicad-cli version
        run: kicad-cli version
      - name: Sync (locked)
        run: uv sync --locked --extra dev
      - name: Corpus cache (rt2-9 rows)
        uses: actions/cache@v4
        with:
          path: /root/.cache/fenolite/corpus
          key: corpus-rt2-9-${{ hashFiles('tests/corpus/manifest.toml') }}
      - name: Fetch the rt2-9 rows
        run: uv run python tools/corpus_fetch.py --uses rt2-9
      - name: Oracle tests
        env:
          FENOLITE_REQUIRE: kicad
        run: uv run pytest tests/kicad -q -rA -n auto --dist loadfile

  routing:
    name: routing (KiCad ${{ matrix.target }}, pinned KiCadRoutingTools and Freerouting)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 9
            image: kicad/kicad:9.0.9@sha256:e638b79b0321f29395a5b783e94bb9f3c73303e8da15da27b8f5cb4b67a37729
          - target: 10
            image: kicad/kicad:10.0.6@sha256:18693567392b80da435f9fa952ce3a3e534c66eb5a6033f5b9c80aa3b19dd3ec
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync (locked)
        run: uv sync --locked --extra dev
      - name: Install system Python venv support
        run: apt-get update && apt-get install -y python3-venv curl
      - name: Install pinned router
        run: |
          git clone --depth 1 --branch v0.22.1 https://github.com/drandyhaas/KiCadRoutingTools.git /tmp/kicadroutingtools
          python3 -m venv /tmp/krt-venv
          /tmp/krt-venv/bin/python -m pip install -r /tmp/kicadroutingtools/requirements.txt
          mkdir -p /tmp/kicadroutingtools/rust_router
          curl -fsSL https://github.com/drandyhaas/KiCadRoutingTools/releases/download/v0.22.1/grid_router-linux-x86_64.so -o /tmp/kicadroutingtools/rust_router/grid_router.so
          echo '652b67e266c58b1e373e503bcf9b5d0b0d3dd4756e1c306100f23edf3d3f989b  /tmp/kicadroutingtools/rust_router/grid_router.so' | sha256sum --check
      - name: Install Java 25 for Freerouting
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install pinned Freerouting jar
        run: |
          mkdir -p /tmp/freerouting
          curl -fsSL https://github.com/freerouting/freerouting/releases/download/v2.4.1/freerouting-2.4.1.jar -o /tmp/freerouting/freerouting-2.4.1.jar
          echo '251101c3eeac22d7e7dfcf6796603279e5d1000283eb82d8f093780f7afc6aa9  /tmp/freerouting/freerouting-2.4.1.jar' | sha256sum --check
      - name: Router gate and loop
        env:
          FENOLITE_REQUIRE: kicad,router,freerouting
          FENOLITE_KRT: /tmp/kicadroutingtools
          FENOLITE_KRT_PYTHON: /tmp/krt-venv/bin/python
          FENOLITE_FREEROUTING_JAR: /tmp/freerouting/freerouting-2.4.1.jar
        run: uv run pytest tests/routing -q -rA
