name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run pyright src
      - name: Residue scan
        run: uv run python tools/residue/scan.py
      - name: Tests
        run: uv run pytest -q

  kicad-10:
    name: kicad-10 (kicad-cli oracle and corpus)
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.6@sha256:18693567392b80da435f9fa952ce3a3e534c66eb5a6033f5b9c80aa3b19dd3ec
      options: --user 0
    env:
      HOME: /root
      FENOLITE_CORPUS_CACHE: /root/.cache/fenolite/corpus
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: kicad-cli version
        run: kicad-cli version
      - name: Sync (locked)
        run: uv sync --locked --extra dev
      - name: Corpus cache
        uses: actions/cache@v4
        with:
          path: /root/.cache/fenolite/corpus
          key: corpus-${{ hashFiles('tests/corpus/manifest.toml') }}
      - name: Fetch corpus
        run: uv run python tools/corpus_fetch.py --uses rt0 --exclude-uses heavy
      - name: Oracle and corpus tests
        env:
          FENOLITE_REQUIRE: kicad,corpus
        run: uv run pytest tests/kicad tests/corpus -q

  kicad-9:
    name: kicad-9 (kicad-cli 9.0 oracle)
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0.9@sha256:e638b79b0321f29395a5b783e94bb9f3c73303e8da15da27b8f5cb4b67a37729
      options: --user 0
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: kicad-cli version
        run: kicad-cli version
      - name: Sync (locked)
        run: uv sync --locked --extra dev
      - name: Oracle tests
        env:
          FENOLITE_REQUIRE: kicad
        run: uv run pytest tests/kicad -q
