# Authored for Fenolite's agent evaluation; every number is a round value chosen for this task.
title = "Parts on both sides"
prompt = """
Make a small printed-circuit board with parts on both sides, as a KiCad project with its fabrication
files.

The circuit, by reference and pin number:
- J1, a two-pin 2.54 mm through-hole header: pin 1 is the supply, pin 2 is ground.
- R1, a chip resistor of 470 ohm, on the top side.
- D1, a chip LED, on the bottom side: pin 1 is the anode, pin 2 the cathode.

The nets:
- J1 pin 1 and R1 pin 1.
- R1 pin 2 and D1 pin 1.
- D1 pin 2 and J1 pin 2.

No other part and no other connection.

Requirements for the board:
- two copper layers, at most 30 mm by 20 mm;
- R1 is placed on the top side and D1 on the bottom side;
- you write the copper yourself instead of using a router, and the net between R1 and D1 changes
  layer through a via;
- the board house's minimums: clearance 0.2 mm, track width 0.25 mm, via diameter 0.7 mm with a
  0.3 mm drill, 0.5 mm between copper and the board edge;
- every net is closed with copper, and the board passes the electrical and design-rule checks of
  the tool you use, with KiCad's own checks among them.

Leave the result in these folders, relative to the folder you are in:
- board/build: the KiCad project (one board file) as the tool builds it;
- board/fab: the fabrication files, with Gerber files (.gbr) and drill files (.drl).

The sizes above are this task's own round numbers; they come from no product. Use parts that the tool
provides itself: no KiCad library is installed on this machine and nothing may be downloaded.
"""

[budget]
minutes = 20

[expect]
project = "board/build"
copper_layers = 2
max_size = ["30mm", "20mm"]
outputs = ["board/fab/**/*.gbr", "board/fab/**/*.drl"]

[expect.nets]
VIN = ["J1-1", "R1-1"]
LED_A = ["R1-2", "D1-1"]
GND = ["D1-2", "J1-2"]
