[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fenolite"
dynamic = ["version"]
description = "PCB automation in Python for engineers and AI agents: create, inspect, compare and convert KiCad and Altium projects, with a browser viewer."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Fenolite contributors" }]
keywords = [
    "pcb", "eda", "kicad", "altium", "hardware-as-code", "electronics",
    "gerber", "drc", "ai-agents", "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]
# The core is stdlib-only. This list MUST stay empty (tests/unit/test_pyproject_invariants.py).
dependencies = []

[project.optional-dependencies]
# Closed list of extras (tests/unit/test_pyproject_invariants.py). Permissive licences only:
# copyleft tools are used behind a process boundary and never appear here (ADR-0004).
geo = ["shapely>=2.1", "pyclipper>=1.3"]
kicad-ipc = ["kicad-python>=0.8"]
# oracles: read-back of fabrication files, and the official MCP SDK whose client checks `fenolite mcp` (c0195)
oracles = ["gerbonara>=1.6; python_version >= '3.12'", "pygerber>=2.4", "mcp==2.3.0"]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.390",
]

[project.entry-points."fenolite.routers"]
direct = "fenolite.routing.direct:DirectRouter"
freerouting = "fenolite.routing.plugins.specctra.freerouting:FreeroutingRouter"
kicadroutingtools = "fenolite.routing.plugins.kicad.routingtools:KicadRoutingToolsRouter"
octilinear = "fenolite.routing.octilinear:OctilinearRouter"

[project.urls]
Homepage = "https://github.com/lgili/Fenolite"
Source = "https://github.com/lgili/Fenolite"
Issues = "https://github.com/lgili/Fenolite/issues"
Changelog = "https://github.com/lgili/Fenolite/blob/main/CHANGELOG.md"
Documentation = "https://github.com/lgili/Fenolite/blob/main/docs/index.md"

[project.scripts]
fenolite = "fenolite.cli.main:main"

[tool.hatch.version]
path = "src/fenolite/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fenolite"]

[tool.hatch.build.targets.sdist]
# An allowlist, so a file left in the repository root never ships (tests/unit/test_pyproject_invariants.py).
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/schemas",
    "/tools",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LEGAL.md",
    "/LEGAL-ANNEX.md",
    "/LICENSE",
    "/NOTICE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's default list without "build", so tests/kicad/build/ is collected (the root build/ is outside testpaths)
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "needs_kicad: requires a kicad-cli binary (skipped when absent)",
    "kicad_min_major(n): skip when the running kicad-cli major is below n (never a failure)",
    "needs_corpus: requires the fetched public test corpus (tools/corpus_fetch.py)",
    "needs_libs: requires the official KiCad libraries (local install or fetched tag)",
    "needs_router: requires KiCadRoutingTools in a separate checkout and interpreter",
    "needs_freerouting: requires the Freerouting jar named by FENOLITE_FREEROUTING_JAR and a Java runtime",
    "slow: long-running test",
    "needs_browser: requires Node's Playwright and its Chromium (the visual tests of the viewer page)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["private", "openspec"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# fenolite import writes its imports for a project where fenolite is a third-party package (change c0275)
"examples/import_python/*.py" = ["I001"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
