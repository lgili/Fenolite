[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fenolite"
dynamic = ["version"]
description = "Headless, agent-first PCB design automation in Python: generate, open, verify, compare, convert and export KiCad (and later Altium) projects from code or the CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Fenolite contributors" }]
keywords = [
    "pcb", "eda", "kicad", "altium", "hardware-as-code", "electronics",
    "gerber", "drc", "ai-agents", "cli",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]
# The core is stdlib-only. This list MUST stay empty (tests/unit/test_pyproject_invariants.py).
dependencies = []

[project.optional-dependencies]
# Closed list of extras (tests/unit/test_pyproject_invariants.py). Permissive licences only:
# copyleft tools are used behind a process boundary and never appear here (ADR-0004).
geo = ["shapely>=2.1", "pyclipper>=1.3"]
kicad-ipc = ["kicad-python>=0.8"]
route = ["freerouting-client>=2.3"]
mcp = ["mcp>=1.0"]
oracles = ["gerbonara>=1.6; python_version >= '3.12'", "pygerber>=2.4"]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.390",
]

[project.scripts]
fenolite = "fenolite.cli.main:main"

[tool.hatch.version]
path = "src/fenolite/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fenolite"]

[tool.hatch.build.targets.sdist]
exclude = ["/private", "/.claude", "/.github", "/verify_results"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's default list without "build", so tests/kicad/build/ is collected (the root build/ is outside testpaths)
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "needs_kicad: requires a kicad-cli binary (skipped when absent)",
    "kicad_min_major(n): skip when the running kicad-cli major is below n (never a failure)",
    "needs_corpus: requires the fetched public test corpus (tools/corpus_fetch.py)",
    "needs_libs: requires the official KiCad libraries (local install or fetched tag)",
    "slow: long-running test",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["private", "openspec"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
