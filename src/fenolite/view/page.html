<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fenolite board viewer</title>
<style>
  :root { --bg:#1b1d22; --panel:#24272e; --panel2:#2b2f37; --line:#3a3f49; --text:#e6e6e6; --muted:#9aa0aa; --accent:#4da3ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  #app { display:grid; grid-template-columns: 260px 1fr; grid-template-rows: 40px 1fr 30px 24px; height:100%; }
  #top { grid-column:1/3; display:flex; align-items:center; gap:8px; padding:0 10px; background:var(--panel); border-bottom:1px solid var(--line); overflow-x:auto; }
  #top .title { font-weight:600; white-space:nowrap; margin-right:6px; }
  button, select, input { background:#2e323b; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:3px 8px; font:inherit; }
  button:hover { border-color:var(--accent); }
  button.on { background:#1f4e7a; border-color:var(--accent); }
  #search { width:180px; }
  #side { grid-row:2/3; background:var(--panel); border-right:1px solid var(--line); overflow:auto; display:flex; flex-direction:column; }
  .ph { padding:6px 10px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); background:var(--panel2); border-bottom:1px solid var(--line); }
  #tree { padding:4px 0 8px; }
  .proj { padding:4px 10px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .grp { padding:3px 10px 3px 18px; cursor:pointer; color:#cfd3da; white-space:nowrap; user-select:none; }
  .grp::before { content:"\25BE  "; color:var(--muted); }
  .grp.closed::before { content:"\25B8  "; }
  .doc { padding:2px 10px 2px 34px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; color:#b9bec7; }
  .doc:hover { background:#ffffff0d; }
  .doc.sel { background:#1f4e7a; color:#fff; }
  .doc.missing { color:#777; font-style:italic; }
  .doc .ic { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  #panels { padding:4px 10px 10px; }
  #panels h3 { margin:12px 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .ov { padding:3px 0; cursor:pointer; border-bottom:1px solid #ffffff10; }
  .ov:hover { color:#fff; }
  .notes { color:var(--muted); font-size:11px; line-height:1.45; }
  kbd { background:#333842; border-radius:3px; padding:0 4px; font-size:11px; }
  #wrap { position:relative; overflow:hidden; grid-row:2/3; }
  canvas { position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; }
  #gl { display:none; cursor:grab; }
  #info { position:absolute; right:10px; top:10px; max-width:380px; background:#24272ee8; border:1px solid var(--line); border-radius:6px; padding:8px 10px; display:none; line-height:1.45; }
  #info b { color:#fff; }
  #doccard { position:absolute; inset:0; display:none; align-items:center; justify-content:center; color:var(--muted); }
  #doccard div { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px 22px; line-height:1.6; max-width:520px; }
  #bar3d { position:absolute; left:10px; top:10px; display:none; gap:6px; background:#24272ed0; border:1px solid var(--line); border-radius:6px; padding:6px; }
  #tabs { grid-column:1/3; display:flex; align-items:stretch; background:var(--panel2); border-top:1px solid var(--line); overflow-x:auto; overflow-y:hidden; }
  #ls { flex:none; margin:3px 6px; padding:0 8px; font-weight:600; }
  .tab { flex:none; display:flex; align-items:center; gap:6px; padding:0 10px; border-right:1px solid var(--line); cursor:pointer; white-space:nowrap; color:#cfd3da; user-select:none; border-bottom:3px solid transparent; }
  .tab:hover { background:#ffffff0a; }
  .tab.cur { background:#ffffff14; color:#fff; font-weight:600; }
  .tab.off { color:#6b7079; }
  .tab.off .sw { opacity:.25; }
  .sw { width:12px; height:12px; border-radius:2px; flex:none; border:1px solid #0008; }
  #lsmenu { position:absolute; left:6px; bottom:56px; background:var(--panel); border:1px solid var(--line); border-radius:6px; display:none; z-index:5; }
  #lsmenu div { padding:5px 14px; cursor:pointer; white-space:nowrap; }
  #lsmenu div:hover { background:#1f4e7a; }
  #status { grid-column:1/3; display:flex; gap:16px; align-items:center; padding:0 10px; background:var(--panel); border-top:1px solid var(--line); color:var(--muted); white-space:nowrap; overflow:hidden; font-size:12px; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="title" id="fname">Board</span>
    <button id="b3d" title="2D / 3D (D)">3D</button>
    <button id="bFit" title="Fit to the window (F)">Fit</button>
    <button id="bFlip" title="View from below / above (B)">View: Top</button>
    <button id="bMeasure" title="Measure a distance (M)">Measure</button>
    <input id="search" placeholder="Part or net…" title="Enter: find">
    <button id="bClear" title="Clear the selection (Esc)">Clear</button>
    <label title="Opacity of the other side"><small>Other side</small> <input id="opac" type="range" min="0" max="100" value="60" style="width:80px;vertical-align:middle"></label>
  </div>
  <div id="side">
    <div class="ph">Projects</div>
    <div id="tree"></div>
    <div id="panels">
      <h3 id="ovTitle" style="display:none">Findings</h3>
      <div id="overlays"></div>
      <h3>Notes</h3>
      <div class="notes" id="notes"></div>
      <h3>Shortcuts</h3>
      <div class="notes"><kbd>wheel</kbd> zoom · <kbd>drag</kbd> pan (2D) / orbit (3D) · <kbd>Shift+drag</kbd> pan (3D) · <kbd>click</kbd> net / part · <kbd>D</kbd> 2D/3D · <kbd>F</kbd> fit · <kbd>B</kbd> flip · <kbd>M</kbd> measure · <kbd>Shift+S</kbd> single layer · <kbd>+</kbd>/<kbd>-</kbd> next / previous layer · <kbd>Esc</kbd> clear</div>
    </div>
  </div>
  <div id="wrap"><canvas id="cv"></canvas><canvas id="gl"></canvas>
    <div id="bar3d"><button id="v3top">Top</button><button id="v3bot">Bottom</button><button id="v3iso">Iso</button>
      <label><input type="checkbox" id="c3body" checked> Bodies</label></div>
    <div id="info"></div><div id="doccard"><div id="doctext"></div></div>
    <div id="lsmenu"></div></div>
  <div id="tabs"><button id="ls" title="Layer sets">LS</button><div id="tablist" style="display:flex"></div></div>
  <div id="status"><span id="coord">x — y —</span><span id="zoomv"></span><span id="cur"></span><span id="gen"></span><span id="live"></span></div>
</div>
<script>
"use strict";
const EMBED = /*__DATA__*/null;
const LIVE = /*__LIVE__*/false;

// ================================================================== stroke font

const FONT = {
  " ": [], "A": ["0,0 2,6 4,0", "0.67,2 3.33,2"], "B": ["0,0 0,6 2.6,6", "@2.6,4.5,1.4,1.5,90,-90", "0,3 2.8,3", "@2.8,1.5,1.2,1.5,90,-90", "2.8,0 0,0"],
  "C": ["@2,3,2,3,40,320"], "D": ["0,0 0,6 2,6", "@2,3,2,3,90,-90", "2,0 0,0"], "E": ["4,6 0,6 0,0 4,0", "0,3 2.8,3"], "F": ["4,6 0,6 0,0", "0,3 2.8,3"],
  "G": ["@2,3,2,3,45,355", "4,2.6 2.4,2.6"], "H": ["0,0 0,6", "4,0 4,6", "0,3 4,3"], "I": ["2,0 2,6", "1,6 3,6", "1,0 3,0"],
  "J": ["4,6 4,1.5", "@2,1.5,2,1.5,0,-180"], "K": ["0,0 0,6", "4,6 0,2", "1.4,3.3 4,0"], "L": ["0,6 0,0 4,0"], "M": ["0,0 0,6 2,2.5 4,6 4,0"],
  "N": ["0,0 0,6 4,0 4,6"], "O": ["@2,3,2,3,0,360"], "P": ["0,0 0,6 2.6,6", "@2.6,4.5,1.4,1.5,90,-90", "2.6,3 0,3"],
  "Q": ["@2,3,2,3,0,360", "2.5,1.5 4,0"], "R": ["0,0 0,6 2.6,6", "@2.6,4.5,1.4,1.5,90,-90", "2.6,3 0,3", "2.2,3 4,0"],
  "S": ["@2,4.5,2,1.5,20,270", "@2,1.5,2,1.5,90,-160"], "T": ["0,6 4,6", "2,6 2,0"], "U": ["0,6 0,1.5", "@2,1.5,2,1.5,180,360", "4,1.5 4,6"],

  "f": ["3.8,5.8 3.2,6 2.4,6 1.8,5.6 1.6,4.8 1.6,0", "0.4,4 3.2,4"], "g": ["@2,2,2,2,0,360", "4,4 4,-0.8", "@2,-0.8,2,1.2,0,-180"],
  "h": ["0,6 0,0", "0,2.4 0.4,3.4 1.2,3.9 2,4 2.8,3.9 3.6,3.4 4,2.4 4,0"], "i": ["2,4 2,0", "2,5.3 2,5.5"],

  "q": ["4,4 4,-2", "@2,2,2,2,0,360"], "r": ["0,4 0,0", "0,2.2 0.6,3.4 1.6,4 2.6,4 3.4,3.6"],
  "s": ["3.8,3.4 3,3.9 2,4 1,3.9 0.3,3.4 0.3,2.6 1,2.2 3,1.8 3.7,1.4 3.7,0.6 3,0.1 2,0 1,0.1 0.2,0.6"],
  "t": ["1.6,5.5 1.6,0.8 2,0.1 2.6,0 3.4,0.2", "0.4,4 3.2,4"], "u": ["0,4 0,1.6 0.4,0.6 1.2,0.1 2,0 2.8,0.1 3.6,0.6 4,1.6", "4,4 4,0"],
  "v": ["0,4 2,0 4,4"], "w": ["0,4 1,0 2,3 3,0 4,4"], "x": ["0,4 4,0", "0,0 4,4"], "y": ["0,4 2,0", "4,4 1.2,-2"], "z": ["0,4 4,4 0,0 4,0"],
  ".": ["1.9,0.1 2.1,0.1"], ",": ["2.1,0.3 2.1,0 1.5,-1"], ":": ["2,0.2 2,0.4", "2,3.6 2,3.8"], ";": ["2,3.6 2,3.8", "2.1,0.3 2.1,0 1.5,-1"],

  "]": ["1,6.5 2.5,6.5 2.5,-0.5 1,-0.5"], "=": ["0.6,4 3.4,4", "0.6,2 3.4,2"], "%": ["0,0 4,6", "@0.9,5,0.9,1,0,360", "@3.1,1,0.9,1,0,360"],

  "<": ["4,5 0,3 4,1"], ">": ["0,5 4,3 0,1"], "@": ["@2,3,2,3,0,330", "@2.2,3,0.9,1.2,0,360"], "°": ["@2,5,0.7,0.7,0,360"],
  "~": ["0,3 0.7,3.7 1.5,3.8 2.5,3.2 3.3,3.3 4,4"], "|": ["2,6.5 2,-1"], "^": ["0.5,4 2,6 3.5,4"],

  "Ω": ["0,0 1.4,0 1.4,0.8 0.4,2 0,3.2 0.4,4.6 1.2,5.6 2,6 2.8,5.6 3.6,4.6 4,3.2 3.6,2 2.6,0.8 2.6,0 4,0"],

const glyphCache = new Map();
function glyph(ch) {
  if (glyphCache.has(ch)) return glyphCache.get(ch);
  const spec = FONT[ch] || FONT[ch.toUpperCase()] || ["0,0 4,0 4,6 0,6 0,0"];
  const out = [];
  for (const s of spec) {
    if (s[0] === "@") { const [cx, cy, rx, ry, a1, a2] = s.slice(1).split(",").map(Number); const n = Math.max(8, Math.ceil(Math.abs(a2 - a1) / 10)), pts = [];
      for (let k = 0; k <= n; k++) { const a = (a1 + (a2 - a1) * k / n) * Math.PI / 180; pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); } out.push(pts); }
    else out.push(s.trim().split(/\s+/).map(p => p.split(",").map(Number)));
  }
  glyphCache.set(ch, out); return out;
}
// A text in board millimetres (Y down): [layer, x, y, h, w, stroke, rot, hj, vj, mirrored, text, comp].
function textPolylines(t) {
  const H = t[3], u = H / 6, ux = (t[4] > 0 ? t[4] : H * 2 / 3) / 4, th = t[6] * Math.PI / 180, c = Math.cos(th), s = Math.sin(th);
  const n = [...t[10]].length, TW = (n - 1) * 6 * ux + 4 * ux;
  const ox = t[7] === "left" ? 0 : t[7] === "right" ? -TW : -TW / 2, oy = t[8] === "bottom" ? 0 : t[8] === "top" ? -6 * u : -3 * u;
  const mir = t[9] ? -1 : 1, out = [];
  [...t[10]].forEach((ch, i) => { for (const pl of glyph(ch)) out.push(pl.map(([gx, gy]) => {
    const lx = (ox + (gx + 6 * i) * ux) * mir, ly = -(oy + gy * u);
    return [t[1] + lx * c + ly * s, t[2] - lx * s + ly * c]; })); });
  return out;
}

// ================================================================== state
const MM = 0.001;   // scene units are micrometres
let PROJECT = null, DOC = null, S = null, cache = null, netCache = new Map(), compCache = new Map(), textCache = new Map(), byLayer = new Map();
const SCENES = new Map();
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, dpr = 1;
const view = { cx: 0, cy: 0, s: 5, mirror: false };
const st = { single: false, measure: false, mpts: [], selNet: -1, selComp: -1, selOv: -1, opac: 0.6, version: null, mode3d: false, cur: null };
const vis = new Map();
const $ = id => document.getElementById(id);

function toMM(scene) {
  const f = v => v * MM;
  for (const pr of scene.prims) { const d = pr[2];
    if (pr[1] === "p" || pr[1] === "o") pr[2] = d.map(r => r.map(f)); else pr[2] = d.map(f);
    if (pr[1] === "a") pr.push(arcOf(pr[2])); }
  for (const t of scene.texts) for (const k of [1, 2, 3, 4, 5]) t[k] = t[k] * MM;
  for (const c of scene.comps) { c.x *= MM; c.y *= MM; if (c.bbox) c.bbox = c.bbox.map(f); }
  for (const r of scene.board) { r.points = r.points.map(f); r.mids = r.mids.map(m => m ? m.map(f) : null); }
  scene.bounds = scene.bounds.map(f); scene.board3d.thickness *= MM;
  for (const b of scene.bodies) { b.ring = b.ring.map(f); b.z0 *= MM; b.z1 *= MM; }
  for (const o of scene.overlays || []) o.pts = o.pts.map(p => p.map(f));
  return scene;
}
// an arc through three points: centre, radius, start and end angles, and the direction (canvas angles, Y down)
function arcOf(d) {
  const [x1, y1, x2, y2, x3, y3] = d, D = 2 * (x1 * (y2 - y3) + x2 * (y3 - y1) + x3 * (y1 - y2));
  if (Math.abs(D) < 1e-12) return null;
  const q1 = x1 * x1 + y1 * y1, q2 = x2 * x2 + y2 * y2, q3 = x3 * x3 + y3 * y3;
  const cx = (q1 * (y2 - y3) + q2 * (y3 - y1) + q3 * (y1 - y2)) / D, cy = (q1 * (x3 - x2) + q2 * (x1 - x3) + q3 * (x2 - x1)) / D;
  const a1 = Math.atan2(y1 - cy, x1 - cx), am = Math.atan2(y2 - cy, x2 - cx), a3 = Math.atan2(y3 - cy, x3 - cx), T = 2 * Math.PI;
  const d13 = ((a3 - a1) % T + T) % T, d1m = ((am - a1) % T + T) % T;
  return { cx, cy, r: Math.hypot(x1 - cx, y1 - cy), a1, a3, ccw: d1m > d13 };
}
function ringSamples(ring) {   // a board ring with its arcs, as points
  const p = ring.points, out = [];
  for (let i = 0; i < p.length; i += 2) { const j = (i + 2) % p.length, m = ring.mids[i / 2]; out.push([p[i], p[i + 1]]);
    if (m) { const a = arcOf([p[i], p[i + 1], m[0], m[1], p[j], p[j + 1]]); if (a) { let span = ((a.a3 - a.a1) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI); if (a.ccw) span -= 2 * Math.PI;
      for (let k = 1; k < 16; k++) { const t = a.a1 + span * k / 16; out.push([a.cx + a.r * Math.cos(t), a.cy + a.r * Math.sin(t)]); } } } }
  return out;
}
function boardPath() { const bp = new Path2D(); for (const r of S.board) { const pts = ringSamples(r); pts.forEach((q, k) => k ? bp.lineTo(q[0], q[1]) : bp.moveTo(q[0], q[1])); bp.closePath(); } return bp; }

function lighten(hex, f) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r + (255 - r) * f); g = Math.round(g + (255 - g) * f); b = Math.round(b + (255 - b) * f); return `rgb(${r},${g},${b})`; }
function ringPath(p, flat) { p.moveTo(flat[0], flat[1]); for (let i = 2; i < flat.length; i += 2) p.lineTo(flat[i], flat[i + 1]); p.closePath(); }
function strokePath(c, w) { let p = c.strokes.get(w); if (!p) { p = new Path2D(); c.strokes.set(w, p); } return p; }

    quad(edge, P3(a[0], a[1], 0), P3(c2[0], c2[1], 0), P3(c2[0], c2[1], T), P3(a[0], a[1], T), ec); } }
  V3.parts.push(makePart(top, "top"), makePart(bot, "bottom"), makePart(edge, null));
  V3.bodyPart = null; rebuildBodies();
  if (!V3.built) { V3.cam.tx = (b[0] + b[2]) / 2; V3.cam.ty = -(b[1] + b[3]) / 2; V3.cam.tz = 0; V3.cam.dist = Math.max(w, h) * 1.7; }

}
const BODY = "#3c4048", BODY_SEL = "#ffd84d";
function rebuildBodies() {

}
function mul(a, b) { const o = new Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = s; } return o; }

  const y = [z[1] * x[2] - z[2] * x[1], z[2] * x[0] - z[0] * x[2], z[0] * x[1] - z[1] * x[0]];
  return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -(x[0] * e[0] + x[1] * e[1] + x[2] * e[2]), -(y[0] * e[0] + y[1] * e[1] + y[2] * e[2]), -(z[0] * e[0] + z[1] * e[1] + z[2] * e[2]), 1]; }

}
function set3D(on) {

  glc.style.display = on ? "block" : "none"; cv.style.display = on ? "none" : "block"; $("bar3d").style.display = on ? "flex" : "none";
  if (on) { measure(); if (!V3.built && !build3D()) { set3D(false); return; } resize3D(); } else { fitted = false; resize(); }
}
function camPreset(kind) { const c = V3.cam; if (kind === "top") { c.yaw = -Math.PI / 2; c.pitch = 1.5699; } else if (kind === "bottom") { c.yaw = -Math.PI / 2; c.pitch = -1.5699; }
  else { c.yaw = -2.2; c.pitch = 0.75; } const b = S.bounds; c.tx = (b[0] + b[2]) / 2; c.ty = -(b[1] + b[3]) / 2; c.tz = 0; c.dist = Math.max(b[2] - b[0], b[3] - b[1]) * 1.7; draw3D(); }
let drag3 = null;
glc.addEventListener("mousedown", e => { drag3 = { x: e.offsetX, y: e.offsetY, pan: e.shiftKey || e.button === 2, cam: { ...V3.cam } }; glc.style.cursor = "grabbing"; });

  if (drag3.pan) { const k = c.dist / H, f = Math.sin(c.pitch);
    c.tx = c0.tx - (-dx * Math.sin(c.yaw) - dy * f * Math.cos(c.yaw)) * k; c.ty = c0.ty - (dx * Math.cos(c.yaw) - dy * f * Math.sin(c.yaw)) * k; c.tz = c0.tz + dy * Math.cos(c.pitch) * k; }
  else { c.yaw = c0.yaw - dx * 0.008; c.pitch = Math.max(-1.5699, Math.min(1.5699, c0.pitch + dy * 0.008)); }
  draw3D(); });
window.addEventListener("mouseup", () => { if (drag3) { drag3 = null; glc.style.cursor = "grab"; } });
glc.addEventListener("wheel", e => { e.preventDefault(); V3.cam.dist = Math.min(Math.max(V3.cam.dist * Math.exp(e.deltaY * 0.0012), 5), 3000); draw3D(); }, { passive: false });
$("v3top").onclick = () => camPreset("top");
$("v3bot").onclick = () => camPreset("bottom");
$("v3iso").onclick = () => camPreset("iso");
$("c3body").onchange = e => { V3.bodies = e.target.checked; draw3D(); };

// ================================================================== layer tabs (bottom bar)
const TAB_ORDER = id => { const k = id.endsWith(".Cu") ? (id === "F.Cu" ? 0 : id === "B.Cu" ? 2 : 1) : id.startsWith("Mech") ? 3 : id.endsWith("SilkS") ? 4 : id.endsWith("Paste") ? 5 : id.endsWith("Mask") ? 6
  : id.endsWith("CrtYd") ? 7 : id.endsWith("Fab") ? 8 : id === "Edge.Cuts" ? 9 : id.startsWith("View.") ? 11 : 10; return k; };
function tabLayers() { return [...S.layers].sort((a, b) => TAB_ORDER(a.id) - TAB_ORDER(b.id) || (a.id.startsWith("B.") - b.id.startsWith("B.")) || a.id.localeCompare(b.id, undefined, { numeric: true })); }
function buildTabs() {
  const box = $("tablist"); box.innerHTML = "";
  for (const l of tabLayers()) {
    const t = document.createElement("div"); t.className = "tab" + (l.id === st.cur ? " cur" : "") + (vis.get(l.id) ? "" : " off");
    t.style.borderBottomColor = l.id === st.cur ? l.color : "transparent"; t.title = `${l.name} (${l.kind}) · click: current layer · click the swatch or right-click: show / hide`;
    t.innerHTML = `<span class="sw" style="background:${l.color}"></span><span>${esc(l.name)}</span>`;
    t.querySelector(".sw").onclick = e => { e.stopPropagation(); vis.set(l.id, !vis.get(l.id)); buildTabs(); draw(); };
    t.onclick = () => setCurrent(l.id);
    t.oncontextmenu = e => { e.preventDefault(); vis.set(l.id, !vis.get(l.id)); buildTabs(); draw(); };
    box.appendChild(t);
  }
  const cur = S.layers.find(l => l.id === st.cur); $("cur").textContent = cur ? `current: ${cur.name}${st.single ? " (single layer)" : ""}` : "";
}
function setCurrent(id) { st.cur = id; vis.set(id, true); buildTabs(); draw(); }
function stepCurrent(dir) { const L = tabLayers().filter(l => vis.get(l.id)); if (!L.length) return; let i = L.findIndex(l => l.id === st.cur); i = (i + dir + L.length) % L.length; setCurrent(L[i].id); }
const SETS = { "All layers": () => true, "Signal layers": l => l.kind === "copper" || VIEWL(l.id), "Top side": l => l.side !== "bottom", "Bottom side": l => l.side !== "top", "Default": l => l.visible };
$("ls").onclick = e => { e.stopPropagation(); const mnu = $("lsmenu"); mnu.innerHTML = ""; for (const name of Object.keys(SETS)) { const d = document.createElement("div"); d.textContent = name;
  d.onclick = () => { for (const l of S.layers) vis.set(l.id, SETS[name](l)); mnu.style.display = "none"; buildTabs(); draw(); }; mnu.appendChild(d); } mnu.style.display = mnu.style.display === "block" ? "none" : "block"; };

// ================================================================== project tree (left panel)
const KIND_COLOR = { pcb: "#3fb950", schematic: "#d29922", "schematic-library": "#a371f7", "pcb-library": "#58a6ff", "integrated-library": "#58a6ff", "output-job": "#8b949e", rules: "#8b949e",

function docCard(d) {

async function sceneOf(d) {

  const r = await fetch(`scene/${encodeURIComponent(d.id)}.json`, { cache: "no-store" }); if (!r.ok) throw new Error(await r.text());

// ================================================================== scene, overlays and notes

    ov.appendChild(d); });

    `<br>${c.footprints || 0} parts · ${c.pads || 0} pads · ${c.tracks || 0} tracks · ${c.vias || 0} vias · ${c.zones || 0} zones`;

$("b3d").onclick = () => set3D(!st.mode3d);
$("bFit").onclick = () => st.mode3d ? camPreset("iso") : fit();
$("bFlip").onclick = flip;
$("bMeasure").onclick = () => toggle("measure", "bMeasure");
$("bClear").onclick = () => { st.mpts = []; st.selOv = -1; select(null); };
$("opac").oninput = e => { st.opac = e.target.value / 100; draw(); };

let drag = null;
cv.addEventListener("mousedown", e => { if (document.activeElement && document.activeElement.blur) document.activeElement.blur();   // shortcuts follow the board
  drag = { x: e.offsetX, y: e.offsetY, cx: view.cx, cy: view.cy, moved: false }; });
window.addEventListener("mouseup", e => { if (!drag) return; const d = drag; drag = null;
  if (d.moved || e.target !== cv) return; const [x, y] = s2w(e.offsetX, e.offsetY);
  if (st.measure) { if (st.mpts.length >= 2) st.mpts = []; st.mpts.push([x, y]); draw(); return; }
  select(pick(e.offsetX, e.offsetY)); });
cv.addEventListener("mousemove", e => { if (!S) return; const [x, y] = s2w(e.offsetX, e.offsetY);
  $("coord").textContent = `x ${x.toFixed(3)}  y ${y.toFixed(3)} mm`;

window.addEventListener("keydown", e => { if (e.target.tagName === "INPUT" || !S) return;
  const k = e.key;
  if (k === "d" || k === "D") set3D(!st.mode3d);
  else if (k === "f" || k === "F") { if (st.mode3d) camPreset("iso"); else fit(); }
  else if (st.mode3d) return;
  else if ((k === "S" || k === "s") && e.shiftKey) { st.single = !st.single; buildTabs(); draw(); }
  else if (k === "+" || k === "=") stepCurrent(1); else if (k === "-" || k === "_") stepCurrent(-1);
  else if (k === "b" || k === "B") flip(); else if (k === "m" || k === "M") toggle("measure", "bMeasure");
  else if (k === "Escape") { st.mpts = []; st.selOv = -1; select(null); } });

// ================================================================== start: embedded data or the live server
async function start() {
  if (EMBED) { PROJECT = EMBED.project; for (const [id, sc] of Object.entries(EMBED.scenes)) SCENES.set(id, toMM(sc)); }
  else if (LIVE) { PROJECT = await (await fetch("project.json", { cache: "no-store" })).json(); }
  buildTree();
  const docs = PROJECT ? PROJECT.groups.flatMap(g => g.documents) : [];
  const want = (EMBED && EMBED.open) || (PROJECT && PROJECT.open);
  const d = docs.find(x => x.id === want) || docs.find(x => x.viewable && x.present) || docs[0];
  if (d) await openDoc(d);
  if (LIVE) setInterval(poll, 2000);
}
async function poll() {
  if (!DOC || !DOC.viewable) return;
  try { const v = await (await fetch(`version/${encodeURIComponent(DOC.id)}`, { cache: "no-store" })).json();
    $("live").textContent = v.error ? `error: ${v.error}` : v.building ? "reading…" : v.updated ? `live · updated ${v.updated}` : "live";
    if (v.version && st.version && v.version !== st.version && !v.building) { SCENES.delete(DOC.id); await openDoc(DOC, true); }
    st.version = v.version || st.version;
  } catch (e) { $("live").textContent = "server not reachable"; }
}
start();
