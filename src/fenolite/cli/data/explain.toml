# What every error code and issue code of Fenolite means and what to do about it (`fenolite explain`).
# One table per code: `meaning` and `fix`, each at most 400 characters, and `see`, a heading of
# docs/cli-contract.md. A table whose name ends in `.*` explains every code of that family.
# The texts are written for Fenolite from its own code and docs. tests/unit/cli/test_explain_cmd.py
# fails for a code without a table and for a table without a code.

["FEN-1001"]
meaning = "Fenolite raised an exception it did not expect. This is a bug in Fenolite, not a problem of the input."
fix = "Report the command line and the input; do not retry the same call unchanged."
see = "Exit codes"

["FEN-1002"]
meaning = "A file of the plan could not be written: the folder or the file refused it, the disk is full, or a path is blocked. Every target and backup was put back. Temporary-file cleanup is best effort if the filesystem also refuses deletion."
fix = "Read the path and the reason in the message, remove the cause, and run the same command again; under --plan the staged plan is still there. This is not a bug of Fenolite: retryable is true."
see = "Writing files"

["FEN-1003"]
meaning = "The command was stopped by a signal (SIGTERM, or SIGINT from Ctrl+C). The tools it had started were stopped, a write in progress was put back, and nothing was written."
fix = "Run the same command again. A stopped route goes on from the router runs that had finished."
see = "Writing files"

["FEN-1004"]
meaning = "A write failed or was interrupted, and restoring a target or backup also failed. Some files may have changed. Remaining recovery files were retained; retryable is false."
fix = "Do not retry or delete recovery files. Inspect result.recovery.failed and result.recovery.preserved, copy the retained files to a safe place, and restore the intended project state. Review a new plan only after recovery."
see = "Writing files"

["FEN-2001"]
meaning = "The command line is wrong: an unknown flag, a missing argument, a value outside the accepted set, or an input the command does not take."
fix = "Read the message and the hint, or run the command with --help, and correct the arguments."
see = "Exit codes"

["FEN-2002"]
meaning = "A path given to --fields does not exist in the command's result."
fix = "Run the command once with --json and without --fields to see the result keys, then name existing dotted paths."
see = "Output"

["FEN-2003"]
meaning = "--dry-run and --confirm were given together, and they ask for opposite things."
fix = "Pass --dry-run to see the plan, or --confirm to write; never both."
see = "Writing files"

["FEN-2004"]
meaning = "The value of --timestamp is not an ISO 8601 date and time."
fix = "Pass a value such as 2026-01-01T00:00:00Z."
see = "Determinism"

["FEN-3001"]
meaning = "An input file or folder is missing, is not of the expected kind, or cannot be opened."
fix = "Check the path, relative to the working directory, and its permissions."
see = "Exit codes"

["FEN-3002"]
meaning = "The input was written by a KiCad version newer than this Fenolite reads."
fix = "Upgrade Fenolite, or save the file from a supported KiCad version."
see = "KiCad output"

["FEN-3003"]
meaning = "The input's format version is older than the oldest one Fenolite reads."
fix = "Upgrade the file with the kicad-cli upgrade command for its kind, which the hint names, then run again."
see = "KiCad output"

["FEN-3004"]
meaning = "The input is malformed: a syntax error, a missing version, a wrong value or a script that failed. The message and 'where' locate the problem."
fix = "Correct the file at the place 'where' names; for a file that KiCad wrote, re-save it in KiCad."
see = "Exit codes"

["FEN-3005"]
meaning = "Geometry in the input cannot be represented exactly, for example an arc through three points on a line."
fix = "Correct the geometry the message names, with its code and points."
see = "Exit codes"

["FEN-3006"]
meaning = "A file that 'fenolite fetch' obtained, from the network or from --from FILE, does not have the size or the SHA-256 pinned for the tool. Nothing was written. The message holds the digest that was expected and the one that was found."
fix = "Run the command again; a download may have been cut or altered on the way. With --from, name the file of the pinned version, downloaded from the address that --dry-run shows."
see = "fetch"

["FEN-3007"]
meaning = "A file the command would read is kept only online by a sync client (OneDrive, iCloud Drive and the like): its operating system marks it as a placeholder. Reading it would make the client download it, and may block. Nothing was read."
fix = "Make the project folder available offline in the sync client, wait until it is downloaded, and run the command again."
see = "snapshot"

["FEN-4001"]
meaning = "The command would write files and was given neither --dry-run nor --confirm, so it wrote nothing."
fix = "Review result.plan, then run the same command with --confirm to write, or with --dry-run to only preview."
see = "Writing files"

["FEN-4002"]
meaning = "The plan named by --plan cannot be written as it was reviewed: a target or a declared input changed since the dry run, the command line or the working folder is another one, the staged bytes are damaged, or no plan of that id is staged and the plan made now has another id. Nothing was written."
fix = "Read the message, which names the first reason. Run the command with --dry-run again, review the new plan, and confirm it with --confirm --plan and its new id."
see = "Writing files"

["FEN-5001"]
meaning = "The command ran and reported at least one issue of severity error. The envelope on stdout holds them."
fix = "Read 'issues' in the envelope, and run 'fenolite explain' on a code you do not know; --format concise shows one issue per code."
see = "Exit codes"

["FEN-6001"]
meaning = "An external tool that the command needs, such as kicad-cli, was not found or did not answer."
fix = "Install the tool, or name it with --kicad-cli or FENOLITE_KICAD_CLI; 'fenolite doctor' shows what Fenolite finds."
see = "Discovery"

["FEN-6002"]
meaning = "The external tool was found but its version is not supported, or it is older than the file it has to read."
fix = "Install a supported version; 'fenolite capabilities' lists the supported majors."
see = "Discovery"

["FEN-6003"]
meaning = "'fenolite fetch' could not download the tool: no network, a proxy or a firewall, a redirect to an address that is not https, or the publisher's address did not answer. Nothing was written."
fix = "Retry later. On a machine without a network, download the file another way from the address that --dry-run shows and install it with --from FILE: the size and the SHA-256 are checked the same way."
see = "fetch"

["FEN-7001"]
meaning = "The operation would lose or overwrite information, so Fenolite refused it and wrote nothing."
fix = "Read the issues to see what would be lost. Change the input, or pass --allow-lossy when the hint names it and the loss is acceptable."
see = "KiCad output"

["FEN-7002"]
meaning = "The target format version is older than the input's, and Fenolite does not downgrade files."
fix = "Choose a target at least as new as the input with --kicad-version."
see = "KiCad output"

["FEN-7003"]
meaning = "The input comes from KiCad 8.0, which Fenolite reads but does not write back."
fix = "Convert it with 'kicad-cli pcb upgrade' of KiCad 10, or re-save it in KiCad 9, then run again."
see = "KiCad output"

["FEN-7004"]
meaning = "fenolite build --frozen found that the design lock would change: a new, released, moved or replaced ref, or another design name. A frozen build never writes the lock, and nothing was written."
fix = "Build without --frozen, review result.lock.changes and the planned lock, commit the lock, then build frozen again."
see = "build"

["altium.bus-flattened"]
meaning = "A bus of the design is drawn as its nets: its nets are not one stem followed by consecutive integers, or one of them is a power net, a harness net or a net of another bus."
fix = "Nothing to do; name the nets <stem><n> with consecutive integers to have the bus drawn as a bus."
see = "Build target"

["altium.copper-board-mismatch"]
meaning = "The board given with --copper-from does not match the design: a component, a footprint, a pad net or the outline differs."
fix = "Build the KiCad board from the same script first, or correct the script, so both describe one design."
see = "Build target"

["altium.copper-invalid"]
meaning = "A copper item cannot be written: a track of zero length, a width of 0 or less, a drill not below its diameter, or an unknown net id."
fix = "Correct the item that 'where' names in the script or in the source board."
see = "Build target"

["altium.copper-layer"]
meaning = "A track, arc, via or zone names a layer that is not one of the board's copper layers."
fix = "Move the item to a copper layer of the board, or declare the stack-up that holds its layer."
see = "Build target"

["altium.copper-net-missing"]
meaning = "Copper of the source board is on a net whose name the design does not hold."
fix = "Rename the net in the script or re-route the source board from the current design."
see = "Build target"

["altium.copper-no-document"]
meaning = "A copper source was given, but the PCB document is not written in this build."
fix = "Meet the conditions of the PCB document (see altium.pcbdoc-not-written) or drop the copper source."
see = "Build target"

["altium.copper-stack"]
meaning = "The number of copper layers of the board differs from the count the build asks for, a copper layer is named twice, or a plane names a wrong layer or net."
fix = "Build with the copper count of the board, and put planes on inner layers with nets of the design."
see = "Build target"

["altium.footprint-extras-dropped"]
meaning = "The texts, properties or 3D model links of a footprint are not written to the Altium library."
fix = "Nothing to do unless you need them; add them in Altium."
see = "Build target"

["altium.footprint-form"]
meaning = "A footprint reference is not of the form library:name with both parts."
fix = "Write the footprint as library:name in the script."
see = "Build target"

["altium.footprint-name-collision"]
meaning = "Two KiCad footprint links give the same Altium footprint name."
fix = "Rename one of the footprints or use one library entry for both parts."
see = "Build target"

["altium.footprint-unresolved"]
meaning = "A KiCad footprint link of the script does not resolve to a library file, so the footprint is not written."
fix = "Add the library to the script's libraries or correct the link."
see = "Build target"

["altium.footprint-unsupported"]
meaning = "A footprint holds a pad or a graphic that has no exact Altium form, so the footprint is refused."
fix = "Use a footprint with supported pad shapes, or accept that this part has no footprint in the output."
see = "Build target"

["altium.generic-symbols"]
meaning = "Components that name Altium library links were drawn with generic bodies, because Fenolite does not read those libraries here."
fix = "Nothing to do; replace the symbols in Altium if their drawing matters."
see = "Build target"

["altium.harness-name"]
meaning = "A harness type or entry name holds '=', ',' or ';', collides with another name in letter case, or equals a net name."
fix = "Rename the harness type or the entry."
see = "Build target"

["altium.harness-net-shared"]
meaning = "A net is a member of two harnesses, or twice of one."
fix = "Give each net to one harness entry only."
see = "Build target"

["altium.harness-power-net"]
meaning = "A member of a harness is also a member of a power interface."
fix = "Take the power net out of the harness."
see = "Build target"

["altium.import.bad-geometry"]
meaning = "A width, a diameter, a hole or a radius of 0 or less, or a region of fewer than three vertices; the record is not mapped."
fix = "Read the issue's location and correct the object in Altium (a size of 0 or less, or a region of fewer than three vertices)."
see = "Altium import"

["altium.import.bad-length"]
meaning = "A length text is not a decimal number in `mil` or `mm`; the entity that needs it is not mapped. Component bodies are retained with unknown projection."
fix = "Read the issue's location, open the record in Altium and save the document again; report the text if Altium shows it as valid."
see = "Altium import"

["altium.import.bad-stack"]
meaning = "The copper chain of the board record holds fewer than two layers; the board is read with `F.Cu` and `B.Cu`."
fix = "Check the board file in Altium: its layer stack holds fewer than two copper layers, or the board record is damaged."
see = "Altium import"

["altium.import.body-unknown"]
meaning = "A retained component body has an unproved projection or extent."
fix = "Review the source body side, model type and heights; supply evidenced geometry before mechanical analysis."
see = "Altium import"

["altium.import.bus-member"]
meaning = "Count of bus members without a net."
fix = "Nothing to do; a bus member without a net is not connected on the sheet."
see = "Altium import"

["altium.import.bus-width"]
meaning = "Two bus identifiers that join have different widths; the common prefix is joined."
fix = "Make the two bus identifiers the same width in Altium, then check the joined members."
see = "Altium import"

["altium.import.channel-naming"]
meaning = "Channels of a repeated sheet: components that the project's designator format could not name (they are <designator>@<channel>); or a sheet entry `Repeat(NAME)` whose parent sheet has no bus `NAME` with a member per channel; or components of `Repeat` channels that no board component links to; or components that the PCB document names otherwise than the format (its names are taken)."
fix = "Import the project with its PCB document or set a predefined designator format; give the parent's bus one member per channel; check that the board was updated from the schematic."
see = "Altium import"

["altium.import.channels"]
meaning = "A sheet is named by more than one sheet symbol, or by a sheet symbol whose designator is `Repeat(NAME, first, last)`. It is read once per symbol or once per index; each instance is a channel with its own components and nets, named by the board or by the project's designator format."
fix = "Nothing."
see = "Altium import"

["altium.import.copper-shape"]
meaning = "Count of fills and regions on copper, imported as graphics with their net in the bag."
fix = "Nothing to do; the shapes are graphics with their net in the bag."
see = "Altium import"

["altium.import.document-skipped"]
meaning = "A document of a project is outside the project folder, missing or unreadable; the design is built from the rest."
fix = "Put the document inside the project folder, or correct its path in the project file."
see = "Altium import"

["altium.import.duplicate-net"]
meaning = "Two net records hold one name; they are one net."
fix = "Nothing to do; the two records are read as one net."
see = "Altium import"

["altium.import.duplicate-net-name"]
meaning = "Two nets end with one name; the later one is renamed `<name>#<k>`."
fix = "Rename one of the nets in the source, or accept the suffix the import added."
see = "Altium import"

["altium.import.duplicate-sheet-name"]
meaning = "Two sheet symbols of one sheet have one designator; the second module path gets `#2`."
fix = "Give the two sheet symbols different designators in Altium."
see = "Altium import"

["altium.import.extra-board"]
meaning = "A project lists more than one PCB document; only the first is read."
fix = "Import the other PCB document by itself if you need it."
see = "Altium import"

["altium.import.harness-entry"]
meaning = "Count of harness entries without a net."
fix = "Nothing to do; a harness entry without a net is not connected on the sheet."
see = "Altium import"

["altium.import.harness-nested"]
meaning = "A harness entry carries a harness of its own; it is not resolved."
fix = "Nothing to do for a read; the nested harness is kept unresolved. Flatten it in Altium if its nets matter."
see = "Altium import"

["altium.import.inexact"]
meaning = "Counts of lengths and angles that were rounded; the originals are in the entities' `altium` bags."
fix = "Nothing to do; the original values are in the entities' altium bags."
see = "Altium import"

["altium.import.layer-outside-stack"]
meaning = "A primitive lies on a layer id outside the copper chain and the layer table; it goes to `Altium.<id>` (one issue per id)."
fix = "Nothing to do for a read. Map the layer by hand if you need it: its objects are on the layer Altium.<id>."
see = "Altium import"

["altium.import.linked-by-designator"]
meaning = "Count of PCB components linked to a schematic component by designator, not by unique-id path."
fix = "Nothing to do; update the board from the schematic in Altium to restore the unique-id links."
see = "Altium import"

["altium.import.model-unread"]
meaning = "An embedded 3D model of a component body is missing from the Models storage or does not inflate."
fix = "Nothing to do for the board; the viewer draws that body extruded. Re-embed the model in Altium to see it in 3D."
see = "Altium import"

["altium.import.multi-class"]
meaning = "Count of nets in more than one net class; the first class by name is kept."
fix = "Nothing to do; put each net in one class in Altium if the choice matters."
see = "Altium import"

["altium.import.no-designator"]
meaning = "A schematic component has no designator record; its reference is empty."
fix = "Give the component a designator in Altium."
see = "Altium import"

["altium.import.option-ignored"]
meaning = "A project option that the import does not apply (`AppendSheetNumberToLocalNets`)."
fix = "Nothing to do; check the local net names if the option matters to you."
see = "Altium import"

["altium.import.pin-map"]
meaning = "Count of pin map records of footprint models that name no pad for a pin, or a pad another pin holds. The model gives a pad one pin: such a pad is left off the pin, and the record is kept in the component's altium bag (`pin_pads`). A record that lists several pads is not counted: the pin takes each of them."
fix = "Nothing. A pad left off its pin shows as covered by the PCB document only."
see = "Altium import"

["altium.import.padstack-unknown"]
meaning = "A pad's stack mode or hole shape is outside the table; the pad gets no padstack."
fix = "Nothing to do for a read; the pad keeps its plain shape. Report the stack mode or hole shape if you need it."
see = "Altium import"

["altium.import.pcb-only-component"]
meaning = "A component of the PCB document links to no schematic component; it is added to the circuit."
fix = "Update the board from the schematic in Altium, or accept the component as it is on the board."
see = "Altium import"

["altium.import.pcb-only-net"]
meaning = "Count of nets of the PCB document that the sheets do not hold; they are added to the circuit."
fix = "Update the board from the schematic in Altium, or accept the nets as they are on the board."
see = "Altium import"

["altium.import.repeated-sheet"]
meaning = "A `Repeat(` statement of a sheet symbol that is not instantiated: it has not the form `Repeat(NAME, first, last)`, its first index is above its last, or its channels would bring the project above 256 sheet instances. One instance of its sheet is read; the other channels are missing from the circuit."
fix = "Correct the statement in Altium, or split the project so that it stays within 256 instances."
see = "Altium import"

["altium.import.rule-unmapped"]
meaning = "Count of rule records of one rule kind that do not map, with the mapper's reasons."
fix = "Nothing to do; state the rules again as Fenolite rules if you need them."
see = "Altium import"

["altium.import.scope"]
meaning = "The net identifier scope that was used."
fix = "Nothing to do."
see = "Altium import"

["altium.import.scope-unknown"]
meaning = "The project's hierarchy mode has no known meaning; the automatic scope is used."
fix = "Set the project's net identifier scope in Altium to a named mode, or check the nets of the result."
see = "Altium import"

["altium.import.sheet-loop"]
meaning = "A sheet symbol names one of its own ancestors; the import does not descend."
fix = "Break the loop in the project: a sheet symbol must not name a sheet above it."
see = "Altium import"

["altium.import.sheet-missing"]
meaning = "A sheet symbol names a sheet that is not among the inputs; its entries stay named points."
fix = "Pass the missing sheet too, or import the project file so that every sheet is found."
see = "Altium import"

["altium.import.unknown-member"]
meaning = "A net class lists a name that is no net."
fix = "Remove the stale name from the net class in Altium, or ignore it: the class is read without that member."
see = "Altium import"

["altium.import.unmapped"]
meaning = "Counts, by kind, of the records that gave no model entity, and the storages kept as bytes."
fix = "Nothing to do; the counts say what the import did not carry over."
see = "Altium import"

["altium.import.via-span"]
meaning = "A via's start or end layer is outside the copper chain; it is read as a through via."
fix = "Check the via's layer pair in Altium; it is read as a through via."
see = "Altium import"

["altium.import.zone-arc"]
meaning = "Count of zones whose outline holds an arc vertex; their model outline is empty."
fix = "Nothing to do for a read; draw the zone outline again if you need it in the model."
see = "Altium import"

["altium.import.zone-hole-outside"]
meaning = "Count of holes of poured regions that lie outside their region's outline; they are dropped, so the fill is solid where the document meant a hole."
fix = "Repour the polygon in the tool that wrote the document and import again; the count says how many holes were left out."
see = "Altium import"

["altium.lib-id-form"]
meaning = "A lib_id is not of the form library:name with both parts."
fix = "Write the symbol reference as library:name."
see = "Build target"

["altium.library-too-large"]
meaning = "A schematic library would need more than 109 FAT sectors, which the compound file writer does not produce."
fix = "Split the library, or use fewer distinct symbols."
see = "Build target"

["altium.name-case-collision"]
meaning = "Two net names or two references differ only in letter case, which Altium does not tell apart."
fix = "Rename one of them."
see = "Build target"

["altium.no-footprint"]
meaning = "A part names no footprint, so its component has none in the output."
fix = "Give the part a footprint in the script."
see = "Build target"

["altium.not-lowered"]
meaning = "Part of the design stays in the model only and is not written to the Altium files; the message says which part. where names one item as <kind>/<id>, the stack-up, design-rules/<kind> (a warning: a rule of the script that the PCB document does not hold), body/<id> (a component body), via-protection (covering, plugging, capping, filling or an unstated tenting side of vias) or impedance (targets)."
fix = "Nothing to do if you do not need it in Altium; otherwise enter it there by hand. A rule: give every limit Altium's rule holds and select all objects, a net or a net class. A component body: build with --altium-bodies extruded, or set the height in Altium. Via protection: state the tenting with design.via_protection(protect(tenting=...)) or protection=."
see = "Build target"

["altium.outjob-not-listed"]
meaning = "The existing project file was kept and does not list the output job the build wrote. It was kept because it was changed since a build wrote it, or the folder holds no record of it; a project file that is as a build wrote it gets the job added by the build."
fix = "Add the .OutJob file to the project in Altium, or remove the project file from --out and build again."
see = "Build target"

["altium.pcb-not-in-project"]
meaning = "The existing project file was kept and does not list the PCB document or the PCB library that the build wrote. The info names the files the kept file lacks; when the kept file cannot be read, it names every PCB file and its hint says so."
fix = "Add the files to the project in Altium, or remove the project file from --out and build again."
see = "Build target"

["altium.pcb-read.bad-frame"]
meaning = "A name list, a section-key table or a wide-string table of the PCB file does not parse."
fix = "The affected names are missing from the reading; re-save the file in Altium if they matter."
see = "inspect"

["altium.pcb-read.bad-index"]
meaning = "Records name a net, component or polygon index that does not exist in the file."
fix = "The records are read without that link; re-save the file in Altium if the links matter."
see = "inspect"

["altium.pcb-read.bad-stack"]
meaning = "The copper layer chain of the board links to a layer without a name, or loops."
fix = "The layer stack cannot be trusted; re-save the file in Altium."
see = "inspect"

["altium.pcb-read.bad-value"]
meaning = "A typed key holds a text that does not parse, so its value is absent from the reading."
fix = "Check the key that 'where' names; the rest of the record is read."
see = "inspect"

["altium.pcb-read.count-mismatch"]
meaning = "A count in a stream header differs from the number of records read."
fix = "Treat the stream as possibly incomplete; re-save the file in Altium."
see = "inspect"

["altium.pcb-read.missing-stream"]
meaning = "A footprint that the library lists has no storage in the file."
fix = "The footprint is absent from the reading; re-save the library in Altium."
see = "inspect"

["altium.pcb-read.short-record"]
meaning = "A subrecord is shorter than the minimum of its type, so the record is kept raw."
fix = "The record is not interpreted; nothing else is affected."
see = "inspect"

["altium.pcb-read.truncated"]
meaning = "A block or subrecord runs past the end of its stream; what follows is kept as trailing bytes."
fix = "The stream is damaged or of an unknown layout; re-save the file in Altium."
see = "inspect"

["altium.pcb-read.unknown-type"]
meaning = "A record starts with a type byte that is no primitive type, and reading of the stream stops there."
fix = "The rest of the stream is not read; re-save the file in Altium."
see = "inspect"

["altium.pcb-read.unlisted-footprint"]
meaning = "A footprint storage exists that the library's list does not name; it is read as well."
fix = "Nothing to do."
see = "inspect"

["altium.pcb-read.wrong-type"]
meaning = "A primitive storage holds a record of another type; it is kept apart."
fix = "Nothing to do unless that record matters."
see = "inspect"

["altium.pcb-staged"]
meaning = "Components without a placement were put in rows beside the board outline."
fix = "Place them with place() in the script, or move them in Altium."
see = "Build target"

["altium.pcb-too-large"]
meaning = "The PCB library or document would need more than 109 FAT sectors."
fix = "Reduce the board content, for example the number of distinct footprints."
see = "Build target"

["altium.experimental"]
meaning = "The emitted Altium formats still lack some graduation proofs."
fix = "Read capabilities --json --no-tools: experimental.missing lists the remaining conditions for each format. Validate generated documents in Altium."
see = "Discovery"

["altium.pcbdoc-not-written"]
meaning = "The conditions for writing the PCB document do not hold, so only the other files are written; the message says which condition."
fix = "Meet the condition the message names, for example a board with an outline and resolved footprints."
see = "Build target"

["altium.pin-lossy"]
meaning = "A pin's electrical type or shape has no Altium equivalent and was mapped to the nearest one."
fix = "Check the pin in Altium if its type matters for the ERC."
see = "Build target"

["altium.pin-text-too-long"]
meaning = "A pin name or number is longer than 255 bytes."
fix = "Shorten the pin name or number."
see = "Build target"

["altium.placement-from-board"]
meaning = "Components are placed as the board of --copper-from places them, not as the script asks."
fix = "Nothing to do; update the script's place() calls if they should agree."
see = "Build target"

["altium.plane-copper"]
meaning = "A track or arc lies on a plane layer, or a zone on a plane layer has another net than the plane."
fix = "Move the copper off the plane layer, or give the zone the plane's net."
see = "Build target"

["altium.plane-zone-merged"]
meaning = "A zone on a plane layer with the plane's own net is left to the plane and not written."
fix = "Nothing to do."
see = "Build target"

["altium.primitive-dropped"]
meaning = "A footprint graphic or a pad setting has no Altium form and was left out."
fix = "Check the footprint in Altium if the missing detail matters."
see = "Build target"

["altium.project-kept"]
meaning = "A project file already exists in --out and was kept as it is."
fix = "Nothing to do; remove it first if Fenolite should write a new one."
see = "Build target"

["altium.sch.bad-value"]
meaning = "A modelled key holds a value that does not parse, or a count disagrees with the keys present."
fix = "The value is absent from the reading; check the record that 'where' names."
see = "inspect"

["altium.sch.empty-stream"]
meaning = "A stream that should hold records has 0 bytes."
fix = "The file may be damaged; re-save it in Altium."
see = "inspect"

["altium.sch.malformed-record"]
meaning = "A record is malformed: a property list without its end, no record type, or a pin cut inside a required field."
fix = "The record is kept raw; re-save the file in Altium if it matters."
see = "inspect"

["altium.sch.no-sheet"]
meaning = "The first record of the schematic is not the sheet record."
fix = "The sheet settings are unknown; re-save the file in Altium."
see = "inspect"

["altium.sch.orphan-record"]
meaning = "A record names an owner that is no earlier record."
fix = "The record is read without its owner; re-save the file in Altium."
see = "inspect"

["altium.sch.part-out-of-range"]
meaning = "A child record lies outside its component's part count or display-mode count."
fix = "The child is kept; check the component in Altium."
see = "inspect"

["altium.sch.pin-trailing-bytes"]
meaning = "Bytes follow the last known field of a binary pin; they are kept."
fix = "Nothing to do."
see = "inspect"

["altium.sch.storage-opaque"]
meaning = "A storage record does not have the embedded-file layout and is kept without decoding."
fix = "Nothing to do."
see = "inspect"

["altium.sch.text-undecodable"]
meaning = "A text holds a byte that its encoding does not define; the text view shows a replacement character."
fix = "Check the text in Altium; the bytes are kept."
see = "inspect"

["altium.sch.unknown-record"]
meaning = "A record type that Fenolite has no class for; it is kept, and reported once per type with the count."
fix = "Nothing to do."
see = "inspect"

["altium.sch.unknown-stream"]
meaning = "A stream or section that the reader keeps without reading."
fix = "Nothing to do."
see = "inspect"

["altium.sch.weight-mismatch"]
meaning = "A count stored in the file differs from the number of records read."
fix = "Treat the file as possibly incomplete; re-save it in Altium."
see = "inspect"

["altium.schematic-too-large"]
meaning = "The binary schematic would need more than 109 FAT sectors, about 7 MB."
fix = "Build with --altium-format ascii, or split the design into more sheets."
see = "Build target"

["altium.schlib-generic"]
meaning = "A library was written with generic symbols."
fix = "Nothing to do; replace the symbols in Altium if their drawing matters."
see = "Build target"

["altium.schlib-not-in-project"]
meaning = "The existing project file was kept and does not list a schematic library that the build wrote. The info names the libraries the kept file lacks; when the kept file cannot be read, it names every library and its hint says so."
fix = "Add the libraries to the project in Altium, or remove the project file from --out and build again."
see = "Build target"

["altium.schlib.missing-component"]
meaning = "The library header lists a component that has no storage."
fix = "The component is absent from the reading; re-save the library in Altium."
see = "inspect"

["altium.schlib.no-component"]
meaning = "The first record of a component's data stream is not the component record."
fix = "The component cannot be read; re-save the library in Altium."
see = "inspect"

["altium.schlib.side-stream-opaque"]
meaning = "A side stream with pin details is kept without decoding."
fix = "Nothing to do."
see = "inspect"

["altium.schlib.side-stream-orphan"]
meaning = "An entry of a pin side stream names no pin."
fix = "Nothing to do unless pin details are missing in the reading."
see = "inspect"

["altium.schlib.unlisted-component"]
meaning = "A component storage exists that the library header does not list; it is read as well."
fix = "Nothing to do."
see = "inspect"

["altium.section-key"]
meaning = "A library reference longer than 31 characters is stored under a section key, as Altium does."
fix = "Nothing to do."
see = "Build target"

["altium.sheet-custom"]
meaning = "The schematic layout does not fit on A0, so a custom sheet size is written."
fix = "Nothing to do; split the design into modules for smaller sheets."
see = "Build target"

["altium.sheet-name-collision"]
meaning = "Two top-level module names differ only in letter case, so their sheet files would collide."
fix = "Rename one of the modules."
see = "Build target"

["altium.sheet-paper"]
meaning = "The layout of a schematic document does not fit the paper of sheet(), so the drawing sheet was drawn on a larger page."
fix = "Name a larger paper in sheet(), or split the design into module sheets with --altium-sheets modules."
see = "Build target"

["altium.sheet.appearance"]
meaning = "Colours and font names are not kept (once)."
fix = "Nothing to do."
see = "template"

["altium.sheet.builtin-drawn"]
meaning = "A border drawn from the sheet flags (once)."
fix = "Nothing to do."
see = "template"

["altium.sheet.builtin-not-drawn"]
meaning = "An Altium sheet template holds the border or zones of a standard style, a border without a margin, or the built-in title block: no public source gives that geometry."
fix = "Redraw the item in the sheet specification if it matters; the import still writes the sheet."
see = "template"

["altium.sheet.dynamic-string"]
meaning = "An Altium sheet template holds a string whose value the source tool computes, such as `=CurrentDate`; kept as `{param:NAME}`."
fix = "Redraw the item in the sheet specification if it matters; the import still writes the sheet."
see = "template"

["altium.sheet.image-not-kept"]
meaning = "An Altium sheet template holds a linked image, an embedded image whose file is missing, or one that is not a PNG; only the base name of the file is shown."
fix = "Redraw the item in the sheet specification if it matters; the import still writes the sheet."
see = "template"

["altium.sheet.image-size"]
meaning = "An Altium sheet template holds a kept image: the neutral bitmap has no box, so it is drawn at its own size."
fix = "Redraw the item in the sheet specification if it matters; the import still writes the sheet."
see = "template"

["altium.sheet.not-representable"]
meaning = "An Altium sheet template holds an arc, an ellipse, a Bézier, a rounded rectangle, a text frame or a note: the neutral sheet has lines, rectangles, texts and bitmaps only."
fix = "Redraw the item in the sheet specification if it matters; the import still writes the sheet."
see = "template"

["altium.sheet.not-template-content"]
meaning = "An Altium sheet template holds a record that is not sheet graphics (a component, a wire, a port, a harness record), with the records it owns."
fix = "Redraw the item in the sheet specification if it matters; the import still writes the sheet."
see = "template"

["altium.sheet.outside"]
meaning = "An Altium sheet template holds a record with a point outside the drawing area."
fix = "Redraw the item in the sheet specification if it matters; the import still writes the sheet."
see = "template"

["altium.sheet.rounded"]
meaning = "Lengths rounded to the micrometre, with their count (once)."
fix = "Nothing to do."
see = "template"

["altium.sheet.style-dropped"]
meaning = "An Altium sheet template holds a fill, a line style, a line-end shape, an underline, a mirror or an unknown line width or justification."
fix = "Redraw the item in the sheet specification if it matters; the import still writes the sheet."
see = "template"

["altium.sheet.unknown-string"]
meaning = "An Altium sheet template holds a text that starts with `=` without a parameter name (a space, an expression); kept as literal text."
fix = "Redraw the item in the sheet specification if it matters; the import still writes the sheet."
see = "template"

["altium.sheets-not-in-project"]
meaning = "The existing project file was kept and does not list a module sheet or a harness file that the build wrote. The info names the files the kept file lacks; when the kept file cannot be read, it names every one and its hint says so."
fix = "Add them to the project in Altium, or remove the project file from --out and build again."
see = "Build target"

["altium.symbol-name-collision"]
meaning = "Two lib ids give the same library and storage name, or two library file names differ only in letter case."
fix = "Rename one symbol or one library."
see = "Build target"

["altium.symbol-off-grid"]
meaning = "A pin position or a pin length of a resolved symbol is not a multiple of 10 mil."
fix = "Use a symbol drawn on the 10 mil grid, or correct the symbol."
see = "Build target"

["altium.symbol-simplified"]
meaning = "A symbol is drawn as one rectangle per part (--altium-symbols generic, no graphics, a graphic without a record such as an arc, or several units or body styles), or its other body styles or alternates were dropped."
fix = "Nothing to do; redraw the symbol in Altium if its look matters."
see = "Build target"

["altium.text-unwritable"]
meaning = "A text cannot be written: it is not printable 7-bit ASCII (a comment of a binary schematic may also hold Windows-1252 characters), holds '|', is empty, has a blank at an end, or is a value that starts with '='."
fix = "Change the text that 'where' names; the message names the first character refused and says whether the binary form carries it."
see = "Build target"

["altium.unique-id-collision"]
meaning = "Two components, sheet symbols or ports would get the same unique id."
fix = "Change the path or reference of one of them so the ids differ."
see = "Build target"

["altium.unknown-pin"]
meaning = "A net member names neither a pin number nor a pin name of the part's symbol."
fix = "Correct the pin in the script; the symbol's pins are listed by 'fenolite inspect' of its library."
see = "Build target"

["altium.pin-pad-map-invalid"]
meaning = "The pin-to-pad map of a part names a pin its symbol lacks, names a pad its footprint lacks, or leaves one pad to two pins (a pin mapped onto the pad of another pin's own number). Nothing is written."
fix = "Correct pad_map so each listed pin is a pin of the symbol, each pad a pad of the footprint, and each pad the pad of one pin: map the other pin too."
see = "Build target"

["altium.via-unsupported"]
meaning = "A micro via is not written to the Altium PCB document; through, blind and buried vias are."
fix = "Use a blind via of the same span, or place the via in Altium."
see = "Build target"

["altium.zone-unsupported"]
meaning = "A zone has fewer than three outline points, or names no layer."
fix = "Correct the zone's outline and layers."
see = "Build target"

["altium.pour-unavailable"]
meaning = "The default pour mode computed needs the geo extra, which is not installed, so the polygons are written without poured copper."
fix = "Install fenolite[geo] and build again, or ask for --altium-pour outline to write the polygons unpoured without this warning."
see = "Build target"

["altium.zone-unpoured"]
meaning = "Fenolite could not compute the pour of this polygon (the message names the reason), so it is written with its outline only."
fix = "Repour the polygon in Altium (Tools » Polygon Pours » Repour All), or remove what the reason names."
see = "Build target"

["altium.zones-poured"]
meaning = "Fenolite computed the poured copper of these polygons with Altium's rules; the pour is experimental until a kit round settles it."
fix = "Nothing is needed; Tools » Polygon Pours » Repour All in Altium gives Altium's own copper, and --altium-pour outline writes the polygons unpoured."
see = "Build target"

["altium.zones-unpoured"]
meaning = "Polygons are written without poured copper: the pour mode is outline, or the geo extra is missing."
fix = "Repour the polygons in Altium, or build with the geo extra and the default --altium-pour computed."
see = "Build target"

["analysis.clearance-below"]
meaning = "The straight-line distance between two conductors is below the requirement of their voltages."
fix = "Move the conductors apart, or correct the requirement table if it is too strict."
see = "analyze"

["analysis.clearance-undecided"]
meaning = "The requirement lies inside the interval that Fenolite can prove for the clearance, so it can neither pass nor fail it."
fix = "Measure the gap by hand, or increase it until the lower bound passes."
see = "analyze"

["analysis.creepage-below"]
meaning = "The shortest path along the board surface between two conductors is below the requirement."
fix = "Move the conductors apart or add a slot between them."
see = "analyze"

["analysis.creepage-over"]
meaning = "The clearance or the creepage of a pair of nets crosses copper of a third net, at no length. The distances from each net of the pair to that third net are the ones its voltage acts across."
fix = "Select the pairs the hint names (each net with the third net) and judge those distances; the value of the pair is the conservative one."
see = "analyze"

["analysis.creepage-undecided"]
meaning = "The requirement lies inside the interval for the creepage, or the search was cut short."
fix = "Measure the path by hand, or increase the distance until the lower bound passes."
see = "analyze"

["analysis.crossings-short"]
meaning = "A cut of `--kinds crossings` must carry more open connections than the tracks its free ways fit on all copper layers together: the barrier it crosses (a row of pads, a gap, a slot, a rule area) leaves too little room for the nets that still have to pass."
fix = "Widen the gaps or move the parts, open another layer, use a narrower class where it is allowed, or route some nets around the barrier; then run the crossing analysis again."
see = "analyze"

["analysis.current-exceeded"]
meaning = "The current capacity of a track or via is below the current its net requires."
fix = "Widen the track, add copper thickness or vias, or correct the required current."
see = "analyze"

["analysis.drop-above"]
meaning = "The low end of the voltage drop of a power path, at the row's current and with the resistivity you gave, is above the row's `drop_mv`."
fix = "Widen or shorten the copper of the path, add copper in parallel, or correct the row; `result.power` lists each element with its resistance interval."
see = "analyze"

["analysis.drop-undecided"]
meaning = "The row's `drop_mv` lies inside the interval of the voltage drop, or the drop has no high end (a region with more than two ports, a bound that is only one-sided, or a missing input)."
fix = "Read the interval in `result.power`; give the missing input, or treat the drop as not shown to be met."
see = "analyze"

["analysis.embedded-below"]
meaning = "A gap between conductors on an inner layer is below the requirement for insulation inside the laminate."
fix = "Increase the gap on that layer."
see = "analyze"

["analysis.fit-out-of-range"]
meaning = "A capacity was computed outside the range for which its source states the fitted formula."
fix = "Treat those rows as extrapolated and check them against another source."
see = "analyze"

["analysis.input-missing"]
meaning = "An input that Fenolite does not assume is absent, so the items that need it were left out and counted."
fix = "Pass the missing input, for example --temp-rise or --copper-thickness."
see = "analyze"

["analysis.insulation-below"]
meaning = "The distance through the laminate between copper of two nets on two layers is below the `insulation_nm` you require."
fix = "Move the copper apart in plan view, choose a thicker dielectric, or correct the requirement; the measure names the two layers and items."
see = "analyze"

["analysis.insulation-undecided"]
meaning = "The `insulation_nm` you require lies inside the interval of the distance through the laminate, so the measure does not decide."
fix = "Read the interval of the row; the approximation of curved copper bounds its width."
see = "analyze"

["analysis.item-unsupported"]
meaning = "Copper that could not be given a shape, or a conductor outside the board, was left out of the analysis."
fix = "Check those items by hand; 'where' names the kind."
see = "analyze"

["analysis.length-open"]
meaning = "The copper of a measured net does not join its start pad to the pads the message names, so those pads have no pin-to-pin length. Tracks that only cross without an end inside each other are not joined."
fix = "Route the open connection, or pass --from to measure from another pad of the net."
see = "analyze"

["analysis.length-stub"]
meaning = "Part of the copper of a measured net lies on no path from its start pad to another pad: a stub, a branch end or dangling copper. KiCad's length of the net counts it, so the total is longer than any pin-to-pin length."
fix = "Remove the stub if it is not wanted; if it is, judge the pin-to-pin lengths in `result.lengths[].paths` beside the total."
see = "analyze"

["analysis.path-exceeded"]
meaning = "An element that carries the whole current of a power path (a part of a track in series, a via group in series, or a fill between two ports) has a capacity by the fit below that current."
fix = "Widen the track, add vias to the group or widen the narrowest section the message locates; or correct the current or the temperature rise of the row."
see = "analyze"

["analysis.path-open"]
meaning = "The copper of the net does not join the start pads of a power path to its end pads: a track, via, pad or fill is missing, or the copper is of a kind the analysis does not read (a graphic, or plane copper an import does not hold)."
fix = "Route or fill the connection, refill the zones, and check the pads the message names."
see = "analyze"

["analysis.path-undecided"]
meaning = "An element of a power path has a capacity below the whole current, but its share of the current is not computed (copper in parallel), or its section is only a bound."
fix = "Read the element in `result.power`: it passes only if its share is below its capacity, which Fenolite does not compute."
see = "analyze"

["analysis.path-unmatched"]
meaning = "A power path names a pad the board does not hold, or its pads belong to more than one net or to none, or the backend gives no board-frame pads."
fix = "Name pads as REF-PIN, all of one net, as `fenolite inspect` lists them."
see = "analyze"

["analysis.requirement-unmatched"]
meaning = "A row of the requirements matches no net, or a voltage is above every step of the table."
fix = "Correct the net pattern or extend the table."
see = "analyze"

["analysis.body-copper"]
meaning = "Copper of a net class that a `[[body_copper]]` row of the requirements file names lies inside the plan view of a part it names, on a layer it forbids (`--kinds bodies`): high voltage under a metal-cased part, for example. The plan view is the outline of the part's bodies, or its courtyard when the board holds no body. The message names the part, the layer and the items."
fix = "Route the class around the part on that layer, move the part, or change the row if the part may sit over that copper."
see = "analyze"

["analysis.copper-dead"]
meaning = "A fill polygon of a zone is joined to no pad of its net through any copper (`--kinds dead`): an island that conducts nothing and floats."
fix = "Refill the zone with island removal, delete the island, or join it to its net with a via."
see = "analyze"

["analysis.copper-far"]
meaning = "A track, an arc, a via or a fill polygon lies farther than `--dead-distance` from every pad of its net, or its net has no pad (`--kinds dead`)."
fix = "Remove the copper, or bring it to the pads it serves."
see = "analyze"

["analysis.decoupling-far"]
meaning = "A supply pin (a pin of type power input) of a part that a `[[decoupling]]` row names has its nearest capacitor on the same net farther along copper than `max_distance_nm`, or no capacitor joined by copper (`--kinds decoupling`)."
fix = "Place the capacitor next to the pin and route the pin to the capacitor first, then on to the supply."
see = "analyze"

["analysis.loop-area"]
meaning = "The closed path through the pads of a `[[loop]]` row of the requirements file encloses more than its `max_area_nm2` (`--kinds loops`). Each leg between two pads of one net that copper joins follows the shortest path along that copper; any other leg is straight, through a part or across a gap. The message names the loop, its pads and its area."
fix = "Place the loop's parts closer together, and route the return path under or beside the forward path; then measure again."
see = "analyze"

["analysis.neck-narrow"]
meaning = "The pour of a net that a `[[neck]]` row of the requirements file selects narrows below its `min_width_nm` (`--kinds necks`): a neck between two wider parts, a thin tip that reaches at least that width from the rest, or a sliver narrower everywhere. Widths are measured on the raster of `--pour-grid`, to within one cell. The message gives the place and the width."
fix = "Widen the pour there, move the cut-out or keep-out that narrows it, or remove the tip or sliver if it carries nothing; then refill and measure again."
see = "analyze"

["analysis.net-split"]
meaning = "The copper of a net falls into more than one group of pads once every zone is taken in its copper state: a saved fill, or the simulated pour of a zone whose fill is missing or stale (`--kinds connectivity`). A cut-out or a keep-out drawn after the last fill often does it. The message names the pads that are apart."
fix = "Refill the zones and look again; join the groups with a track or a via, or move the cut-out or keep-out that separates them."
see = "analyze"

["analysis.return-split"]
meaning = "A track of a net of `--kinds returns` crosses a gap of its reference copper on the neighbouring layer: the plane under it is split or cut there. Its return current goes around the gap, and the loop radiates and picks up noise. The message gives the layer, the item and the two ends of the span."
fix = "Route the track around the gap, close the plane under it, or bridge the two planes with a stitching capacitor next to the crossing."
see = "analyze"

["analysis.return-via"]
meaning = "A via of a net of `--kinds returns` has no via of a reference net within `--via-distance`: where the signal changes layer, its return cannot follow next to it."
fix = "Put a reference (ground) via next to the signal via."
see = "analyze"

["analysis.relief-exceeded"]
meaning = "The spokes of the thermal relief of a pad, measured where they cross a ring at the pad's edge, carry less current by the capacity fit than the `[[current]]` row of the pad's net asks (`--kinds relief`), or no spoke crosses the ring."
fix = "Widen the spokes, add spokes, or join the pad to the zone solidly."
see = "analyze"

["analysis.sense-shared"]
meaning = "Copper of a sense net (`--sense`) touches copper of another net, outside the net-tie group of one footprint: for example a sense track that starts on the pour of the bus beside the shunt pad. The sense voltage then includes the drop along that copper."
fix = "Start the sense track on the sense pad of the element, built as a net tie, and keep pours and other tracks off the sense copper."
see = "analyze"

["analysis.tie-dangling"]
meaning = "A tie of `--kinds ties` touches fewer than two copper items, so removing it separates nothing: it joins nothing on the board."
fix = "Check that the ids name the tie's copper; a tie between two areas touches both."
see = "analyze"

["analysis.tie-extra"]
meaning = "After the tie is removed and the net splits, one group still holds pads of both `--domains`: a second joint, or a part on the wrong ground. The message names the stray pad and the path that joins it."
fix = "Remove the extra joint the path shows, or move the part to its own ground; then run the tie analysis again."
see = "analyze"

["analysis.tie-parallel"]
meaning = "Removing exactly the tie's copper leaves the net in one piece: another path (a second tie, a via, a pour) joins the two sides. The row's `path` gives the shortest one, item by item."
fix = "Remove the other joint, or name it in the tie if it is intended; then run the tie analysis again."
see = "analyze"

["analysis.tie-unmatched"]
meaning = "A `--tie` part, a `--tie-item` id, a `--sense` net or a `--barrier` part names nothing on the board, so it takes no part in the analysis."
fix = "Use the reference, the model id, the KiCad uuid or the locator as `fenolite inspect` or `fenolite net` shows it."
see = "analyze"

["assembly.template-invalid"]
meaning = "The column template of a BOM or placement table is malformed: an unknown table or key, an unknown field, two columns with one name, an empty column list, or a value outside its set. One issue per problem; `where` is the key path."
fix = "Correct the template file at the key that `where` names; docs/assembly.md lists the keys and the fields."
see = "bom"

["bom.field-unsupported"]
meaning = "The BOM template names a property with a comma in its name. The `kicad` source asks `kicad-cli` for its fields as one comma-separated list, so it cannot ask for that property."
fix = "Run `bom` with `--source model`, which reads the property from the model, or rename the property in the design."
see = "bom"

["bom.property-missing"]
meaning = "A column of the BOM template names a property that no part of the design has, so the column is empty."
fix = "Check the spelling of the property in the template, or add the property to the parts in the design script."
see = "bom"

["build.area-unknown"]
meaning = "A rule selects a rule area by name (select.area) and the board that the build is about to write holds no rule area of that name. KiCad would load the rule and apply it to nothing."
fix = "Declare the area with design.rule_area(), draw and name it in KiCad, or remove the selector. Area names are compared with letter case."
see = "build"

["build.not-two-terminal"]
meaning = "A part used through its ends part.a and part.b, or passed to series, decouple, pull_up or pull_down, has a symbol with other than two pins, so pins 1 and 2 are not its two ends."
fix = "Connect the part's pins by number with part[<number>], or use a part whose symbol has two pins."
see = "build"

["build.must-connect-unconnected"]
meaning = "part.unused_no_connect() met an open must-connect pin: a pin of type power_in (or a pin a catalog device flags must_connect). Marking it as not connected would hide a missing supply, so the build stops."
fix = "Connect the pin, or list it in keep= of unused_no_connect() to leave it open without a mark."
see = "build"

["build.diff-pair-gap-shadowed"]
meaning = "The two nets of a pair interface are in a net class with a pair gap, but KiCad would report two tracks laid at that gap: a clearance rule above the gap governs between the two nets, or the board minimum clearance is above the gap and no diff_pair_gap rule selects the pair."
fix = "Call design.rules.pair(pair, clearance=…, gap_min=…) with values at or below the class gap: it writes a clearance rule and a gap rule for the pair after the rules that shadow it. Or raise the class pair gap."
see = "build"

["build.diff-pair-name"]
meaning = "The two nets of a diff_pair or usb2 interface do not form a differential pair for KiCad by their names, so KiCad's pair rules and its pair router do not see them as one."
fix = "Rename the nets as the hint proposes (a common base name with the suffixes KiCad pairs)."
see = "build"

["build.field-added"]
meaning = "A footprint read from a library file has no Reference or no Value property. Each footprint placed from it got the missing field at the default placement: Reference on the silkscreen above the footprint, Value on the fabrication layer below it."
fix = "Nothing to do. Add the property to the library footprint to place it there, or move or hide the field with Part.field in the script."
see = "build"

["build.global-library"]
meaning = "A part's footprint comes from a library outside the project, so it was copied into the project's libraries."
fix = "Nothing to do; result.vendored lists the copied files."
see = "build"

["build.block-net-escape"]
meaning = "A net named by the script joins pins of parts inside a block instance and pins outside it, and no port of the block binds the net: the block uses a net it does not declare, often a global net closed over by the block's function."
fix = "Declare a port in the block (b.port) and connect the net to the port of the instance outside the block; or ignore the warning for a net that is meant to be global."
see = "build"

["build.i2c-pullup-missing"]
meaning = "A line of an I2C interface has no part of exactly two pins between it and the hv net of a power interface of the design, so Fenolite sees no pull-up on the bus. A resistor array is not recognised."
fix = "Add a pull-up resistor from each line to the supply net, or ignore the warning if the pull-ups are elsewhere."
see = "build"

["build.impedance-class-width"]
meaning = "A net class of an impedance target has a track width, or a pair width or pair gap, that differs from the target's trace. Routers, KiCad 9's among them, lay tracks at the class value, which the derived rules then report."
fix = "Set the class value of design.rules.netclass() to the target's width or gap, or accept the warning when the layers of the target differ."
see = "build"

["build.impedance-gap-clearance"]
meaning = "On KiCad 9 a pair target's gap is below the clearance of its class and the class has no pair gap at or below it, so KiCad 9 reports the clearance between the two tracks of the pair. On KiCad 10 the tuning profile relaxes that clearance, except where a custom clearance rule governs the pair: a rule above the gap is reported there as well."
fix = "Set diff_pair_gap= of design.rules.netclass() at or below the gap, narrow a custom clearance rule so that it does not select the pair, or give the pair its own clearance with design.rules.pair(…, clearance=…)."
see = "build"

["build.impedance-layer"]
meaning = "An impedance target names a layer or a reference layer that is not a copper layer of the board, so its derived rules and its tuning profile would name a layer KiCad does not have."
fix = "Name the copper layers of board(copper=…) in trace(): F.Cu, In1.Cu … B.Cu, or give the board more copper layers."
see = "build"

["build.impedance-rules-only"]
meaning = "KiCad 9 has no tuning profile, so the impedance targets of a build for KiCad 9 are written as design rules only."
fix = "Nothing to do. Build for KiCad 10 to also get the tuning profiles that its router and length tuner read."
see = "build"

["build.impedance-shadowed"]
meaning = "A rule of the same kind as a rule derived from an impedance target is written after it and selects a class of the target (or the whole board, or a pair of the class) on the target's layer. KiCad lets the later rule govern, so the target's width or gap is not the one checked."
fix = "Give the other rule a lower priority, narrow it to a rule area with select.area() for a deliberate neck-down, or remove it."
see = "build"

["build.impedance-stackup"]
meaning = "The design has impedance targets and the board has no stack-up, or a stack-up whose impedance_controlled flag is false. The Gerber job file then states neither ImpedanceControlled nor the dielectric constants the fabricator needs."
fix = "Declare the stack-up with design.stackup(…, impedance_controlled=True)."
see = "build"

["build.interface-not-lowered"]
meaning = "A differential pair of the design (a diff_pair or usb2 interface) is selected by no rule, so nothing of it is written: KiCad files hold no pair object, and KiCad knows the pair by its two net names only. A pair that a rule selects with select.pair() or design.rules.pair() gets no such message."
fix = "Nothing to do when the pair needs no limits. To constrain it, call design.rules.pair(pair, …), or write a rule on select.pair(pair)."
see = "build"

["build.layout-exists"]
meaning = "The output folder holds a library table or a library folder that the build would overwrite."
fix = "Build into another folder, or remove those files; a board there is merged, never overwritten."
see = "build"

["build.library-changed"]
meaning = "A vendored library file differs from the one the last build recorded."
fix = "Check that the library update is wanted; the build goes on with the new file."
see = "build"

["build.library-too-new"]
meaning = "A library file has a format version newer than the KiCad version the build targets."
fix = "Target the newer KiCad with --kicad-version, or use a library saved by the older one."
see = "build"

["build.name-case-collision"]
meaning = "Two net names or two class names differ only in letter case."
fix = "Rename one of them."
see = "build"

["build.no-board"]
meaning = "The design script declares no board(), so nothing can be placed."
fix = "Add board(...) to the script."
see = "build"

["build.no-connect-on-net"]
meaning = "A pin is marked as not connected and is also a member of a net."
fix = "Remove the mark or take the pin off the net."
see = "build"

["build.no-footprint"]
meaning = "Neither the part nor its symbol names a footprint."
fix = "Give the part a footprint in the script."
see = "build"

["build.pad-map-default"]
meaning = "A catalog diode or LED (pin 1 A, pin 2 K) sits on a catalog land whose pad 1 is the cathode and gives no pad_map, so the build applied pad_map={\"1\": \"2\", \"2\": \"1\"}: anode pin on the anode pad, cathode pin on the cathode pad. Earlier builds kept pin 1 on pad 1, so a design wired by pin number has its two pad nets swapped."
fix = "Connect the part by pin name (A, K) and write pad_map={\"1\": \"2\", \"2\": \"1\"} on it to keep the map and silence the warning; to keep the pad order of earlier builds instead, write pad_map={\"1\": \"1\", \"2\": \"2\"}."
see = "build"

["build.pad-without-pin"]
meaning = "A pad of the footprint has no symbol pin mapped to it and stays without a net."
fix = "Nothing to do for a mechanical pad; else correct the pin-to-pad map."
see = "build"

["build.device-mismatch"]
meaning = "A part placed from a device: the device disagrees with the symbol or the footprint it names. A symbol pin is in no function, a function lists a pin the symbol lacks, or a mapped pad is not on the footprint. Nothing is written."
fix = "Correct the device's [pins] table against the symbol and the footprint (fenolite catalog show), or point the device at the symbol and footprint its pin map was reviewed for."
see = "build"

["device.edited"]
meaning = "A device record stamped by fenolite catalog import was changed after the stamp: its SHA-256 no longer matches the provenance. The evidence label stays as written."
fix = "Nothing, when the edit is your review. A re-import over the file is refused unless --allow-lossy is given."
see = "build"

["device.overrides-builtin"]
meaning = "A project device (devices/*.toml beside the script, or design.devices()) has the id of a shipped Fenolite: device and is used in its place."
fix = "Nothing, if the override is meant; else give the project device an id of its own namespace."
see = "build"

["build.pin-ambiguous"]
meaning = "A pin designator is one pin's number and another pin's name; the number wins."
fix = "Use the pin number to be exact."
see = "build"

["build.pin-on-two-nets"]
meaning = "One pin of a part is a member of two nets."
fix = "Connect the pin to one net only."
see = "build"

["build.pin-pad-map-invalid"]
meaning = "The pin-to-pad map of a part names a missing symbol pin or footprint pad, or maps two pins to one pad."
fix = "Correct the map so each listed pin and pad exists and no pad is used twice."
see = "build"

["build.pin-without-pad"]
meaning = "A pin that is connected to a net has no pad in the footprint."
fix = "Choose a footprint with that pad, or map the pin to an existing pad."
see = "build"

["build.plane-zone-missing"]
meaning = "A plane of the script has no copper on a KiCad board: no zone of its net lies on its layer. The layer is still written as a plane layer (type power); one issue per plane."
fix = "Draw that copper in the script with design.zone(<net>, layers=(\"<layer>\",))."
see = "Build target"

["build.port-unused"]
meaning = "A port of a block instance that is not optional has nothing outside the block on any of its members: no pin, net, port or interface outside the block is connected to it."
fix = "Connect a net to the port of the instance (connect(net, inst.PORT)), or declare the port with optional=True when leaving it unwired is intended."
see = "build"

["build.property-conflict"]
meaning = "A user property of a part has another value than the footprint library already holds for it."
fix = "Remove the property from the script or use the library's value."
see = "build"

["build.property-invalid"]
meaning = "A user property has a name or a value that cannot be written."
fix = "Correct the property that 'where' names."
see = "build"

["build.property-reserved"]
meaning = "A user property uses a name that KiCad or Fenolite reserves."
fix = "Rename the property."
see = "build"

["build.reserved-library"]
meaning = "The design names a symbol library `fenolite`. That nickname is kept for the symbols Fenolite writes itself, such as the power flag of a generated schematic. Or the design needs a power flag and holds a symbol `PWR_FLAG` of its own in the library that holds the flag: a library whose name differs from `fenolite` in letter case only, such as `Fenolite`."
fix = "Give the library another nickname in the symbol table or in the script, or give the symbol another name."
see = "build"

["build.schematic-netlist-differs"]
meaning = "Before it writes anything, the build reads the nets of the schematic it generated back from the sheet, without any tool, and compares them with the circuit of the script. They differ, so the sheet would say something other than the circuit. The message names the first net and pin. Nothing is written."
fix = "This is a defect of the schematic generator, not of the script: report it with the script. Build with --schematic skip to get the board meanwhile."
see = "build"
["build.schematic-replaced"]
meaning = "The schematic in the output folder was changed since the last build. A generated schematic is a view of the script, so the build writes it again and keeps the edited file as a .bak copy."
fix = "Change the script, or fix symbol positions in schematic-placements.toml beside it; edits made in the schematic are not read."
see = "build"

["build.schematic-too-large"]
meaning = "The symbols of one sheet of the design do not fit an A0 page. The message names the sheet: the root holds the parts outside every module, and each module has a sheet of its own."
fix = "Put parts of that sheet into modules, so each gets its own sheet, or build with --schematic skip."
see = "build"

["build.sheet-file-collision"]
meaning = "Two modules would be written to one sheet file. A module's sheet is sheets/<module path with '.' for '/'>.kicad_sch, so a top-level module a.b and a module b inside a module a collide, and so do names that differ only in letter case."
fix = "Rename one of the two modules, or build with --schematic-layout grid for one flat sheet."
see = "build"

["build.sheet-stale"]
meaning = "A sheet file under sheets/ was written by the last build and is no sheet of this design: its module was removed or renamed. No sheet names the file any more, so KiCad does not load it. The build deletes nothing and leaves it in place."
fix = "Delete the file when you no longer need it. The warning is given once."
see = "build"

["build.symbol-overlap"]
meaning = "A symbol placed by schematic-placements.toml lies over the cell of another symbol. The sheet is still correct, because nothing connects by touching; it is only hard to read."
fix = "Move one of the two symbols in schematic-placements.toml."
see = "build"

["build.symbol-placement-invalid"]
meaning = "A table of schematic-placements.toml is wrong: a position off the 1.27 mm grid, an unknown key, or a rotation or mirror that is not allowed. Nothing is written."
fix = "Give x and y in millimetres as multiples of 1.27, rotation as 0, 90, 180 or 270, and mirror as \"x\" or \"y\"."
see = "build"

["build.symbol-placement-unknown"]
meaning = "schematic-placements.toml names a unit that the design does not have. The table is ignored."
fix = "Name a unit by its component path, with #<unit> for a unit above 1, or remove the table."
see = "build"

["build.symbol-short"]
meaning = "Two symbols placed by schematic-placements.toml have a pin at the same point of the sheet, which would join their nets in KiCad. Nothing is written."
fix = "Move one of the two symbols in schematic-placements.toml."
see = "build"

["build.unknown-pin"]
meaning = "A net member or a no-connect mark names a pin that the part's symbol does not have."
fix = "Correct the pin number or name in the script."
see = "build"

["build.unused-pin-without-pad"]
meaning = "A pin that is on no net has no pad in the footprint."
fix = "Nothing to do if the pin is unused on purpose; else choose a footprint with that pad."
see = "build"

["build.vendor-unsafe-name"]
meaning = "A library or entry name cannot be a file name on every system, or two names differ only in letter case, so no file is copied."
fix = "Rename the library or the footprint."
see = "build"

["check.cache-unreadable"]
meaning = "The built model in .fenolite/ cannot be loaded, so the two model stages were skipped."
fix = "Build the project again to write a fresh .fenolite/."
see = "check"

["check.copy-skipped"]
meaning = "A file or folder that the project names was left out of the copy that kicad-cli sees; the message gives the reason."
fix = "Nothing to do unless KiCad needs that file; then put it under the project folder."
see = "check"

["check.document-missing"]
meaning = "The project file lists a document that is not a file in the project folder."
fix = "Restore the document, or remove it from the project in Altium; the other documents are still checked."
see = "check"

["check.exclusion-ambiguous"]
meaning = "check --exclude names more than one finding of the current DRC report: its code and item names fit several entries. Nothing is written."
fix = "Name the two items by their KiCad uuids (the finding's where, or 'fenolite inspect'), so that one entry matches."
see = "check"

["check.exclusion-present"]
meaning = "check --exclude found the exclusion already stored in the project in both item orders: nothing is written."
fix = "Nothing to do; 'fenolite check' lists the exclusion in summary.accepted of drc.kicad."
see = "check"

["check.exclusion-stale"]
meaning = "The project file stores a KiCad DRC exclusion that KiCad no longer applies: 'moved' when the entry is reported again at another marker position, 'gone' when no entry of that type names those items. KiCad ignores such an exclusion without a message."
fix = "Open the DRC dialog in KiCad and remove the exclusion, or exclude the entry again there. For a project that Fenolite builds, prefer design.waive() in the script, which matches by name."
see = "check"

["check.exclusion-unlocated"]
meaning = "check --exclude found the finding, but no exclusion key at an anchor of its items (report positions, track and arc ends, via, pad and footprint positions, zone corners) was applied by kicad-cli on a copy, so the marker position KiCad keys it with is unknown. Nothing is written."
fix = "Exclude the entry in KiCad's DRC dialog, which knows the marker position; 'fenolite check' then judges it as any stored exclusion."
see = "check"

["check.exclusion-unmatched"]
meaning = "check --exclude names no finding of the current DRC report: no entry has that type or code and those items, in either order. Nothing is written."
fix = "Run 'fenolite check' and copy the finding's code and the item names of its where, or give the items' KiCad uuids; for an entry of one item leave ITEM_B out."
see = "check"

["check.footprint-unresolved"]
meaning = "A component that is not marked do-not-populate has no footprint reference or no footprint on the board."
fix = "Give the part a footprint and build again."
see = "check"

["check.oracle-failed"]
meaning = "kicad-cli wrote no report or export, or timed out."
fix = "Run again, with a larger --timeout for a large board; 'fenolite doctor' checks the tool."
see = "check"

["check.read-refused"]
meaning = "Fenolite cannot read the board; the message starts with the FEN code of the reason."
fix = "Run 'fenolite explain' on that FEN code and correct the file at the place 'where' names."
see = "check"

["check.report-limit"]
meaning = "KiCad's DRC report stops at a fixed number of entries per type: 499 of clearance and of unconnected items, 199 of any other type. The count of the type named in where reached that limit, so the board holds at least that many findings of the type, and the report does not show the others."
fix = "Read the count as a lower bound. Repair the reported findings of the type and run check again: the next ones then appear. summary.limits of the stage drc.kicad lists every such type."
see = "check"

["check.roles-unreadable"]
meaning = "The stage `roles.rules` could not read the stored roles of the board: its role document (`<board stem>.roles.json`) or the roles of `.fenolite/rules.json` is not valid. The message names the file and the place."
fix = "Correct or delete the role document, or store the roles again with `fenolite roles PATH --accept ... --confirm`."
see = "check"

["check.roundtrip-unjudged"]
meaning = "A round-trip level could not be judged for one document; the message names the reason (`too-large`: the file needs sectors the compound writer does not write; `writer-refused`: the writer refuses the tree)."
fix = "Nothing to do: the level is neither passed nor failed for this document. `roundtrip.rta1` still judges its records."
see = "check"

["check.rt1-failed"]
meaning = "The board does not rebuild to itself: reading and writing it back would change it. 'where' is the first difference."
fix = "Do not edit this board through Fenolite; report the difference, or re-save the board in KiCad."
see = "check"

["check.rt2-failed"]
meaning = "KiCad's DRC gives another count of a violation for the re-dumped board than for the original."
fix = "Do not edit this board through Fenolite; report the violation type and position."
see = "check"

["check.rt2-unstable"]
meaning = "Some violations differ between two DRC runs of the same file, so they were left out of the comparison."
fix = "Nothing to do; the message says when RT2 is therefore not judged."
see = "check"

["check.rta0-failed"]
meaning = "A copy of the compound file through Fenolite's reader and writer lost or changed a storage or a stream; `where` is `<document>:<stream path>`."
fix = "Do not rewrite this file through Fenolite; report the stream path. `fenolite inspect FILE --streams` lists the streams."
see = "check"

["check.rta1-failed"]
meaning = "A stream's records differ after Fenolite encodes them and reads them again; `where` is `<document>:<stream>#<record>`."
fix = "Do not rely on a rewrite of this file; report the stream and the record number. `fenolite diff A B --view records` shows the records of two files."
see = "check"

["check.rta1-normalised"]
meaning = "Streams whose records are equal after encoding and reading again, and whose encoded bytes differ from the bytes read."
fix = "Nothing to do: the records are kept. The count tells how many streams a rewrite would not reproduce byte for byte."
see = "check"

["check.rta2-failed"]
meaning = "The model that the build stored in `.fenolite/` and the reading of the documents the build wrote differ inside the written scope; `where` is `schematic:` or `pcb:` and the path of the difference."
fix = "Rebuild the project with `fenolite build --confirm`; if the difference stays, a writer or the import has a defect: report the path."
see = "check"

["check.rta3-failed"]
meaning = "A document was read, its model was written as new Altium documents, and the reading of those differs from the first reading inside the written scope; `where` is the path of the difference."
fix = "Nothing to change in the input: a writer or the import has a defect. Report the path with the document's kind."
see = "check"

["check.rta3-unwritten"]
meaning = "The round trip RT-A3 left out what the message counts per kind: model items that the writers do not carry, and (keys that start with `record:`) records of the input that the import maps to no model entity. The count is not part of the verdict."
fix = "Nothing to do. Read the counts before you rely on a rewritten document: what is listed is not in it."
see = "check"

["check.symbol-unresolved"]
meaning = "A built component has no symbol reference."
fix = "Give the part a symbol in the script and build again."
see = "check"

["check.waiver-unmatched"]
meaning = "A waiver of the design script (design.waive) matched no finding of this run: the finding is gone, or its items have other names now. 'where' is the waiver's name."
fix = "Remove the waiver from the script, or name its items as the 'where' of the finding prints them, then build again."
see = "check"

["convert.changed"]
meaning = "Items of the kind that 'where' names are written in another form that compares equal, such as a polygon written unpoured or a schematic generated from the circuit. The message counts them per reason."
fix = "Nothing to do; repour the polygons in the target tool. result.report lists every reason."
see = "convert"

["convert.lossy"]
meaning = "The converted project does not hold items of a kind that changes the board made or its bill of materials ('where' names the kind); --allow-lossy accepted the loss. The message counts them per reason."
fix = "Read result.report; change the source so the target holds the items, or keep the loss."
see = "convert"

["convert.schematic-unverified"]
meaning = "The schematic of a KiCad downgrade could not be compared with the source's at level 2: its netlist needs kicad-cli, which was not found, or the tool exported none. The board was compared."
fix = "Install kicad-cli (or pass --kicad-cli) and convert again to check the schematic too."
see = "convert"

["convert.no-verify"]
meaning = "The converted project was not read back and compared with the source (--no-verify), so nothing checks that it differs only where the report says; the evidence is UNVERIFIED."
fix = "Run the conversion without --no-verify."
see = "convert"

["convert.unexplained"]
meaning = "The converted project, read back, differs from the source at 'where', and no item that the report names as lost explains it: a writer changed the design without saying so. Nothing was written."
fix = "Report it with the source; the message names the level, the kind and the two values."
see = "convert"

["copper.clearance"]
meaning = "Copper of two nets is closer than the clearance in force for the pair; 'where' names both items."
fix = "Move the items apart, or correct the clearance of the net class or the rule."
see = "check"

["copper.clearance-unset"]
meaning = "Some item pairs were judged for shorts only, because no clearance is in force for them."
fix = "Set a clearance in the net class or in a rule to have them judged."
see = "check"

["copper.item-unsupported"]
meaning = "Copper items of a kind were left out of the copper check; 'where' is the kind."
fix = "Check those items with KiCad's DRC."
see = "check"

["copper.keepout"]
meaning = "A track, arc, via or pad lies in a keep-out (a rule area) whose settings forbid its kind, on a layer of the keep-out. KiCad's DRC reports the same item as items_not_allowed."
fix = "Move the item out of the area, change what the area forbids, or build with --copper-check warn to write anyway."
see = "check"

["copper.edge-clearance"]
meaning = "Copper (a track, arc, via, pad or zone fill) lies closer to the board edge, a cut-out or a slot than the edge clearance in force: the governing edge_clearance rule, else the board minimum (KiCad: min_copper_edge_clearance, 0.5 mm by default). The distance is to the edge line; the edge's stroke does not count. KiCad's DRC reports the same item as copper_edge_clearance."
fix = "Move the copper or the part inward, away from the ring the finding names; never waive it. A rule for some nets (design.rules.rule(kind='edge_clearance')) sets their own value. Build with --copper-check warn to write anyway."
see = "check"

["copper.hole-in-cutout"]
meaning = "A drilled hole (a pad's drill, a via's drill or a board hole) breaks into a milled cut-out or slot, or crosses the board edge: a hole wall that the milling cuts open cannot be made."
fix = "Move the hole or the slot so that the drill lies wholly on the board, clear of every cut-out."
see = "check"

["copper.hole-overlap"]
meaning = "Two drilled holes overlap. KiCad's DRC says nothing about two overlapping oval holes; Altium's Hole To Hole Clearance flags them."
fix = "Move one hole; keep the overlap only when the two holes form one slot on purpose, or draw the slot as a milled design.slot()."
see = "check"

["copper.rules-incomplete"]
meaning = "The clearance rules are incomplete: a rule stayed opaque, a project file was not read, or no rules source was given."
fix = "Rely on KiCad's DRC for the rules Fenolite could not read."
see = "check"

["copper.short"]
meaning = "Copper of two different nets touches or overlaps on a shared copper layer; 'where' names both items."
fix = "Move or remove one of the items, or correct the net of one of them."
see = "check"

["copper.zone-overlap"]
meaning = "Zones of different nets and equal priority overlap on a shared layer, so their fill order is undefined."
fix = "Give the zones different priorities or separate their outlines."
see = "check"

["diff.conflict"]
meaning = "An item of the board (a track, a footprint, a zone, ...) changed from BASE to OURS and was also changed in THEIRS, so diff --three-way cannot take one side. Nothing was written."
fix = "Merge that item by hand in KiCad, or undo the change on one side, then run the merge again. The where field is the item: its head and uuid."
see = "diff"

["diff.not-allowed"]
meaning = "The difference holds a change of a kind that --allow does not list, such as a rule change when only tracks were expected."
fix = "Review the change named in where. When it is expected, add its kind to --allow; else undo it before you accept the file."
see = "diff"

["diff.unmergeable"]
meaning = "diff --three-way cannot merge these boards: their format versions differ, their numbered net tables differ, or the merge would leave THEIRS empty. Nothing was written."
fix = "Re-save the three boards with one KiCad version (KiCad 10 names nets, so its boards need no equal net table), then run the merge again."
see = "diff"

["doctor.help-unparsed"]
meaning = "A help page of kicad-cli did not parse, so Fenolite cannot tell which options that command has."
fix = "Run with a supported kicad-cli version."
see = "doctor"

["doctor.tool-missing"]
meaning = "A tool is absent, or --kicad-cli or FENOLITE_KICAD_CLI names a file that does not exist."
fix = "Install the tool or correct the path."
see = "doctor"

["doctor.tool-unsupported"]
meaning = "A kicad-cli that was found has a major other than 9 or 10, or reports no version."
fix = "Install KiCad 9 or 10, or name another binary."
see = "doctor"

["drawing.designators-added"]
meaning = "An assembly drawing shows references that Fenolite added: the footprints named by the count show no reference on their fabrication layer, so a text of each reference was put at the centre of its courtyard in the plot copy. The board file is unchanged."
fix = "Nothing to do. Set designators = false or designator_size under [assembly] in the drawing specification to leave them out or to change their size."
see = "export"

["drawing.drill-mismatch"]
meaning = "The drill table of the fabrication drawing states another hole count for a diameter than KiCad's drill report gives for the drill file that 'where' names. The drawing would state a count the drill files do not hold, so no file of the export was written."
fix = "Read both counts in the message and compare the board with drawings/<board>-drill.rpt of a drill export. A difference is a defect of Fenolite's drill table: report the board."
see = "export"

["drawing.drill-report-unread"]
meaning = "KiCad's drill report names no drill file that Fenolite can read, so the drill table of the fabrication drawing was not checked against it. The drawing is written with the table."
fix = "Open the report under drawings/ and compare its counts with the table yourself; a newer kicad-cli may write the report in another form."
see = "export"

["drawing.no-room"]
meaning = "A drawing page does not hold its content at 1:1: the board box or the block that 'where' names lies outside the page, on the drawing sheet, or on a fixed corner that is taken. No file of the export was written."
fix = "Set [page] paper in the drawing specification to the paper the message names, or leave it \"auto\"; free the fixed corner (at); for a board that lies outside every page, move it onto the page in KiCad."
see = "export"

["drawing.sheet-unread"]
meaning = "The drawing sheet of the pages cannot be read or built: the file that the drawing specification or the project names is missing, is not a drawing sheet, or is a sheet template that does not build. No file of the export was written."
fix = "Correct the path of drawing_sheet under [page], or the sheet the project names; 'where' names the file. Leave both out to plot with KiCad's default sheet."
see = "export"

["drawing.side-empty"]
meaning = "No part sits on the side that 'where' names, so that assembly drawing is not made."
fix = "Nothing to do. Name only the sides you want under [assembly] sides in the drawing specification."
see = "export"

["drawing.stackup-missing"]
meaning = "The board holds no stack-up that Fenolite reads, so the fabrication drawing has no stack-up table and its board table no thickness, finish or impedance row."
fix = "Define the stack-up of the board (Board Setup in KiCad), or leave stackup out of [fab] tables in the drawing specification."
see = "export"

["edit.base-invalid"]
meaning = "The base record fenolite-base.json of the output folder is not JSON, is of another schema or target, or has a malformed entry; it is read as no record, so every part is merged by the rule of before."
fix = "Rebuild: the build writes the record again. Do not edit the file by hand."
see = "build"

["edit.base-missing"]
meaning = "Parts with a footprint on the board have no entry in fenolite-base.json, as on a board built before change c0250: the board wins for their positions and the script for their values, as before."
fix = "Nothing to do: this build writes the record, and the next build merges three ways."
see = "build"

["edit.code-wins"]
meaning = "A property the script changed since the last build was written over a CAD value nobody edited, for example a changed unlocked place() moved an untouched part."
fix = "Nothing to do when the change is wanted; otherwise change the script back."
see = "build"

["edit.legacy-file"]
meaning = "placements.toml is beside edits.toml and is not read: edits.toml replaces it."
fix = "Review edits.toml, then delete placements.toml."
see = "build"

["edit.take-unused"]
meaning = "A --take matched no sync.conflict of the build and changed nothing."
fix = "Drop the option, or check its side and target (SIDE[:PATH[#PROPERTY]])."
see = "build"

["edit.unrecorded"]
meaning = "A value, footprint or position edited in KiCad is kept over the script's, and edits.toml does not hold it yet."
fix = "Run fenolite sync --to-source to record it in edits.toml, or change the script to the same value."
see = "build"

["equiv.component-missing"]
meaning = "A component reference exists on one side of the comparison only."
fix = "Add or remove the component, or leave such references out with --ignore-ref."
see = "equivalent"

["equiv.dnp"]
meaning = "A component is marked do-not-populate on one side only."
fix = "Make the two designs agree, or name the known difference in an exclusion profile (--exclusions with --profile)."
see = "equivalent"

["equiv.excluded"]
meaning = "A rule of the exclusion profile matched differences. They are listed under result.excluded and do not fail the comparison."
fix = "Nothing to do; read the rule's reason in the message."
see = "equivalent"

["equiv.footprint-missing"]
meaning = "A component both sides hold is placed on one side only."
fix = "Place the component on the other side's board, or compare at level 2."
see = "equivalent"

["equiv.footprint-name"]
meaning = "The footprint names of a component differ; the library nickname before the last ':' is not compared."
fix = "Make the two designs agree, or name the known difference in an exclusion profile (--exclusions with --profile)."
see = "equivalent"

["equiv.import-message"]
meaning = "kicad-cli's import report holds this warning or error about the document it converted."
fix = "Nothing to do; it explains differences that come from the converter."
see = "equivalent"

["equiv.no-exclusion-profile"]
meaning = "No exclusion profile exists for the running kicad-cli version line, so the comparison ran with no rule, the relative frame and no tolerance."
fix = "Read the differences as unattributed, or use a kicad-cli version that has a profile."
see = "equivalent"

["equiv.oracle-failed"]
meaning = "kicad-cli wrote no board for the document, or a board that Fenolite's KiCad reader refuses, so no level ran."
fix = "Read the tool's message; run again with a larger --timeout for a large document."
see = "equivalent"

["equiv.pad-copper"]
meaning = "A pad reaches other copper (top, inner, bottom) on one side than on the other."
fix = "Make the two designs agree, or name the known difference in an exclusion profile (--exclusions with --profile)."
see = "equivalent"

["equiv.pad-drill"]
meaning = "The drill of a pad differs by more than the length tolerance, or only one side has a drill."
fix = "Correct the pad, or pass --tolerance-nm when the difference is rounding."
see = "equivalent"

["equiv.pad-kind"]
meaning = "A pad is surface-mount on one side and through-hole, unplated or connector on the other."
fix = "Make the two designs agree, or name the known difference in an exclusion profile (--exclusions with --profile)."
see = "equivalent"

["equiv.pad-missing"]
meaning = "The two footprints of a component hold different counts of pads with one number; those pads are not compared further."
fix = "Compare the two footprints; 'where' is REF-PIN and the two values are the counts."
see = "equivalent"

["equiv.pad-position"]
meaning = "The position of a pad inside its footprint differs by more than the length tolerance on an axis."
fix = "Correct the footprint, or pass --tolerance-nm when the difference is rounding."
see = "equivalent"

["equiv.pad-rotation"]
meaning = "The rotation of a pad relative to its footprint differs by more than the angle tolerance, modulo the symmetry of its shape."
fix = "Correct the footprint, or pass --tolerance-udeg when the difference is rounding."
see = "equivalent"

["equiv.pad-shape"]
meaning = "The shape of a pad differs between the two sides. An oval whose two sizes are equal within the length tolerance counts as a circle."
fix = "Make the two designs agree, or name the known difference in an exclusion profile (--exclusions with --profile)."
see = "equivalent"

["equiv.pad-size"]
meaning = "The size of a pad differs by more than the length tolerance on an axis. A rectangle, oval or rounded rectangle turned by a quarter with its sizes swapped counts as equal."
fix = "Correct the pad, or pass --tolerance-nm when the difference is rounding."
see = "equivalent"

["equiv.pin-missing"]
meaning = "A pin or pad of a component both sides hold exists on one side only."
fix = "Compare the footprint or the symbol of that component on the two sides; 'where' is REF-PIN."
see = "equivalent"

["equiv.position"]
meaning = "A footprint's position differs by more than the length tolerance on an axis, after the translation of the frame."
fix = "Move the footprint; pass --frame relative when one board is moved as a whole, or --tolerance-nm for rounding."
see = "equivalent"

["equiv.ref-ambiguous"]
meaning = "A side holds a reference more than once, or an empty reference, so the component cannot be paired and takes no part in any level."
fix = "Give each component its own reference, or leave such references out with --ignore-ref."
see = "equivalent"

["equiv.rotation"]
meaning = "A footprint's rotation differs by more than the angle tolerance, modulo a full turn."
fix = "Rotate the footprint, or pass --tolerance-udeg when the difference is rounding."
see = "equivalent"

["equiv.route-connectivity"]
meaning = "The copper of a net joins other pads on one side than on the other: a connection is open, or two parts of the net are joined on one side only. The message lists the pad sets that only one side holds."
fix = "Route the missing connection, or restore the track or via that was lost; --level 4 compares without routing."
see = "equivalent"

["equiv.route-length"]
meaning = "For the same joined pads, the routed length on a copper layer differs by more than the tolerance. A track moved to another layer shows as two lengths that differ."
fix = "Make the routes agree, or pass --tolerance-nm or --tolerance-ppm for the rounding of a conversion."
see = "equivalent"

["equiv.route-missing"]
meaning = "One side holds copper (a track, an arc, a via or a zone fill) on a net and the other side holds none."
fix = "Route the net on the other side, or compare with --level 4 when one board is not routed yet."
see = "equivalent"

["equiv.route-stub"]
meaning = "The copper of a net that reaches no pad (a stub, a lone via) differs in number of pieces or in total length. It is a warning and does not fail the comparison."
fix = "Check that no stitching via or stub was lost; name a known difference in an exclusion profile."
see = "equivalent"

["equiv.route-unjudged"]
meaning = "A net holds a zone without a fill on a side, and its pads are not joined without it, so its connectivity was not judged."
fix = "Fill the zones (fenolite fill) and compare again."
see = "equivalent"

["equiv.track-missing"]
meaning = "Strict level 5: a track (by copper span and its two ends) exists on one side only. A track drawn on another path, or cut into other segments, is such a difference."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.track-width"]
meaning = "Strict level 5: two matched tracks have different widths."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.track-net"]
meaning = "Strict level 5: two matched tracks lie on nets of different names."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.arc-missing"]
meaning = "Strict level 5: an arc (by copper span, ends and mid) exists on one side only."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.arc-width"]
meaning = "Strict level 5: two matched arcs have different widths."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.arc-net"]
meaning = "Strict level 5: two matched arcs lie on nets of different names."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.via-missing"]
meaning = "Strict level 5: a via (by position and copper span) exists on one side only."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.via-size"]
meaning = "Strict level 5: two matched vias have different diameters."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.via-drill"]
meaning = "Strict level 5: two matched vias have different drills."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.via-span"]
meaning = "Strict level 5: two matched vias span other copper layers or are of other types (through, blind, buried, micro)."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.via-net"]
meaning = "Strict level 5: two matched vias lie on nets of different names."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.copper-locked"]
meaning = "Strict level 5: two matched tracks, arcs or vias differ only in their lock. It is a warning and does not fail the comparison: a lock is the state of an editor, not of the design."
fix = "Nothing to do, or lock the item on the side that should hold the lock."
see = "equivalent"

["equiv.netclass-missing"]
meaning = "Level 6: a net class exists on one side only."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.netclass-field"]
meaning = "Level 6: a field of a net class (clearance, track width, via sizes, pair values) differs; field names it."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.netclass-members"]
meaning = "Level 6: the nets assigned to a net class differ."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.rule-missing"]
meaning = "Level 6: a custom design rule exists on one side only."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.rule-field"]
meaning = "Level 6: a field of a custom design rule differs; field names it as a dotted path."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.ruleset-field"]
meaning = "Level 6: a board-wide rule, severity or limit of the rule set differs; field names it as a dotted path."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.stackup-missing"]
meaning = "Level 6: a stack-up layer exists on one side only, or the layers come in another order."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.stackup-field"]
meaning = "Level 6: a field of a stack-up layer, or the finish of the stack-up, differs."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.layer-missing"]
meaning = "Level 6: a board layer of one kind and ordinal exists on one side only."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.outline-missing"]
meaning = "Level 7: an outline ring, cut-out or slot exists on one side only, after the rings were normalised (start point and direction do not matter)."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.zone-missing"]
meaning = "Level 7: a zone (by net, layers and outline) exists on one side only. Fills are never compared."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.zone-field"]
meaning = "Level 7: a field of two matched zones (name, priority, settings) differs. Fills are never compared."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.keepout-missing"]
meaning = "Level 7: a rule area (keep-out) exists on one side only."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.keepout-field"]
meaning = "Level 7: a field of two matched rule areas differs."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.graphic-missing"]
meaning = "Level 7: a board graphic, or a graphic of a footprint, exists on one side only."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.text-missing"]
meaning = "Level 7: a board text, or a text of a footprint, exists on one side only."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.text-field"]
meaning = "Level 7: the position, size, thickness, rotation or justification of two matched texts differs."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.field-pose"]
meaning = "Level 7: the pose of a footprint field (reference, value or user field) differs: position, layer, size, rotation, visibility or justification."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.hole-missing"]
meaning = "Level 7: a board hole exists on one side only."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.dimension-missing"]
meaning = "Level 7: a dimension exists on one side only."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.render-missing"]
meaning = "Level 8: a layer or sheet is rendered by one side only."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.render-pixels"]
meaning = "Level 8: the rendered masks of a layer or sheet differ beyond the pixel tolerance (parts per million of the inked pixels, after a tolerance of one pixel); where names the box of the largest differing region."
fix = "Look at the box on both sides (fenolite view NEW --compare OLD names the changed primitives); raise --pixel-ppm only for a known rendering difference."
see = "equivalent"

["equiv.sheet-missing"]
meaning = "Level S: a sheet instance exists in one drawn schematic only."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.symbol-missing"]
meaning = "Level S: a symbol unit is drawn on one side only."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.symbol-pose"]
meaning = "Level S: the position, rotation or mirror of a matched symbol differs."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.symbol-field"]
meaning = "Level S: the pose of a field of a matched symbol differs."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.item-missing"]
meaning = "Level S: a wire, bus, bus entry, junction, no-connect flag, label, power symbol, sheet reference, sheet pin or opaque item is drawn on one side only."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.item-field"]
meaning = "Level S: a field of a matched label, sheet reference or sheet pin differs."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.drawn-net"]
meaning = "Level S: the drawn connectivity differs: a pin joins another group of pins."
fix = "Make the two designs agree, or accept the difference with a reason (an exclusion profile, or fidelity.accepted of PROVENANCE.json for verify-source)."
see = "equivalent"

["equiv.route-vias"]
meaning = "For the same joined pads, the count of vias per pair of copper layers differs."
fix = "Restore the via that was lost, or remove the one that was added."
see = "equivalent"

["equiv.side"]
meaning = "A footprint is on the top side on one side of the comparison and on the bottom on the other."
fix = "Flip the footprint on one of the boards."
see = "equivalent"

["equiv.value"]
meaning = "The value of a component differs between the two sides; values are compared as exact text."
fix = "Make the two designs agree, or name the known difference in an exclusion profile (--exclusions with --profile)."
see = "equivalent"

["erc.lite.floating-pin"]
meaning = "A pin is on no net and is not marked as not connected."
fix = "Connect the pin, or mark it with no_connect in the script."
see = "check"

["erc.lite.output-conflict"]
meaning = "Two or more driving outputs are on one net."
fix = "Separate the outputs, or correct the pin types if they do not both drive."
see = "check"

["erc.lite.power-undriven"]
meaning = "A power input is on a net without a power output or a power interface."
fix = "Connect a power source to the net, or declare the net in a power interface."
see = "check"

["export.failed"]
meaning = "The export of one kind failed: kicad-cli exited with an error, wrote no file or timed out. 'where' is the kind."
fix = "Run again, with a larger --timeout if it timed out; run 'fenolite check' to see whether KiCad loads the board."
see = "export"

["export.kind-unavailable"]
meaning = "The running kicad-cli major cannot export this kind, so no tool ran for it."
fix = "Use a kicad-cli that has the command, or drop the kind from the request."
see = "export"

["export.model-unread"]
meaning = "kicad-cli reported that it could not add the 3D model of the part that 'where' names, although Fenolite gave it the model file. The STEP is written without that body."
fix = "Run 'fenolite models' on the board to see which file was given, and open the model in KiCad: the file may be damaged or in a format the STEP export does not read."
see = "export"

["export.page-too-small"]
meaning = "The outline of the board does not fit the page of its drawing sheet, so the board PDF is cut at the page. The files are written all the same."
fix = "Choose a larger paper for the board (Design.sheet(paper=...) in a script, or Page Settings in KiCad), or move the board onto the page, and export again."
see = "export"

["export.readback-drill"]
meaning = "A hole of the drill files matches no hole of the board in position, diameter and plating, or a hole of the board (a drilled pad, a via, a slot) is in no drill file. Nothing was written."
fix = "Read the message: it names the hole and the file. Fix the board, or report the file if the board is right."
see = "export"

["export.readback-empty"]
meaning = "The Gerber file of a copper layer that holds copper draws nothing. Nothing was written."
fix = "Check the layer in KiCad; report the file if the board holds copper there."
see = "export"

["export.readback-layer"]
meaning = "A copper layer of the board, or the outline, has no Gerber file with its file function. Nothing was written."
fix = "Export the Gerber files of every layer (no layer list that leaves one out), and report it if they were all asked."
see = "export"

["export.readback-outline"]
meaning = "The outline file that kicad-cli wrote does not close into one contour per ring of the board (the outer edge, each cut-out and each slot), compared by their boxes. The fabricator would cut another shape. Nothing was written."
fix = "Check the Edge.Cuts drawing of the board (an open corner, a stray line), fix it, and export again."
see = "export"

["export.readback-position"]
meaning = "A row of the position file does not match its footprint: position, rotation or side. The assembler would place that part elsewhere. Nothing was written."
fix = "Report the file with the board; check the part's placement and side in KiCad."
see = "export"

["export.readback-unsupported"]
meaning = "A file holds a construct outside the subset that Fenolite's readers take: another coordinate format, inches, step and repeat, a zero-suppressed drill coordinate. The readers refuse instead of guessing. Nothing was written."
fix = "Export without a preset that changes those formats, or without --readback, and report the file."
see = "export"

["export.sheet-missing"]
meaning = "The schematic PDF was refused: the hierarchy names a sheet file that is missing, outside the project folder, part of a cycle or too large to copy. kicad-cli would plot an empty page for it and report nothing."
fix = "Restore the sheet file that 'where' names inside the project folder, or export without --sch-pdf. No file of the export was written."
see = "export"

["export.stackup-default"]
meaning = "The board holds no stack-up, so the Gerber job file that KiCad writes states KiCad's own default: 0.035 mm copper, 0.01 mm solder masks, equal FR4 dielectrics that fill the board thickness, and the finish None."
fix = "Declare the stack-up with design.stackup() in the script, or enter it in KiCad's Board Setup, when the fabricator reads the job file."
see = "export"

["fiducial.too-few"]
meaning = "A side that the report covers holds surface-mount parts and fewer global fiducials than --min-fiducials asks; 'where' is the side. Fiducials are footprints with a pad that carries a fiducial mark."
fix = "Add fiducials to that side with design.fiducial(), or lower --min-fiducials to what the assembler asks."
see = "testpoints"

["fmt.would-change"]
meaning = "The file is not in Fenolite's canonical print; 'where' names the first line that differs."
fix = "Run 'fenolite fmt' on the file with --confirm; its tree does not change."
see = "fmt"

["gate.dropped"]
meaning = "With --gate drc, kicad-cli DRC found on the edited board a finding that the board without the edit lacks and that names this item of the edit, so the command left the item out (a tidy edit whole); the message gives the first finding, and result.gate.dropped lists them all."
fix = "Nothing to do for the rest of the board, which is written. Route or tidy that copper again after moving what it clashes with, or lay it by hand."
see = "route"

["gate.unnamed"]
meaning = "With --gate drc, kicad-cli DRC found on the edited board a finding that the board without the edit lacks but that names no item of the edit; KiCad can report clearance and unconnected entries differently between two runs of one board, so it may be noise of the tool."
fix = "Run 'fenolite check' on the written board and look at the finding; the edit was written."
see = "route"

["impedance.estimate-unsupported"]
meaning = "Some rows have no closed form: differential rows, one reference on an inner layer, or two references on an outer layer. Fenolite estimates single-ended surface microstrip and stripline only."
fix = "Nothing to do. Take the geometry of those rows from your fabricator or a field solver."
see = "impedance"

["impedance.mixed-dielectric"]
meaning = "A row's height crosses dielectrics of different permittivity; the estimate combines them in series, which a closed form does not model exactly."
fix = "Read the estimate as rough, and ask the fabricator for the row's impedance."
see = "impedance"

["impedance.no-stackup"]
meaning = "An estimate needs the heights and the permittivity of the board's stack-up, and the board has none, or a row's layers or a dielectric's permittivity are not in it. The rows left out are counted in result.counts.left_out."
fix = "Declare the stack-up with design.stackup() and its dielectrics' epsilon_r, then build again."
see = "impedance"

["impedance.none"]
meaning = "The design holds no impedance target, so the impedance table has no row."
fix = "Declare targets with design.rules.impedance() and build, or give a KiCad 10 project whose classes name tuning profiles."
see = "impedance"

["impedance.off-target"]
meaning = "A row's estimate lies outside the target's tolerance. The estimate is INFERRED and omits solder mask, etch, frequency and loss."
fix = "Compare with suggested_width, and confirm the geometry with your fabricator before changing the script."
see = "impedance"

["impedance.out-of-range"]
meaning = "A row lies outside the range in which the source of its closed form claims its accuracy."
fix = "Read the estimate as rough, and ask the fabricator or a field solver for the row's impedance."
see = "impedance"

["kicad.board-item.regenerated"]
meaning = "A rule area, text, drawing or dimension that the script declares was edited in KiCad; it was written again from the script. The message names the fields that differed."
fix = "Nothing to do; to keep the edit, change the call in the script, or remove the call and draw the item in KiCad."
see = "build"

["kicad.board-item.stale"]
meaning = "A rule area, text, drawing or dimension that an earlier build wrote has no call in the script any more and was removed from the board."
fix = "Nothing to do; put the call back to keep the item."
see = "build"

["kicad.downgrade.changed"]
meaning = "A downgrade (fenolite convert to an older KiCad major) wrote constructs of the newer major in the target's form, or dropped them because the target behaves the same without them; the hint names the resolver row."
fix = "Nothing to do: the target reads the design as the source holds it."
see = "convert"

["kicad.downgrade.design-loss"]
meaning = "A downgrade would drop a construct of the newer major that changes what is made or checked (a design row of the capability resolver), and --allow-lossy was not given."
fix = "Pass --allow-lossy to accept the loss that the report names, or keep the project at its own KiCad major."
see = "convert"

["kicad.downgrade.lost"]
meaning = "With --allow-lossy, a downgrade dropped constructs that the target cannot hold: a drawing, a text or metadata (presentation) or a part of the design (design); the hint names the resolver row."
fix = "Nothing to do if the loss is accepted; else keep the project at its own KiCad major."
see = "convert"

["kicad.downgrade.unresolved"]
meaning = "A construct newer than the target has no row in the downgrade resolver's table, or is still there after its edit: a defect of the table, nothing is written."
fix = "Report it with the file; keep the project at its own KiCad major meanwhile."
see = "convert"

["kicad.board.dropped-too-new"]
meaning = "With --allow-lossy, content that the target KiCad version cannot read was removed from the written board."
fix = "Nothing to do if the loss is accepted; else target the newer KiCad with --kicad-version."
see = "KiCad output"

["kicad.board.duplicate-uuid"]
meaning = "An item of the board uses a uuid that another item of the file already has."
fix = "Re-save the board in KiCad, which gives new uuids; Fenolite keeps both items."
see = "inspect"

["kicad.board.flip-unsupported"]
meaning = "A footprint cannot be moved to the bottom side, because it holds content that Fenolite does not know how to mirror."
fix = "Flip the footprint in KiCad, or keep it on its side."
see = "place"

["kicad.board.inexact-angle"]
meaning = "An angle of the file is not a whole number of microdegrees and was rounded in the model."
fix = "Nothing to do; the file's own text is kept when the item is not edited."
see = "inspect"

["kicad.board.inexact-length"]
meaning = "A length of the file is not a whole number of nanometres and was rounded in the model."
fix = "Nothing to do; the file's own text is kept when the item is not edited."
see = "inspect"

["kicad.board.kept-opaque"]
meaning = "A part of the board that Fenolite models could not be read into the model here, so it is kept verbatim and written back unchanged."
fix = "Nothing to do; that part cannot be edited through Fenolite."
see = "inspect"

["kicad.board.net-name-collision"]
meaning = "A net is stored with {slash} in its name, and another net of the board already has the name with a plain slash. The net keeps its stored spelling as its name."
fix = "Nothing to do; rename one of the two nets in KiCad if they are meant to be one."
see = "inspect"

["kicad.board.obsolete-dropped"]
meaning = "Writing for KiCad 10 removed or converted content that only KiCad 9 writes."
fix = "Nothing to do; KiCad 10 does the same when it saves the board."
see = "KiCad output"

["kicad.board.layer-undeclared"]
meaning = "An item uses a layer absent from the board's declared layer table."
fix = "Declare the intended layer or move the item to a declared layer; consent cannot waive this refusal."
see = "KiCad output"

["kicad.board.opaque-net-ref"]
meaning = "Kept content refers to a net in a form Fenolite does not know, or by a number absent from the file's net table, so the board cannot be written safely."
fix = "Re-save the board in KiCad; if it stays, report the item that 'where' names."
see = "KiCad output"

["kicad.board.outline-conflict"]
meaning = "The design has an outline and the board also holds edge graphics, so two outlines would be written."
fix = "Keep one: remove the outline from the script, or the edge graphics from the board."
see = "KiCad output"

["kicad.board.outline-overlap"]
meaning = "The model's cut-outs or slots overlap and the geo extra that writes their union is not installed; KiCad would call the outline invalid, so the board is not written."
fix = "Install the extra (pip install 'fenolite[geo]'), or move the cut-outs and slots the message names apart."
see = "KiCad output"

["kicad.board.free-hole"]
meaning = "The model holds holes outside every footprint (Board.holes); a KiCad board holds a hole only inside a footprint, so the board is not written."
fix = "Declare a hole with design.hole(), or place a board-only footprint with an unnumbered np_thru_hole pad."
see = "KiCad output"

["kicad.board.paper-unmodelled"]
meaning = "The board's paper setting has a form that the model does not hold, so the sheet is left unset and the text is kept."
fix = "Nothing to do."
see = "inspect"

["kicad.board.projection-read-only"]
meaning = "A value that Fenolite shows from kept content, other than the reference and the value, was changed; Fenolite cannot write that change."
fix = "Change it in KiCad, or leave the value as it was read."
see = "KiCad output"

["kicad.board.stackup-invalid"]
meaning = "The stack-up of the model cannot be written as a complete KiCad stack-up: it has a model.stackup-* finding, or its copper entries are not the copper layers of the board in order."
fix = "Correct the stack-up; the message names the first problem. --allow-lossy does not drop this error."
see = "KiCad output"

["kicad.board.stackup-rewritten"]
meaning = "The stack-up of a read board was rewritten from the model, and the replaced node held values that the model does not hold (for example a locked thickness); they were not written."
fix = "Nothing to do; set them again in KiCad's Board Setup if they matter."
see = "KiCad output"

["kicad.board.stackup-thickness"]
meaning = "The board states a total thickness that differs from the sum of its stack-up layers. KiCad's Gerber job file states the first and its IPC-2581 export the second; the model keeps the sum."
fix = "Open Board Setup in KiCad and save the physical stack-up again, or declare a locked stack-up in the script so that a build writes both."
see = "inspect"

["kicad.board.stackup-unmodelled"]
meaning = "The board's stack-up is complete, but it holds a value the model cannot hold exactly: a thickness that is not a whole number of nanometres, a copper, dielectric or mask layer without a thickness, a decimal that is not plain, or a dielectric outside the outer copper layers. It is kept as written and the model holds no stack-up."
fix = "Nothing to do; correct the value in KiCad's Board Setup to have the stack-up in the model."
see = "inspect"

["kicad.board.stackup-unused"]
meaning = "The board holds a stack-up node that KiCad does not use: its rows are not exactly the board's silkscreen, paste, mask and copper layers with one dielectric between neighbouring copper layers. KiCad's job file states no thickness for such a board, and the model holds no stack-up."
fix = "Open Board Setup in KiCad and save the physical stack-up, or declare the stack-up in the script; a build then writes a complete one."
see = "inspect"

["kicad.board.unknown-net"]
meaning = "An item refers to a net number that the file's net table does not hold; it is read without a net."
fix = "Re-save the board in KiCad."
see = "inspect"

["kicad.board.via-protection-too-new"]
meaning = "A via, or the board default, holds a covering, plugging, capping or filling of True, and the board is written for KiCad 9, whose format holds tenting only. KiCad 9 refuses to load a board that carries the newer children, so nothing is written."
fix = "Build for target 10, or clear the value (protect() without that feature, or the feature set to False). The error cannot be dropped."
see = "KiCad output"

["kicad.board.zone-outline-opaque"]
meaning = "A zone or rule area has an outline with arcs or with several polygons, which the model does not hold; it is kept verbatim."
fix = "Nothing to do; that zone's outline cannot be edited through Fenolite."
see = "inspect"

["kicad.copper.bad-intent"]
meaning = "A track(), via(), zone() or stitch() call of the script is malformed: its path, region, pitch, margin or key, or a key is used twice."
fix = "Correct the call that 'where' names."
see = "build"

["kicad.copper.bad-layer"]
meaning = "A layer of a copper call is not a copper layer of the board, or a via step does not change the layer."
fix = "Use a copper layer of the board; a via must join two different layers."
see = "build"

["kicad.copper.bad-size"]
meaning = "A size is not positive, or a drill is not smaller than its via diameter."
fix = "Correct the width, the diameter or the drill."
see = "build"

["kicad.copper.duplicate"]
meaning = "The board holds copper without a script uuid that equals an item the script creates; the board's copy was removed."
fix = "Nothing to do."
see = "build"

["kicad.copper.end-unplaced"]
meaning = "A copper call ends at a part that has no placement yet, so it creates nothing."
fix = "Place the part with place(), then build again."
see = "build"

["kicad.copper.layer-mismatch"]
meaning = "No pad at the end of a track has copper on the track's layer."
fix = "Start the track on a layer of the pad, or add a via."
see = "build"

["kicad.copper.net-conflict"]
meaning = "The pads at the ends of a track are on two nets or on none, or the net named in the call differs from theirs."
fix = "Connect pads of one net, and name that net or none."
see = "build"

["kicad.copper.no-net"]
meaning = "A via, a stitch or a track without a pad end names no net."
fix = "Pass net=... in the call."
see = "build"

["kicad.copper.pad-not-found"]
meaning = "A copper call names a part that has no footprint, a pad number that does not exist, or an index beyond the pads of that number."
fix = "Correct the part reference or the pad in the call."
see = "build"

["kicad.copper.regenerated"]
meaning = "Copper that the script creates was replaced by a new copy, because it was edited in KiCad or its pads moved."
fix = "Nothing to do; to keep a manual edit, remove the call from the script."
see = "build"

["kicad.copper.size-missing"]
meaning = "A width, a via size or a clearance is neither given in the call nor set by the net's class."
fix = "Give the size in the call or in the net class."
see = "build"

["kicad.copper.stale"]
meaning = "Copper that an earlier build created has no call in the script any more and was removed."
fix = "Nothing to do; put the call back to keep the copper."
see = "build"

["kicad.copper.stitch-empty"]
meaning = "A stitch() call keeps no via: every candidate position was rejected."
fix = "Enlarge the region or reduce the pitch or the margin."
see = "build"

["kicad.copper.stitch-skipped"]
meaning = "Some via positions of a stitch() call were dropped for clearance; the message gives the count."
fix = "Nothing to do."
see = "build"

["kicad.copper.unknown-net"]
meaning = "A copper call names a net that is not a net of the design."
fix = "Correct the net name."
see = "build"

["kicad.drc.*"]
meaning = "A finding of KiCad's own design rule check; the last part of the code is KiCad's violation type, and 'where' names the items."
fix = "Fix the board as KiCad's message says, or change the rule or its severity in the project, then run 'fenolite check' again."
see = "check"

["kicad.drc.parity-unchecked"]
meaning = "The DRC run was asked to compare the board with its schematic and KiCad did not do it, for example because it could not load the schematic. The copper findings of the run stand; no parity finding was looked for."
fix = "Open the schematic in KiCad and fix what the message names, or run the erc.kicad stage, which reports why the schematic does not load."
see = "check"

["kicad.drc.rules-not-loaded"]
meaning = "KiCad did not apply the project's custom rules in this run: the canary rule did not fire, or the rules file has no project file next to it."
fix = "Keep the .kicad_dru and the .kicad_pro of the same stem next to the board; the DRC findings of this run do not include the custom rules."
see = "check"

["kicad.drc.rules-unchecked"]
meaning = "Fenolite could not tell whether KiCad applied the custom rules; the message names the reason."
fix = "Treat the custom rules as unverified in this run and remove the cause the message names."
see = "check"

["kicad.erc.*"]
meaning = "A finding of KiCad's own electrical rules check of the schematic; the last part of the code is KiCad's violation type, and 'where' names the pins, symbols or labels."
fix = "Fix the schematic, or the script that generates it, as KiCad's message says, or change the severity of the check in the project, then run 'fenolite check' again."
see = "check"

["kicad.erc.position-unscaled"]
meaning = "The ERC report comes from a KiCad version for which the scale of report positions is not proved, so the positions are kept as the report gives them."
fix = "Use a supported kicad-cli (9 or 10); locate the items by their reference instead of their position."
see = "check"

["kicad.footprint.dropped-too-new"]
meaning = "With --allow-lossy, content of a footprint that the target KiCad version cannot read was removed."
fix = "Nothing to do if the loss is accepted; else target the newer KiCad."
see = "KiCad output"

["kicad.footprint.projection-read-only"]
meaning = "A footprint field that the writer keeps as it was read was changed; Fenolite cannot write that change."
fix = "Change it in KiCad's footprint editor."
see = "KiCad output"

["kicad.frame.courtyard-malformed"]
meaning = "A footprint's courtyard does not close, so the hull of its pieces is used as its extent."
fix = "Close the courtyard in the footprint editor."
see = "place"

["kicad.frame.no-courtyard"]
meaning = "A footprint has no courtyard, so the hull of its pads is used as its extent, or nothing when it has no pad copper."
fix = "Nothing to do; draw a courtyard for an exact extent."
see = "place"

["kicad.frame.shape-approximated"]
meaning = "A pad's copper is given as a shape that is at least as large as the real one."
fix = "Nothing to do; distances to that pad may be reported slightly short."
see = "check"

["kicad.generate.altium"]
meaning = "An Altium build with --copper-from holds generated-copper calls (band, keepout_ring, barrier, body_keepout, fanout_zone, stitch_pieces) or design.role_copper(): the board is the copper source, so the calls would be lost; the Altium build writes nothing."
fix = "Drop --copper-from to have the script's copper resolved in memory, or build the board for KiCad."
see = "build"

["kicad.generate.band-narrow"]
meaning = "Some cells of a band() cannot keep the clearance from other nets' copper even at the base width; the zone fill carves the copper there."
fix = "Move the spine away from the copper of other nets, or narrow the band."
see = "build"

["kicad.generate.crossing"]
meaning = "The outline of a band() crosses itself: two runs of its spine lie closer than the band is wide."
fix = "Space the runs of the spine at least max_width apart."
see = "build"

["kicad.generate.encloses"]
meaning = "The convex envelope of a barrier() closes around pads of other nets: their tracks cannot leave without crossing the band."
fix = "Pass pieces=True, a smaller setback, or move those parts."
see = "build"

["kicad.generate.name-taken"]
meaning = "A zone or a rule area of the design already holds the name a generated-copper call would give its zone or rule area."
fix = "Pass another name= to the call, or rename the zone or the rule area."
see = "build"

["kicad.generate.no-hole"]
meaning = "keepout_ring() names a part without a drilled hole."
fix = "Name a hole() or a part with a hole."
see = "build"

["kicad.generate.no-plan"]
meaning = "body_keepout() names a part whose footprint has no body outline and no courtyard, so its plan view is unknown."
fix = "Give the footprint a courtyard."
see = "build"

["kicad.generate.no-zone"]
meaning = "fanout_zone() finds no zone of its net on a layer other than its side, or stitch_pieces() finds no two zones of its net on different layers that overlap."
fix = "Declare the zones of the net first, with zone() or band()."
see = "build"

["kicad.generate.off-board"]
meaning = "A point of the spine of a band() lies off the board or inside a cut-out."
fix = "Move the spine inside the board outline."
see = "build"

["kicad.generate.pieces"]
meaning = "The copper of the class of a barrier() lies in several pieces, so one band would close over the ground between them; nothing is written."
fix = "Pass pieces=True for one band per piece, or a larger setback."
see = "build"

["kicad.generate.size-missing"]
meaning = "A generated-copper call needs a clearance, a track width or a via size that neither the call nor the class of its net gives."
fix = "Pass the size to the call, or give the net a class with it."
see = "build"

["kicad.generate.stitch-short"]
meaning = "An overlap of two zones of a stitch_pieces() call holds fewer vias than min_vias."
fix = "Reduce the pitch, the margin or the via size, or enlarge the overlap."
see = "build"

["kicad.generate.unknown"]
meaning = "A generated-copper call names a net, a part or a net class that the built design does not hold, or a class without copper."
fix = "Name what the script declares, and place the part."
see = "build"

["kicad.generate.unplaced"]
meaning = "A generated-copper call names a part that the build staged instead of placing, so nothing is generated for it."
fix = "Place the part in the script or in placements.toml, then build again."
see = "build"

["kicad.layers.added"]
meaning = "The script declares more copper layers than the existing board has, and both tables are ones that Fenolite creates: the board got the new inner layers and kept its layout."
fix = "Nothing to do; route the new layers, or declare planes on them with board(planes=...)."
see = "build"

["kicad.layers.removed"]
meaning = "The script declares fewer copper layers than the existing board has. The deepest inner layers were removed, with the tracks, arcs, blind or buried vias, zones, rule areas, graphics and texts on them; the message gives the counts for one layer."
fix = "Run the build with --dry-run first to see the counts; run fenolite route to close what reopened, or restore the .bak file and keep the board's count in board(copper=...)."
see = "build"

["kicad.layers.stackup-reset"]
meaning = "The board's stack-up names other copper layers than the new layer table, so it was removed: KiCad derives its default stack-up. A stale one would leave the Gerber job file without thicknesses."
fix = "Set the stack-up again in KiCad's board setup for the new layer count."
see = "build"

["kicad.length.bad-die"]
meaning = "A pad holds a die length that is not a non-negative decimal of millimetres. It counts as 0 in the length of its net."
fix = "Correct the die length of the pad in KiCad's pad properties."
see = "analyze"

["kicad.length.default-stackup"]
meaning = "The board holds no stack-up, so the height of each via is counted on the default stack-up KiCad assumes for such a file: copper layers of 35 µm and equal dielectrics that fill the board thickness less 20 µm. The total is what KiCad's DRC judges for this file, not a property of a real board."
fix = "Declare the stack-up in the design script or in KiCad's Board Setup, then measure again."
see = "analyze"

["kicad.lib.disabled"]
meaning = "A library nickname exists only in rows of the library table that are disabled."
fix = "Enable the row or name another library."
see = "build"

["kicad.lib.duplicate-nickname"]
meaning = "A library table holds a second row with the same nickname; the first one is used."
fix = "Remove or rename one of the rows."
see = "build"

["kicad.lib.extends-cycle"]
meaning = "The 'extends' chain of a symbol loops back to itself."
fix = "Correct the symbol library."
see = "build"

["kicad.lib.invalid-id"]
meaning = "A library reference is not library:name: it has no colon, an empty part, or a second colon."
fix = "Write the reference as library:name."
see = "build"

["kicad.lib.kept-opaque"]
meaning = "A part of a library file is kept verbatim, because the model does not hold it."
fix = "Nothing to do."
see = "inspect"

["kicad.lib.missing-3d-model"]
meaning = "A footprint names a 3D model file that was not found."
fix = "Nothing to do for fabrication; correct the model path for 3D views."
see = "build"

["kicad.lib.missing-entry"]
meaning = "The library exists but holds no footprint or symbol of that name."
fix = "Correct the entry name; 'fenolite catalog list' and 'fenolite inspect' show what a library holds."
see = "build"

["kicad.lib.missing-library"]
meaning = "The path of a library, with its variables expanded, does not exist or is of the wrong kind."
fix = "Correct the library path in the table or in the script."
see = "build"

["kicad.lib.missing-parent"]
meaning = "A symbol extends a symbol that its library does not hold."
fix = "Correct the symbol library."
see = "build"

["kicad.lib.missing-table"]
meaning = "A library table names a nested table file that does not exist."
fix = "Remove the row or restore the file."
see = "build"

["kicad.lib.name-mismatch"]
meaning = "The name inside a footprint file differs from the file's name; the file name is used."
fix = "Rename the file or the footprint so they agree."
see = "build"

["kicad.lib.nested-table-target"]
meaning = "Nested library table rows are used with KiCad 9 as the target, which does not read them."
fix = "Target KiCad 10, or list the libraries directly."
see = "build"

["kicad.lib.table-cycle"]
meaning = "A nested library table includes a table that is already being read."
fix = "Remove the row that closes the loop."
see = "build"

["kicad.lib.unknown-nickname"]
meaning = "A library nickname is in no row of the library tables."
fix = "Add the library to the script's libraries or to the project's table."
see = "build"

["kicad.lib.unresolved-variable"]
meaning = "A library path uses a variable that has no value."
fix = "Set the variable in the environment or in the project, or write the path out."
see = "build"

["kicad.lib.unsupported-type"]
meaning = "A library table row has a type other than KiCad or Table."
fix = "Convert the library to KiCad's format."
see = "build"

["kicad.outline.copper-dropped"]
meaning = "The script's new outline replaced the board's, and tracks, arcs or vias that are not script copper no longer fit it: they touch an edge, or lie outside the board or inside a cut-out. They were dropped; the message gives the counts and the nets."
fix = "Run the build with --dry-run first to see the counts; run fenolite route to close what reopened, or restore the .bak file."
see = "build"

["kicad.outline.forced"]
meaning = "board(..., locked=True) replaced edge content that was changed in KiCad, or that Fenolite did not write, with the script's outline. Edge items inside footprints stay; the message names their footprints."
fix = "Remove locked=True from board() to keep the outline drawn in KiCad."
see = "build"

["kicad.outline.invalid"]
meaning = "The script's outline cannot be written: a ring crosses or touches itself, two rings cross or touch, a cut-out lies outside the board or inside another cut-out, or an arc or a ring breaks the model's form. KiCad 10 reports such a board as invalid_outline. Nothing is written."
fix = "Keep every cut-out inside the board ring and clear of the edge and of the other cut-outs; the message names the rings."
see = "build"

["kicad.outline.merged"]
meaning = "Cut-outs or milled slots of the script overlap: they are written as one ring, their union, with the arcs of every round end kept (the geo extra unites them). The message names the items."
fix = "Nothing to do when the union is meant; move the items apart to keep them separate."
see = "build"

["kicad.outline.overlap"]
meaning = "Cut-outs or milled slots of the script overlap, and their union cannot be computed because the geo extra is not installed. KiCad calls two overlapping cut-outs an invalid outline, so nothing is written."
fix = "Install the extra (pip install 'fenolite[geo]') and build again, or move the items the message names apart."
see = "build"

["kicad.outline.replaced"]
meaning = "The board held the outline that Fenolite wrote, unchanged, and the script declares another one: the board's edges were replaced by the script's. Edge items inside footprints stay; the message names their footprints."
fix = "Nothing to do; check the parts that the new outline leaves outside (place.outside-outline)."
see = "build"

["kicad.outline.zone-short"]
meaning = "An arc of the board ring bulges beyond the box of its vertices and mid points, which a zone declared without an outline takes: the fill of the named zones stops short of that edge."
fix = "Give the zone an outline that holds the arc, or add a vertex at the extreme of the arc."
see = "build"

["kicad.meander.bad-intent"]
meaning = "A meander() call of the script is malformed: its key, side, amplitude, pitch, margin or segment index, it has both or neither of target and match, its key is used twice, or its segment is an arc."
fix = "Correct the meander() call that 'where' names; a meander stands on a straight segment of a track."
see = "build"

["kicad.meander.bad-match"]
meaning = "The track a meander matches created no copper, or the matches of several meanders form a cycle."
fix = "Check the issues of the matched track, or give one of the meanders a target length."
see = "build"

["kicad.meander.bad-shape"]
meaning = "The pitch of a meander is not above the width of its track, so neighbouring legs would touch."
fix = "Give a pitch of at least the track width plus the clearance of the net."
see = "build"

["kicad.meander.inexact"]
meaning = "After two corrections of the last bump, the length of the meandered track still lies more than 10 nm from its target."
fix = "Meander a segment that runs along an axis, or choose a target a few nanometres away."
see = "build"

["kicad.meander.no-room"]
meaning = "The segment is too short for the bumps the missing length needs with this amplitude, pitch and margin. The message gives the length needed and the most the segment can add."
fix = "Raise the amplitude, lower the pitch or the margin, or meander a longer segment."
see = "build"

["kicad.meander.no-segment"]
meaning = "The track a meander names created no segment of that index, because the track had an error or one of its ends waits for a staged part. The meander creates nothing."
fix = "Fix the issues of the track, or place the part its end names; the meander is resolved on the next build."
see = "build"

["kicad.meander.not-needed"]
meaning = "The track already has its target length, within 10 nm, so the meander changes nothing."
fix = "Nothing to do; remove the meander() call if the track will stay as it is."
see = "build"

["kicad.meander.too-long"]
meaning = "The track is already longer than the target of its meander. A meander only adds length."
fix = "Shorten the track, raise the target, or meander the other track of the pair instead."
see = "build"

["kicad.pad.zone-forced"]
meaning = "A locked request of the design script set the zone connection of a pad, and the board held another value. The script's value was written."
fix = "Nothing to do if the script is right; remove the lock from the request to keep what the board has."
see = "build"

["kicad.pad.zone-overridden"]
meaning = "The board holds a zone connection for a pad that differs from the unlocked request of the design script. The board's value was kept."
fix = "Lock the request in the script, edit the pad in KiCad, or build again with --discard-layout."
see = "build"

["kicad.pad.zone-unknown-pad"]
meaning = "A zone connection request of the design script names a pad number that the part's footprint does not have."
fix = "Correct the pad number in the script; the message lists the pads of the footprint."
see = "build"

["kicad.project.below-floor"]
meaning = "A net class value written to the project is below the board's minimum for it, so KiCad's DRC will report it."
fix = "Raise the class value or lower the minimum."
see = "KiCad output"

["kicad.project.class-shadowed"]
meaning = "A board-wide clearance rule overrides a larger clearance of a net class."
fix = "Restrict the rule with a condition, or raise its value."
see = "check"

["kicad.project.default-over-rule"]
meaning = "The clearance of the Default class stays above a board-wide clearance rule on this KiCad version, so the rule does not lower it."
fix = "Lower the Default class clearance if the rule's value is the one wanted."
see = "check"

["kicad.project.dropped-check"]
meaning = "With --allow-lossy, a severity of design.rules.severity() was left out of the project file, because the target KiCad has no DRC check with that key."
fix = "Name the code as 'fenolite check' prints it (kicad.drc.<type>), or remove the call for this target."
see = "KiCad output"

["kicad.project.dropped-pattern"]
meaning = "With --allow-lossy, a net whose name cannot be a safe pattern was written without its class assignment."
fix = "Rename the net, or assign its class in KiCad."
see = "KiCad output"

["kicad.project.dropped-too-new"]
meaning = "With --allow-lossy, a project setting that the target KiCad version does not read was removed."
fix = "Nothing to do if the loss is accepted."
see = "KiCad output"

["kicad.project.dropped-variable"]
meaning = "With --allow-lossy, a text variable that cannot be written to the project was left out."
fix = "Rename the variable."
see = "KiCad output"

["kicad.project.inexact-value"]
meaning = "A class value or a minimum of the project is not a whole number of nanometres and was rounded."
fix = "Nothing to do."
see = "inspect"

["kicad.project.minimum-kept"]
meaning = "The board-wide rule that governs a minimum has a severity other than error, or no minimum, so the project's minimum was left as it is."
fix = "Nothing to do."
see = "KiCad output"

["kicad.project.minimum-replaced"]
meaning = "A minimum of the project file was written again, because it was absent, not a number, or different."
fix = "Nothing to do."
see = "KiCad output"

["kicad.project.multiple-classes"]
meaning = "Several net classes match one net; the model takes the first."
fix = "Make the class patterns of the project exclusive."
see = "inspect"

["kicad.project.pattern-conflict"]
meaning = "A class assignment that the project file already holds gives a net another class than the design does."
fix = "Remove the entry in KiCad, or change the design's class."
see = "KiCad output"

["kicad.project.pattern-unsafe"]
meaning = "A net with a class has '*' or '?' in its name, or its exact-name pattern would also match a net of another class."
fix = "Rename the net."
see = "KiCad output"

["kicad.project.profile-reassigned"]
meaning = "A net class of an impedance target named another tuning profile in the project, and the build set it to the target's profile. The other profile is kept in the file."
fix = "Nothing to do when the script's target is meant. To keep the profile set in KiCad, take the class out of the target or copy the profile's values into the script."
see = "KiCad output"

["kicad.project.reserved-variable"]
meaning = "A text variable of the design uses a name that KiCad reserves."
fix = "Rename the variable."
see = "KiCad output"

["kicad.project.rule-below-minimum"]
meaning = "A rule asks for less than a board minimum, and this KiCad version applies the minimum instead."
fix = "Lower the minimum or raise the rule's value."
see = "check"

["kicad.project.too-new-key"]
meaning = "The project holds a setting that only KiCad 10 reads, and it is being written for KiCad 9."
fix = "Target KiCad 10, or pass --allow-lossy to drop the setting."
see = "KiCad output"

["kicad.project.unknown-check"]
meaning = "design.rules.severity() names a code whose key the target KiCad does not have among its DRC checks. KiCad ignores an unknown key without a message, so the build refuses it."
fix = "Name the code as 'fenolite check' prints it (kicad.drc.<type>); pass --allow-lossy to build without that severity."
see = "KiCad output"

["kicad.project.unknown-class"]
meaning = "A pattern or an assignment of the project names a net class that the project does not define."
fix = "Define the class or remove the entry in KiCad."
see = "inspect"

["kicad.project.unlowered-field"]
meaning = "A net class description is not written to the project file."
fix = "Nothing to do."
see = "KiCad output"

["kicad.project.unread-entry"]
meaning = "A pattern or assignment entry of the project has an unexpected shape and was not read."
fix = "Re-save the project in KiCad."
see = "inspect"

["kicad.project.unread-variable"]
meaning = "A text variable of the project has an unexpected shape and was not read."
fix = "Re-save the project in KiCad."
see = "inspect"

["kicad.sch.dropped-too-new"]
meaning = "A token of an embedded symbol needs a newer KiCad than the target of the write, and --allow-lossy removed it from the schematic."
fix = "Build for the newer KiCad version, or use a symbol library saved by the target version, to keep it."
see = "KiCad output"

["kicad.sch.duplicate-property"]
meaning = "A symbol or a sheet of the schematic holds two properties with one name. The first is used."
fix = "Open the schematic in KiCad and correct it there; the file is still read and rebuilt as it was."
see = "inspect"

["kicad.sch.duplicate-uuid"]
meaning = "Two items of one schematic file carry the same uuid."
fix = "Open the schematic in KiCad and correct it there; the file is still read and rebuilt as it was."
see = "inspect"

["kicad.sch.inexact-angle"]
meaning = "An angle of the schematic is not a whole number of microdegrees, so the item is kept as written and not modelled."
fix = "Nothing to do."
see = "inspect"

["kicad.sch.inexact-length"]
meaning = "A length of the schematic is not a whole number of nanometres, so the item is kept as written and not modelled."
fix = "Nothing to do."
see = "inspect"

["kicad.sch.kept-opaque"]
meaning = "The schematic reader keeps a part of the file as written, without a model for it. It is written back unchanged."
fix = "Nothing to do."
see = "inspect"

["kicad.sch.netlist-unsupported"]
meaning = "Fenolite reads the nets of a schematic itself only when the sheet is one it generated: symbols, global labels on pin ends, no-connect flags and its own power flags. This sheet holds something else, named first in the message, such as a wire, a local label, a sub-sheet or a power symbol."
fix = "Let KiCad read the sheet: run fenolite netlist with --source kicad, or fenolite check, which compares the netlist that kicad-cli exports."
see = "netlist"
["kicad.sch.pin-off-grid"]
meaning = "A pin of a library symbol does not end on the 1.27 mm grid of KiCad's schematic editor. KiCad's electrical rules check warns about such pin ends."
fix = "Move the pin onto the grid in the symbol library."
see = "build"

["kicad.sch.power-pin-shown"]
meaning = "A hidden power input pin of a library symbol is written visible in the generated schematic. KiCad joins hidden power inputs of one name into one net whatever label they carry, so a hidden pin could not be put on the net of the script."
fix = "Nothing to do; the library file itself is not changed."
see = "build"

["kicad.sch.sheet-cycle"]
meaning = "The sheets of the schematic refer to each other in a cycle, so the hierarchy has no end."
fix = "Break the cycle in KiCad: a sheet cannot contain itself, directly or through other sheets."
see = "inspect"

["kicad.sch.sheet-file-missing"]
meaning = "A sheet reference of the schematic has no Sheetfile property, so the sub-sheet cannot be found."
fix = "Open the schematic in KiCad and correct it there; the file is still read and rebuilt as it was."
see = "inspect"

["kicad.sch.sheet-missing"]
meaning = "A sheet reference names a file that does not exist beside the schematic."
fix = "Restore the sub-sheet file, or correct its name in the sheet reference."
see = "inspect"

["kicad.sch.sheet-outside"]
meaning = "A sheet reference names a file outside the folder of the root schematic. It is not followed."
fix = "Nothing to do; move the sub-sheet into the project folder if it should be read."
see = "inspect"

["kicad.sch.symbol-undefined"]
meaning = "A placed symbol names a library symbol that the schematic file does not hold."
fix = "Update the symbol from its library in KiCad, so that the file holds its definition again."
see = "inspect"

["kicad.sch.unconnected-name-unproven"]
meaning = "The name KiCad gives the net of this unconnected pin was not measured for a character of the pin's name, so its pad is left on no net. KiCad's parity test may report that pad."
fix = "Ignore the parity warning for this pad, or rename the pin in the symbol library with letters, digits and the characters + - _ . / ~."
see = "build"

["kicad.stackup.forced"]
meaning = "A locked stackup() of the script replaced the stack-up of the board, which differed from it."
fix = "Nothing to do; remove locked=True to keep what is entered in KiCad."
see = "build"

["kicad.stackup.overridden"]
meaning = "An unlocked stackup() differs from the stack-up on the board, and the board's stack-up was kept."
fix = "Lock the stack-up in the script, edit it in KiCad's Board Setup, or re-run with --discard-layout."
see = "build"

["kicad.via.protection-forced"]
meaning = "A locked via_protection() of the script replaced the via protection default of the board, which differed from it."
fix = "Nothing to do; remove locked=True to keep what is entered in KiCad's Board Setup."
see = "build"

["kicad.via.protection-not-exported"]
meaning = "The board default gives vias a covering, plugging, capping or filling that they do not carry themselves. kicad-cli 10.0.6 writes such a default to no fabrication file: its drill side files and its IPC-2581 export hold only the vias that carry the value themselves, and the Gerber and Excellon files hold none of the four features."
fix = "Give the value to the vias with protection= on Design.via, via_step or Design.stitch, or state it in the fabrication notes."
see = "build"

["kicad.via.protection-overridden"]
meaning = "An unlocked via_protection() differs from the via protection default on the board, and the board's default was kept."
fix = "Lock the default in the script, edit it in KiCad's Board Setup, or re-run with --discard-layout."
see = "build"

["kicad.wks.below-resolution"]
meaning = "A length of the drawing sheet is not a whole number of micrometres, which the file format cannot hold."
fix = "Round the length to a micrometre."
see = "template"

["kicad.wks.dropped-item"]
meaning = "With --allow-lossy, a kept item that the target cannot read was left out of the drawing sheet."
fix = "Nothing to do if the loss is accepted."
see = "template"

["kicad.wks.kept-opaque"]
meaning = "An item of the drawing sheet is kept verbatim, because the model does not hold it; the message says why."
fix = "Nothing to do."
see = "inspect"

["kicad.wks.legacy-root"]
meaning = "The drawing sheet uses an older root name; it is read as usual."
fix = "Nothing to do; KiCad writes the new name when it saves the file."
see = "inspect"

["kicad.wks.literal-variable"]
meaning = "A text would be written with '${' or with '%' and a letter that no token produced, which KiCad would read as a variable."
fix = "Use a token for the variable, or change the text."
see = "template"

["kicad.wks.param-reserved"]
meaning = "A {param:X} token uses the name of a variable that KiCad reserves."
fix = "Rename the parameter."
see = "template"

["kicad.wks.uninventoried"]
meaning = "The writer met a name that the token inventory does not list, so it cannot tell which KiCad versions read it."
fix = "Report the name; it is a gap in Fenolite's inventory."
see = "template"

["kicad.wks.unknown-value"]
meaning = "A setting of a sheet item has a value outside the set that KiCad reads."
fix = "Correct the value that 'where' names."
see = "template"

["kicad.zone.forced"]
meaning = "A locked zone() of the script replaced a zone of the board that differed from it."
fix = "Nothing to do; unlock the zone() to keep edits made in KiCad."
see = "build"

["kicad.zone.orphan"]
meaning = "A zone that an earlier build created has no zone() in the script any more and was removed."
fix = "Nothing to do; put the call back to keep the zone."
see = "build"

["kicad.fanout.failed"]
meaning = "route found no room for the fan-out via of an SMD pad of a plane net: none of the 72 candidates around the pad keeps the clearances, lies inside the plane's zone and on the board, and avoids the keep-outs. The pad stays open; the message names what blocked the first candidate."
fix = "Move the part or free room beside the pad, or join the pad to its plane in the design script, then run route again."
see = "route"

["kicad.zone.overridden"]
meaning = "An unlocked zone() differs from the zone on the board, and the board's zone was kept."
fix = "Nothing to do; lock the zone() to make the script win."
see = "build"

["kit.file-changed"]
meaning = "A file of the kit is missing or no longer has the SHA-256 that kit.json gives it. Every step of that sample fails, and no run is recorded from such a folder."
fix = "Build the kit again with 'fenolite kit build' and repeat the run; change nothing outside results/."
see = "kit"

["kit.form"]
meaning = "results/form.json is not sound as a whole: its schema, the tool version (AD <major>.<minor>), the system, the date or its fields."
fix = "Fill the form as STEPS.md says, and keep exactly the fields the blank form has."
see = "kit"

["kit.pending"]
meaning = "A check of a kit step was not run because the change that implements it is not there yet. The step passes on what was checked, and the rows that need the check stay pending."
fix = "Nothing to do; the check runs once that change is implemented."
see = "kit"

["kit.privacy"]
meaning = "A result file holds a string that looks like a home folder, another absolute path of the machine (on a drive, on a share or from a POSIX root) or a login name. result.privacy gives the file, the byte offset, the kind and the string."
fix = "Read the list before publishing the archive; save the document again from a neutral folder if the string must not be published."
see = "kit"

["kit.project-resaved"]
meaning = "The project file of a sample of the kit no longer has the bytes that kit.json names, and it still lists exactly the documents of its sample. Altium writes a project file again when the project is saved. The steps of the sample are judged, and the run record names the file."
fix = "Nothing to do. Any other change of a kit file, or a project file with another list of documents, is kit.file-changed."
see = "kit"

["kit.record-refused"]
meaning = "kit record wrote nothing: the run is synthetic, a file of the kit differs from kit.json, the form is not sound, or a record of that run exists with other content."
fix = "Record a run that a tool performed on an unchanged kit; a committed record is never edited."
see = "kit"

["kit.stale"]
meaning = "A register row carries the label of a kit run, and a sample that the row's steps use has other bytes in the kit the tree builds now."
fix = "Record a new run, or set the row back to the level it had and name the stale run in its result."
see = "kit"

["kit.step-failed"]
meaning = "A step of the kit failed: its result file does not pass a check, or its typed value is not the expected one. The message holds the reasons."
fix = "Read the reasons; repeat the step in Altium, or report the difference: a failed step refutes the rows it names."
see = "kit"

["kit.step-skipped"]
meaning = "A step of the kit was not done: its result file does not exist, or no value is typed. The rows it settles stay as they are."
fix = "Do the step, or leave it: a run may leave groups out."
see = "kit"

["kit.synthetic"]
meaning = "The form says that the run is synthetic, or does not say that it is not: no tool saved its files. Such a run verifies nothing and is never recorded."
fix = "Set synthetic to false only in the form of a run that was performed in Altium."
see = "kit"

["layout.alias-unused"]
meaning = "A moved() alias matched nothing on the board, or its part was already matched in another way."
fix = "Remove the alias from the script."
see = "build"

["layout.alias-used"]
meaning = "A part was found on the board through a moved() alias and is now kept under its new path."
fix = "Nothing to do; the alias can be removed after this build."
see = "build"

["layout.board-only"]
meaning = "A footprint of the board that Fenolite did not create matched no part of the script and is kept."
fix = "Nothing to do."
see = "build"

["layout.copper-mismatch"]
meaning = "The existing board's copper layers are not a layer table that Fenolite creates, so the board cannot follow board(copper=...) of the script. A count change between two tables that Fenolite creates is applied instead (kicad.layers.added, kicad.layers.removed)."
fix = "Give the board KiCad's inner layer names In1.Cu to In<n>.Cu in its board setup, or rebuild with --discard-layout to create the board on the script's count."
see = "build"

["layout.footprint-replaced"]
meaning = "A part's footprint changed in the script, so the footprint on the board was replaced and placed again."
fix = "Check the part's place on the board."
see = "build"

["layout.net-alias-unused"]
meaning = "A moved_net(old, new) call names an old net that the board does not have, so nothing follows the alias."
fix = "Remove the moved_net() call; an alias is needed for one build only."
see = "build"

["layout.net-alias-used"]
meaning = "The copper and the board-only pads of a net were kept under the net's new name, through a moved_net() alias or the alias of a renamed module."
fix = "Nothing to do; the alias can be removed after this build."
see = "build"

["layout.net-removed"]
meaning = "Copper on a net that the design no longer has was removed from the board."
fix = "Nothing to do; rename with care, since a renamed net is a removed and an added net."
see = "build"

["layout.orphan"]
meaning = "A footprint that an earlier build created has no part in the script any more and was removed."
fix = "Nothing to do; use moved() when a part only changed its path."
see = "build"

["layout.outline-kept"]
meaning = "The board's edge drawing differs from the script's outline, and the board's was kept."
fix = "Lock the outline in the script with board(..., locked=True) to replace the board's, edit the edge in KiCad to match, or rebuild with --discard-layout."
see = "build"

["layout.place-forced"]
meaning = "A locked place() of the script moved a footprint whose placement on the board differed."
fix = "Nothing to do; unlock the place() to keep placements made in KiCad."
see = "build"

["layout.place-overridden"]
meaning = "An unlocked place() differs from the footprint's placement on the board, and the board's placement was kept."
fix = "Nothing to do; lock the place() to make the script win."
see = "build"

["layout.source-invalid"]
meaning = "A table or a key of placements.toml is not valid: a path that is no component path, an unknown key, a missing x or y, a value that is not a whole number of nanometres or microdegrees, or a side other than top and bottom. The build stops."
fix = "Correct the entry, or write the file again with fenolite sync --to-source."
see = "build"

["layout.source-stale"]
meaning = "An entry of placements.toml differs from the placement that the board keeps for the part; the board wins."
fix = "Run fenolite sync --to-source to bring the file up to date."
see = "sync"

["layout.source-unknown"]
meaning = "A table of placements.toml names a component path that is not a part of the design."
fix = "Remove the table, or run fenolite sync --to-source, which writes the parts of the design only."
see = "sync"

["layout.unplaced"]
meaning = "A part has no placement, so its footprint was put in a row beside the board."
fix = "Place it with place() in the script, with 'fenolite place', or in KiCad."
see = "build"

["length.input-missing"]
meaning = "The stage length.rules had no rules source, so only the rules of the board model were judged, or no length facts, so the routed lengths were judged without via heights and die lengths. The stage's evidence is UNVERIFIED."
fix = "Check a KiCad project, whose backend gives the project's rules and the net lengths as KiCad counts them."
see = "check"

["length.out-of-range"]
meaning = "A net's total length, as the target KiCad major counts it (tracks, arcs, via heights and die lengths), lies below the min or above the max of the length rule that governs it. The opt of a rule is not judged, as KiCad does not; a net of pads only is judged at length 0. The rule sets the severity."
fix = "Change the routing of the net (a meander adds length: Design.meander), or change the limits of the rule."
see = "check"

["length.skew-out-of-range"]
meaning = "A net's length differs from the longest net of its group by more than the max of the skew rule that governs it. A skew rule groups every net it governs; a diff_pair_skew rule each pair among them. The longest net is never reported; the rule sets the severity."
fix = "Lengthen the shorter net (Design.meander), shorten the longer one, or change the rule."
see = "check"

["lock.changed"]
meaning = "Under build --frozen, one change of the design lock: the section, the key, the value before and after, and the reason (assigned, released, moved, explicit, taken, prefix-changed or design-renamed)."
fix = "Build without --frozen, review the change, commit the lock, then build frozen again."
see = "build"

["lock.design-renamed"]
meaning = "The design lock names another design than the script; the lock is rewritten with the script's design name."
fix = "Nothing to do; commit the rewritten lock."
see = "build"

["lock.ref-explicit"]
meaning = "An explicit ref of the script replaced the different ref the lock held for that path; the lock records the explicit ref."
fix = "Nothing to do; commit the lock."
see = "build"

["lock.ref-moved"]
meaning = "A design.moved() alias carried a lock entry from the old path to the new one, so the part keeps its ref."
fix = "Nothing to do; commit the lock. The alias can be removed after one build."
see = "build"

["lock.ref-prefix-changed"]
meaning = "The reference prefix of a part changed, so its locked ref, which does not start with the new prefix, was replaced by a new one."
fix = "Nothing to do if the new prefix is intended; commit the lock."
see = "build"

["lock.ref-released"]
meaning = "A lock entry names a path that is no longer a part, and no moved() alias carries it, so its ref is released and may be given to another part later."
fix = "If the part was renamed, add design.moved(old, new) and build again; otherwise commit the lock."
see = "build"

["lock.ref-taken"]
meaning = "A ref held by the lock for one part is now the explicit ref of another part, so the first part was given a new ref."
fix = "Keep the new ref, or edit the lock or the script so that each part has the ref you want, then build again."
see = "build"

["manifest.changed"]
meaning = "A file is not the one its manifest lists: its SHA-256 differs. Under 'manifest --verify' it is an error. When 'fenolite manifest' writes, it is a warning: the file is listed as it is now, without its tool and source, so it stays 'generated'."
fix = "Produce the file again with the command that wrote it, then run 'fenolite manifest' again; or keep the edit and accept the state 'generated'."
see = "manifest"

["manifest.missing"]
meaning = "A file that a manifest lists does not exist. Under 'manifest --verify' it is an error. When 'fenolite manifest' writes, it is a warning and the file is left out of the project manifest."
fix = "Produce the file again with the command that wrote it, or run 'fenolite manifest' to write a manifest of the files that exist."
see = "manifest"

["manifest.stale"]
meaning = "A file was made from a board or a schematic that has another SHA-256 now, so it does not describe the design as it is. 'where' is the file."
fix = "Run the producing command again ('export', 'render', 'bom' or 'pnp') with --manifest, then 'fenolite manifest'."
see = "manifest"

["manifest.unlisted"]
meaning = "A file lies in an artefact folder and no manifest entry lists it, so nothing is known about where it came from. It is not added to the project manifest."
fix = "Nothing to do for a file you put there yourself; for a file a command wrote, run that command again with --manifest."
see = "manifest"

["manifest.unreadable"]
meaning = "The fenolite-artifacts.json of the folder is not JSON, has another schema id or another shape. A producing command then writes nothing, rather than replace a file it does not understand; 'fenolite manifest' takes no entry from that folder."
fix = "Move the file away or delete it, then run the command again; 'where' names the file."
see = "manifest"

["model.corner-ratio"]
meaning = "A pad of the model holds a corner ratio that it cannot have: a value outside 0 to 500000 (parts per million of the pad's shorter side; 500000 is half of it), or a ratio on a pad whose shape is not roundrect. 'where' is the pad's id."
fix = "Give the pad a ratio from 0 to 500000, or remove the ratio from a pad that is no rounded rectangle."
see = "check"

["netlist.assignment-differs"]
meaning = "A pad is on different nets in two sources of the design: the model, the board file or KiCad's own export."
fix = "Find which source is right for the pad that 'where' names; build again if the board is stale."
see = "check"

["netlist.uncovered"]
meaning = "Some pads are named by one source and not by the other, per reason."
fix = "Nothing to do unless the reason is unexpected."
see = "check"

["parity.duplicate-footprints"]
meaning = "A footprint has the reference of an earlier footprint of the board; one finding for each further footprint."
fix = "Give each footprint its own reference, or remove the copy."
see = "parity"

["parity.extra-footprint"]
meaning = "A footprint of the board has no component of its reference in the schematic and is not marked as not in the schematic."
fix = "Remove the footprint, add the component to the schematic, or mark the footprint as not in the schematic."
see = "parity"

["parity.footprint-mismatch"]
meaning = "The value, the library footprint or the do-not-populate and exclude-from-BOM flags of a footprint differ from its schematic component's; the field of the finding names which."
fix = "Update the board from the schematic in KiCad, or rebuild the project."
see = "parity"

["parity.missing-footprint"]
meaning = "A component of the schematic has no footprint of its reference on the board."
fix = "Update the board from the schematic in KiCad, or rebuild the project."
see = "parity"

["parity.net-conflict"]
meaning = "A pad is on a net other than the one the schematic gives its pin, a pad on no net and a pad that no pin names included."
fix = "Update the board from the schematic in KiCad, or rebuild the project."
see = "parity"

["parity.oracle-differs"]
meaning = "Fenolite's comparison of the board with the schematic and KiCad's own parity test, run in the same check, disagree on one entry; KiCad's findings are the ones reported."
fix = "Act on the kicad.drc findings, and report the difference to the Fenolite project."
see = "parity"

["parity.pad-without-pin"]
meaning = "A numbered copper pad of a footprint is on no net and no pin of its symbol has that number: a mounting tab or a shield, usually."
fix = "Nothing, unless the pad should be connected: then add the pin to the symbol."
see = "parity"

["parity.pin-without-pad"]
meaning = "A pin of a symbol has a number that no pad of its footprint has, so its connection can never be routed; an error when other pins are on its net."
fix = "Choose a footprint that has a pad of that number, or correct the pin number of the symbol."
see = "parity"

["place.copper-left"]
meaning = "A footprint that was moved had tracks ending on its pads; the tracks stay where they were."
fix = "Route those nets again, or move the tracks in KiCad."
see = "place"

["place.courtyard-overlap"]
meaning = "The courtyards of two footprints on the same side overlap; 'where' names both."
fix = "Move one of the parts; 'fenolite neighbors' shows what is near."
see = "place"

["place.edge-clearance"]
meaning = "A courtyard is closer to the board edge than the edge clearance."
fix = "Move the part away from the edge."
see = "place"

["place.fill-stale"]
meaning = "A zone moved with a group by --turn or --shift keeps its fill moved with it, so the fill may not match what the filler would make around the copper that stayed."
fix = "Run 'fenolite fill' on the written board before 'fenolite check'."
see = "place"

["place.group-failed"]
meaning = "After --turn or --shift, a pad of a moved part lies more than 1 um from the move of its old position, the copper check finds a short or a clearance violation that the board before lacks, or the project or rules file beside the board could not be read for that check. Nothing is written."
fix = "Move the copper or the part named in where out of the way, pick another pose (--pose-search ranks them), or repair the file; report the board when a pad is off its goal."
see = "place"

["place.keepout"]
meaning = "The courtyard of a footprint enters a rule area that forbids footprints, on the face the area's copper layer judges (F.Cu the front, B.Cu the back); KiCad's DRC reports the same part as 'items not allowed'. An area that only touches the courtyard does not count."
fix = "Move the part out of the area; 'fenolite place' refuses the move unless --force is given, and its grid leaves such areas free."
see = "place"

["place.keepout-no-courtyard"]
meaning = "A footprint without a courtyard has pads in a rule area that forbids footprints. KiCad's DRC does not report a part without a courtyard, so only this warning tells."
fix = "Move the part out of the area, or give its footprint a courtyard so that KiCad judges it too."
see = "place"

["place.locked"]
meaning = "The footprint is locked on the board, so it was not moved."
fix = "Pass --force to move it, or unlock it in KiCad."
see = "place"

["place.no-definition"]
meaning = "A rotation or a change of side needs the footprint's library definition, which was not found."
fix = "Make the library available, or only translate the footprint."
see = "place"

["place.no-extent"]
meaning = "A footprint has neither a courtyard nor pad copper, so it is not judged for overlaps."
fix = "Nothing to do."
see = "place"

["place.no-outline"]
meaning = "The board has no closed outline, so only courtyard overlaps are judged."
fix = "Draw a closed outline to have the edge judged."
see = "place"

["place.no-room"]
meaning = "The automatic placement found no free position for a part; it stays where it was."
fix = "Enlarge the board, or place the part by hand with --move."
see = "place"

["place.outside-outline"]
meaning = "A courtyard leaves the board outline or enters a cut-out."
fix = "Move the part inside the board."
see = "place"

["place.region-barrier"]
meaning = "The region strategy could not put a barrier part (an isolator, a transformer) across the boundary between the two regions it joins: it has pins in one domain only, or in more than two, or its regions do not touch. It is packed inside the region of its first domain."
fix = "Order the groups so the barrier's two domains are neighbouring bands, or give --region boxes that touch, and run again; or move the part with --move."
see = "place"

["place.region-crossing"]
meaning = "After a region placement, open connections join pads in two different regions: the routing must cross the boundary there. Across an isolation barrier only the barrier part itself should join its two sides."
fix = "Check the groups: a part in the wrong region pulls its nets across the boundary. Move it with --move or change --group, then count the ways with 'fenolite analyze --kinds crossings'."
see = "place"

["place.region-unassigned"]
meaning = "A staged part belongs to no domain of the region strategy: it has no net, or no --group matches its reference. It stays where it was."
fix = "Add a --group that matches it, or place it with --move or with the grid (--only REF)."
see = "place"

["place.script-locked"]
meaning = "The part has a locked placement in the design script, so the next build puts it back."
fix = "Change the place() call in the script instead."
see = "place"

["place.unknown-ref"]
meaning = "--move or --only names a reference that the board does not hold."
fix = "Correct the reference; 'fenolite inspect' and 'fenolite net' show what the board holds."
see = "place"

["placement.height-unknown"]
meaning = "A part lies under a rule area that has a height limit, and no height is known for it: its footprint has no body, neither on the board nor in the .fenolite/ model of the build. An unknown height under a limit is never a pass."
fix = "State the part's height in the script with Part(..., height=...) and build again, or move the part out of the area."
see = "check"

["placement.rule-skipped"]
meaning = "A placement rule names a part that lies off the board (a part the build staged beside it), so the rule is not judged for that part."
fix = "Place the part on the board, with place() in the script or with 'fenolite place', and check again."
see = "check"

["placement.rule-unresolved"]
meaning = "A placement rule of the design names a part or a pad that the board does not hold, so it cannot be judged; an unresolved anchor leaves the whole rule unjudged."
fix = "Correct the near() call in the script, or build the design again so that the board and the rules of .fenolite/ agree."
see = "check"

["placement.too-far"]
meaning = "A part of a near() rule has no selected pad within the rule's distance of a pad of the anchor, measured between pad centres. The message names the rule, the nearest anchor pad and the distance, rounded up to the nanometre."
fix = "Move the part nearer to the pad it belongs to, or change the distance or the severity of the near() call."
see = "check"

["placement.too-tall"]
meaning = "A part under a rule area with a height_limit() is taller than the limit. The height is the top of the part's bodies above its own side of the board; the message names the area, the limit and the height."
fix = "Move the part out of the area, choose a lower part and state its height, or raise the limit or lower its severity in height_limit()."
see = "check"

["plan.not-staged"]
meaning = "The planned bytes could not be kept in the state folder: it is turned off (FENOLITE_STATE_DIR=off), it is not writable, or the plan is larger than the store. The plan and its id are right all the same."
fix = "Nothing is needed: --confirm --plan with the id runs the command once more and writes only when the new plan has the same id. To write the reviewed bytes without a second run, name a writable folder in FENOLITE_STATE_DIR."
see = "Writing files"

["pnp.no-outline"]
meaning = "The placement template asks for positions relative to the board outline, and the board has no closed outline. No row and no file is written."
fix = "Close the outline on the board, or set the origin of the template to the file origin."
see = "pnp"

["ready.check-skipped"]
meaning = "A check of 'fenolite ready' did not run: --no-kicad was given for ERC and DRC, or the stage skipped itself (for example ERC on a project without a schematic). The reply is not complete, and result.complete is false."
fix = "Run 'fenolite ready' without --no-kicad where kicad-cli 9 or 10 is installed, or add the schematic beside the board; until then 'ready' says nothing about that check."
see = "ready"

["ready.net-open"]
meaning = "A net still has open connections on the board: islands of its copper and pads that nothing joins. The message gives their number and the shortest one."
fix = "Run 'fenolite route' again, or add the copper in the script; 'fenolite net BOARD NAME' lists each open connection."
see = "ready"

["ready.part-value-missing"]
meaning = "A fitted part has an empty value, so the bill of materials and the assembly drawings cannot say what to place."
fix = "Give the part a value in the script (value=...) or in the schematic, or mark it DNP if it is not fitted."
see = "ready"

["ready.pin-unconnected"]
meaning = "A pin of a fitted part is on no net, or alone on its net, and carries no no-connect mark: either a connection is missing or the pin is meant to stay open and says nothing."
fix = "Connect the pin, or mark it as unconnected on purpose (no_connect() in the script, a no-connect flag in the schematic)."
see = "ready"

["ready.power-net-unsized"]
meaning = "A power net (named by a Power interface, or holding a power input or output pin) has neither a track width of its own net class or of a track_width rule that selects it, nor a zone, so it would be routed at the default width."
fix = "Put the net in a net class with a track width, add a track_width rule for it, or pour a zone on it."
see = "ready"

["refs.missing"]
meaning = "A document of the project names a path that resolves to no file or folder: a library, a sheet, a 3D model or a drawing sheet that was moved or never copied."
fix = "Copy the missing file into the project, or point the document at it again; `fenolite refs --repoint OLD=NEW` rewrites a common prefix."
see = "refs"

["refs.not-writable"]
meaning = "A document holds paths that start with the --repoint prefix, but Fenolite does not rewrite documents of its format (an Altium project file). It was left as it is."
fix = "Change those paths in the tool that owns the document."
see = "refs"

["refs.outside"]
meaning = "A document of the project names a path outside the project folder. A copy of the project still depends on that folder, and a moved project may lose the file."
fix = "Copy the file into the project and point the document at it, with `fenolite refs --repoint OLD=NEW`, or keep the dependency on purpose."
see = "refs"

["refs.unresolved"]
meaning = "A document names a path through a variable other than ${KIPRJMOD} (a library folder of the installation, for example). Fenolite does not know its value, so it does not say whether the path resolves."
fix = "Nothing to do when the variable is set in the tool; otherwise define it there."
see = "refs"

["render.failed"]
meaning = "A view could not be produced; 'where' is the view. It is never an error: a render is not a gate."
fix = "Run again; check that kicad-cli of the running version has the render command."
see = "render"

["render.region-empty"]
meaning = "The rectangle of 'render --region' holds no copper, hole or open connection of the board, so the view shows only the grid. The file is still written."
fix = "Check the corners and their units against the board's coordinates; 'fenolite inspect' and 'fenolite pads' give positions in millimetres."
see = "render"

["render.copper-simulated"]
meaning = "A zone in the region has no stored fill, or a stale one, so the region render draws its simulated pour (or its outline when the pour is too large), not a saved fill; the open connections follow that copper."
fix = "Run 'fenolite fill' to store the fill KiCad computes, then render again to see the saved fill."
see = "render"

["restore.backup-missing"]
meaning = "A backup that the receipt names does not exist any more, so the write cannot be undone as a whole. Nothing was restored."
fix = "Restore the files from version control or another copy."
see = "restore"

["restore.changed-since"]
meaning = "A file that the write produced is missing or no longer has the content that write gave it, so restoring would destroy a later change. Nothing was restored."
fix = "Undo the later change first, or copy the wanted content from the .bak file by hand."
see = "restore"

["restore.kept"]
meaning = "A file that the write created has no backup, so it stays as it is while the others are restored."
fix = "Remove the file by hand if it is unwanted."
see = "restore"

["restore.nothing"]
meaning = "The receipt kept no backup: the write created its files or ran with --no-backup, so there is nothing to put back."
fix = "Remove a created file by hand if it is unwanted; restore never deletes."
see = "restore"

["reuse.check-failed"]
meaning = "The copper check finds on the board with the moved parts a short or a clearance violation that the board before lacks, or a pad of a moved part lies farther than the tolerance from where the fit put it. Nothing is written."
fix = "Move the copper or the part named in where out of the way, or copy the placement first and route the block after; report the boards when a pad is off its goal."
see = "place"

["reuse.copper-dropped"]
meaning = "Reference copper of the block was not copied: it ended nowhere on the target board (free-end, via-under-two-layers), it formed an island, its net maps to two target nets (net-ambiguous), its layer has no image (layer-unknown), its target net could not be shaped (net-skipped), or the copper check found it too close (a copper.* code). where is the reason; result.copper.dropped lists each item."
fix = "Nothing is needed when the reason is expected; route the missing connections, or map the nets so that each reference net has one target net."
see = "place"

["reuse.drc-new"]
meaning = "With --drc, kicad-cli DRC finds more violations of one type on the board reuse would write than on the board as it is. Nothing is written."
fix = "Read the type in where; copy the placement without --copper, or fewer parts, and route the rest."
see = "place"

["reuse.fill-stale"]
meaning = "Reuse copied copper onto a board whose zones are filled, so the fills no longer match the copper."
fix = "Run 'fenolite fill' on the written board before 'fenolite check'."
see = "place"

["reuse.mirror-suspected"]
meaning = "A part fits its reference part only on the side opposite to the one the block gives it: one of the two footprints is likely the mirror of the other. The part is placed on the side its pads fit."
fix = "Compare the two footprints with fenolite pads; correct the footprint, or keep the placement when the mirror is intended."
see = "place"

["reuse.no-fit"]
meaning = "A part (or the anchor) has no pad whose number occurs once in both it and its reference part, or the best rigid fit leaves a pad farther than --tolerance from its goal. The part is not placed; for the anchor nothing is placed."
fix = "Map the part to a reference part of the same footprint with --map, pick another --anchor, or raise --tolerance only for a known small difference."
see = "place"

["reuse.project-unread"]
meaning = "The project file or the rules file beside the target board could not be read, so the copper check that judges the copy runs without its net classes and rules."
fix = "Repair or remove the file named in where, then run reuse again."
see = "place"

["reuse.unknown-part"]
meaning = "A part of --parts is not on the target board, or its reference part (the same reference, or the one --map gives) is not on the reference board."
fix = "List the parts with fenolite inspect or fenolite pads, and correct --parts or --map."
see = "place"

["roles.ambiguous"]
meaning = "Two rules of the role inference gave a net different roles at one confidence; the first is kept (`docs/roles.md`, \"Inference rules\"). The message names the net, the two kinds and the rules."
fix = "Confirm the net's role with `fenolite roles PATH --set NET=KIND --confirm`, or declare it in the script with `design.net_role(...)`."
see = "roles"

["roles.copper-blocked"]
meaning = "The role copper found no free path between two pad clusters of a net on a layer (or no room for a via array): the band would cross the copper of another net, a corridor or a keep-out. Nothing is forced; that connection is missing."
fix = "Move the parts or the copper between them, or route that connection by hand (phase 2 routes the switch-node connections it leaves)."
see = "roles"

["roles.copper-extra"]
meaning = "A net's role copper branches, and uniting its bands into one zone needs the Clipper union of the `geo` extra, which is not installed; only the longest edge (or the single chain) was generated."
fix = "Install the extra (`pip install fenolite[geo]`) and run again."
see = "roles"

["roles.copper-kept"]
meaning = "A role item that you edited since the last run (its fingerprint differs from `.fenolite/role-copper.json`) was kept as it is and treated as an obstacle."
fix = "Nothing to do; to have the generated item back, pass `--regenerate KEY` or `role_copper(regenerate=(KEY,))`."
see = "roles"

["roles.copper-narrow"]
meaning = "A band of role copper cannot keep its clearance from other copper even at its base width in some cells; the fill carves the copper there, so the section there may be below the current's width."
fix = "Move the spine's neighbours, or check the section with `fenolite fill` then `fenolite check`."
see = "roles"

["roles.copper-placement"]
meaning = "The placement bound of a hot loop (the polygon of its pad centres) is already over your `loop_max`: no copper can meet the limit. The copper is still drawn; phase 1 never moves parts."
fix = "Place the input capacitor across the switches, then run the role copper again."
see = "roles"

["roles.copper-skipped"]
meaning = "A role net got no role copper: `unconfirmed` (an inferred role you have not confirmed), `current-missing` (a power or switch-node role without a current; warning), `user-copper` (your own zone holds the net on that layer) or `shared-layer` (the ground planes went to another ground net)."
fix = "Confirm the role with `fenolite roles PATH --accept`, give it a current, or remove your zone to get role copper there."
see = "roles"

["roles.copper-worse"]
meaning = "The role copper would add a role finding of warning or above that the board did not have (judged on the simulated pour, before and after); nothing is written. The topological findings of the routes (Kelvin and gate-return attachments) are not counted."
fix = "Read the finding it names; move the parts, or pass other layers, widths or `kinds` to the role copper."
see = "roles"

["roles.corridor-blocked"]
meaning = "A provisional corridor of a critical route (`role.corridor.<group>.<net>`) would cover another net's pad or a locked item of another net, so it was not written; phase 2 routes around that copper."
fix = "Nothing to do for phase 1; route the gate loop or the Kelvin pair (phase 2), or move the copper that blocks it."
see = "roles"

["roles.current-missing"]
meaning = "A `power`, `switch_node` or `ground` role has no current: no `milliamps` on the role, no `[[current]]` row and no `--current`. Its copper is not judged for current."
fix = "Give the current with `--current NET=AMPS`, a `[[current]]` row, or `design.net_role(net, ..., current=amp(...))`."
see = "roles"

["roles.declared-differs"]
meaning = "The script declares a net's role differently from the role it overrides (the confirmed one or the inferred one); the declaration wins. The message names both kinds and the rule of the inferred one."
fix = "Nothing to do if the declaration is right; otherwise change `design.net_role(...)` in the script and build again."
see = "roles"

["roles.gate-loop"]
meaning = "A gate loop (driver output, gate, source or Kelvin source, driver return) encloses more than your `gate_max`, or more than `gate_ratio_max` times its placement bound, the area of the polygon through its pad centres. The message names the limit and its source."
fix = "Place the driver next to the switch and run the gate return beside or under the gate trace, on the next layer."
see = "roles"

["roles.gate-return-shared"]
meaning = "The return of a gate loop reaches the switch's power source copper (its source pour or track) before the loop's source pad: load current then flows in the gate loop (S-0852, S-0853). An error on a confirmed or declared group."
fix = "Take the gate return from the Kelvin-source pad, or from the source pad itself, with its own trace to the driver's return pin."
see = "roles"

["roles.kelvin-apart"]
meaning = "The two sense branches of a Kelvin pair enclose more than `pair_ratio_max` times their placement bound: they do not run as a coupled pair. The message names the pair, the area and its longest leg."
fix = "Route the two sense lines side by side from the shunt to the amplifier, as a pair."
see = "roles"

["roles.kelvin-outer"]
meaning = "A sense line attaches to its shunt pad on the outer half, away from the other sense pad: the load current's path through the pad and the solder is in the measurement (S-0850). The message gives the offset t from the pad's centre. An error on a confirmed or declared pair."
fix = "Start the sense line on the inner half of the pad, toward the other sense pad."
see = "roles"

["roles.kelvin-shared"]
meaning = "A sense branch of a Kelvin pair reaches the power copper of the shunt's net (a pour, a power track or another power pad), or the receiver sits on a force pad's net, before the sense pad (S-0850). An error on a confirmed or declared pair."
fix = "Run the sense line from the shunt's own pad (a four-pad shunt: its sense pad), apart from the power copper, to the receiver."
see = "roles"

["roles.limit-missing"]
meaning = "A high-voltage net (a `high_voltage` role, or a `power` role with a working voltage) has no `[[distance]]` or `[[step]]` row: Fenolite ships no creepage or clearance table, so its distances are not judged."
fix = "Add `[[distance]]` rows for the net, or a `[[step]]` table by voltage, from the standard that applies to the product (S-0854 explains the method)."
see = "roles"

["roles.loop-area"]
meaning = "A hot loop (the input capacitor across the switches) encloses more than your `loop_max`, or more than `loop_ratio_max` times its placement bound, the area of the polygon through its pad centres. The message names the loop, its area and the limit with its source."
fix = "Place the input capacitor across the switch pair and keep the return directly under the supply path."
see = "roles"

["roles.loop-open"]
meaning = "A leg of a role loop, or a sense or return branch, has no copper on the board: the connection is not routed, or a zone's fill is missing. That part of the loop is not judged."
fix = "Route the connection, or refill the zones (`fenolite fill`), then check again."
see = "roles"

["roles.near-switching"]
meaning = "Sense, gate or sensitive copper runs nearer than `switching_distance_nm` to switch-node copper on its layer, or over it on a neighbouring layer (its length over the switch node's fill, or its broadside overlap with its tracks). The coupling score is shown and judges nothing."
fix = "Move the sensitive copper away from the switch node, or put ground copper between them."
see = "roles"

["roles.return-gap"]
meaning = "A gate net or a sensitive signal crosses a gap of its ground copper on the neighbouring layer: its return current goes around the gap. It replaces `analysis.return-split` for those nets. The message gives the layer, the item and the span."
fix = "Route the net over unbroken ground, or close the gap in the ground under it."
see = "roles"

["roles.section-current"]
meaning = "A pour on the path of a role with a current narrows below the width the method asks for: by the rule of thumb (`width_per_amp_nm`) without a temperature rise, by the capacity fit of S-0269 with one. The message gives the width and the method."
fix = "Widen the pour there, or remove the cut-out that narrows it; above 1 A, give a temperature rise to judge by the fit."
see = "roles"

["roles.unconfirmed"]
meaning = "Some roles and groups are inferred and not confirmed: their findings are at most warnings. The message gives their count."
fix = "Review them with `fenolite roles PATH`, then confirm (`--accept`, `--accept-all`), correct (`--set`) or reject them through a reviewed plan."
see = "roles"

["roles.via-current"]
meaning = "A layer change on the path of a role with a current has fewer vias than `ceil(milliamps / milliamps_per_via)` by the rule of thumb, or vias whose barrels carry less than the current by the fit of S-0270 with a rise."
fix = "Add vias at the layer change, or give your via size's current with `design.role_limits(milliamps_per_via=...)`."
see = "roles"

["roles.width-current"]
meaning = "A track or arc on the path of a role with a current is narrower than the method asks for: `width_per_amp_nm` times the current by the rule of thumb (S-0851), or below the current by the capacity fit of S-0269 with a rise. The message names the width and the method."
fix = "Widen the track, or replace it with a pour; above 1 A, give a temperature rise (`--temp-rise`) to judge by the fit."
see = "roles"

["roundtrip.failed"]
meaning = "The file does not survive the level named in the message: reading it and writing it back would change it. 'where' is the first difference."
fix = "Do not edit the file through Fenolite; edit it in KiCad, or report the difference."
see = "roundtrip"

["route.bad-item"]
meaning = "The router returned copper that is malformed, so nothing was written."
fix = "Report it with the router's name; try another router."
see = "route"

["route.budget-exhausted"]
meaning = "The time budget of the route step (--timeout) ended before every router run was done. The copper of the runs that finished is kept and written; the run under way was stopped and gave none."
fix = "Run route again: it continues with the nets that are still open. Or raise --timeout, or make smaller runs with --order or --router-option group-nets=N."
see = "route"

["route.copper-removed"]
meaning = "The router dropped copper that the board already had."
fix = "Compare with 'fenolite diff' before confirming; route fewer nets if the loss is not wanted."
see = "route"

["route.fill-stale"]
meaning = "The new copper makes the filled zones out of date."
fix = "Run 'fenolite fill' on the board."
see = "route"

["route.incomplete"]
meaning = "With --require-complete, a selected net still has an open connection after the run, so nothing was written."
fix = "Read result.open, then run route again without --require-complete to keep the partial copper, or free some space first."
see = "route"

["route.net-declared"]
meaning = "Nets outside the job stayed declared in the design file given to Freerouting, because their class clearance is larger than the board's default rule and the router keeps only the default rule from copper without a net. Freerouting may route them too; that copper is not taken."
fix = "Nothing to do. To keep the router's time for the job, route those nets first, or select them with --nets."
see = "route"

["route.pair-skipped"]
meaning = "A differential pair was not given to the router, and neither were its two nets: the router does not route pairs, only one net of the pair was selected, the two nets are in different classes, the class has no pair width or gap, or the router does not pair names of that form. Half a pair routed alone, or a pair routed as two single nets, is uncoupled copper that KiCad's pair rules reject."
fix = "Route with a router that lists the feature pairs in fenolite capabilities, select both nets, give their class a pair width and gap, or pass --pairs-as-nets to route them as two single nets on purpose."
see = "route"

["route.pair-not-routed"]
meaning = "The octilinear router left a differential pair open: no shape of its centre line gave two coupled tracks at the pair gap that keep the clearance, every shape was longer than max-length, or a net of the pair has other than two pads. Both nets stay open."
fix = "Give the pair room with fenolite place --move, raise --router-option max-length, or route the pair with another router that lists the feature pairs."
see = "route"

["route.check-refused"]
meaning = "The copper check judged the copper the octilinear router placed and found a short or clearance finding that the board did not have before; the copper of that connection was removed and the net stays open."
fix = "Read the finding in the message, give the connection room with fenolite place --move, or route it with another router; fenolite check shows the board's findings."
see = "route"

["route.role-unrouted"]
meaning = "In role mode (route --roles critical), a gate loop or Kelvin pair was not routed. The message gives the reason (no-room, too-long, no-layer, near-switching, isolation, drc or pads), and result.roles holds the proposal with its command and a render --region command for the place."
fix = "Run the proposal's command: free the corridor it names, allow a via with --router-option kelvin-vias=2, raise max-length, or move a part; then run route --roles critical again. Draw the place with the render command first."
see = "route"

["route.role-refused"]
meaning = "In role mode, a group was routed, but the role check of c0222 then found a role finding on it that was new or larger than before; the whole copper of the group was removed."
fix = "Read the finding in the message, free the place it names, and run route --roles critical again; fenolite roles PATH --check shows the role findings."
see = "route"

["route.role-unconfirmed"]
meaning = "In role mode, inferred role groups that nobody confirmed were not routed: copper is placed and locked only for confirmed or declared groups. The message names them."
fix = "Review them with fenolite roles PATH, confirm the right ones with --accept-group NAME, then run route --roles critical again."
see = "roles"

["route.role-kept"]
meaning = "In role mode, a group whose connections copper already joins still has role findings; role mode removes no copper on its own, so the group was left as it is."
fix = "Run route --roles critical again with --rip to replace the group's branches; locked and script copper stay, so change the script when the old copper is script copper."
see = "route"

["route.role-placement"]
meaning = "In role mode, the placement bound of a gate loop is above the gate_max you set: no route can bring the loop's area under your limit."
fix = "Place the driver closer to the switch with fenolite place --move, or raise the limit with fenolite roles."
see = "roles"

["route.role-none"]
meaning = "In role mode, the board holds no gate loop or Kelvin pair to route: no role is stored or declared, or the groups named by --group are not among them."
fix = "Run fenolite roles PATH to see the inferred groups and confirm them with --accept-group or --accept-all; a hot loop is power copper and is not routed here."
see = "roles"

["route.pair-uncoupled"]
meaning = "With --pairs-as-nets, the two nets of a differential pair were given to the router as two single nets: their copper is not coupled at the pair gap."
fix = "Nothing to do if that is what you want. KiCad's diff_pair_gap and diff_pair_uncoupled rules judge the result; route with a router that has the feature pairs to couple them."
see = "route"

["route.optimizer-cut"]
meaning = "With --router-option optimize=on, Freerouting's optimizer run did not write a session in the time that was left. The copper of the first run, made without the optimizer, is kept."
fix = "Nothing is lost. To give the optimizer more time, run route again with --rip and a larger --timeout."
see = "route"

["route.option-ignored"]
meaning = "A --router-option that this router does not support was ignored."
fix = "Remove the option, or use the router that takes it."
see = "route"

["route.partial"]
meaning = "The router returned copper for a net that stays open; the copper is kept and written."
fix = "Run route again: the net is selected again and completed from this copper. Pass --rip with --nets to start that net again."
see = "route"

["route.resumed"]
meaning = "An earlier call of the same route on the same board was stopped or wrote nothing, and the copper of its router runs that had finished was kept. This call reused that copper and did not route those nets again; result.resumed counts the runs and the nets."
fix = "Nothing is needed. Copper made in two calls need not equal the copper of one: to start over, turn the state folder off for one call (FENOLITE_STATE_DIR=off) or pass --rip."
see = "route"

["route.tool-failed"]
meaning = "The external router exited with an error or wrote no result."
fix = "Read the message; run again with other options, or use --router direct."
see = "route"

["route.tool-missing"]
meaning = "The configured external router was not found."
fix = "Install it or name it with --router-path."
see = "route"

["route.tool-unpinned"]
meaning = "The external router is not the version that Fenolite was tested with."
fix = "Use the pinned version for results that can be repeated."
see = "route"

["route.unrouted"]
meaning = "A selected net is still not fully routed, or the router reports open connections."
fix = "Route the rest by hand, give the router more passes, or free some space."
see = "route"

["route.escape-skipped"]
meaning = "An --escape request was not given to the router: the pattern matched no part, the part has no pad on a net of the job, or the router has no escape step (the feature escape in fenolite capabilities)."
fix = "Check the reference pattern of --escape, select a net of the part with --nets, or route with a router that lists the feature escape."
see = "route"

["route.width-below-job"]
meaning = "The router returned a track or arc narrower than the width the job gave its net (the pair width for a pair net). The copper is kept; KiCad's DRC judges it against the board minimum and the class."
fix = "Run fenolite check. With freerouting, pass --router-option fanout=off: its fanout stage writes narrow wires at fine-pitch pins."
see = "route"

["route.zone-net-skipped"]
meaning = "A net that a zone carries was left out of the routing."
fix = "Pass the flag that includes zone nets if tracks are wanted for it."
see = "route"

["route.plane-net"]
meaning = "A net that has a zone on a plane layer (a copper layer of type power) is never given to a router: its pads reach the plane through vias. One issue per plane net that the --nets patterns select."
fix = "Nothing to do. route makes one fan-out via per SMD pad of the net unless --no-plane-fanout is given; run fill afterwards so the plane connects them."
see = "route"

["route.no-layer"]
meaning = "Track layer rules (no_tracks) forbid every routing layer to a selected net, so it was not given to the router."
fix = "Free at least one copper layer for the net in the no_tracks rules of the design, or route it by hand."
see = "route"

["route.constraint-not-sent"]
meaning = "The router takes no option for plane layers or for the layers a net is kept to, so it was told neither; its tracks may lie on a plane layer or on a layer a no_tracks rule forbids."
fix = "Run check after routing, or route with freerouting, which is told both."
see = "route"

["route.project-unread"]
meaning = "The project file or the rules file beside the board could not be read. Without the project every net takes the default class values; without the rules file the rules of the design are not given to the router."
fix = "Repair the file that 'where' names, or rebuild the project, and run route again."
see = "route"

["rules.dropped-for-target"]
meaning = "With --allow-lossy, a rule that the target KiCad version cannot load was left out of the rules file."
fix = "Nothing to do if the loss is accepted; else target the newer KiCad."
see = "KiCad output"

["rules.kept-opaque"]
meaning = "A rule of the rules file is kept verbatim, because the model does not hold its form; the message names the reason."
fix = "Nothing to do; Fenolite's own copper check does not apply that rule."
see = "inspect"

["rules.kind-unchecked"]
meaning = "A rule of the design has a kind that the target KiCad version cannot check, for example a creepage rule for KiCad 9. Writing it would leave a rule that nothing judges, so the build stops."
fix = "Build for a KiCad version that checks the rule, or pass --allow-lossy to leave the rule out of the rules file; it is then reported as rules.dropped-for-target."
see = "Build target"

["rules.unsupported-layer"]
meaning = "A rule names a layer that is not a KiCad layer name, or a layer clause that the target does not take."
fix = "Correct the layer of the rule."
see = "KiCad output"

["rules.unsupported-limit"]
meaning = "A rule has a limit that its kind does not take, or no limit at all."
fix = "Give the rule the limit of its kind, for example min for a clearance."
see = "KiCad output"

["rules.unsupported-selector"]
meaning = "A rule selects items in a way that cannot be written as a KiCad rule condition for the target."
fix = "Simplify the selector to nets, net classes, layers and item kinds."
see = "KiCad output"

["safety.changed-since-receipt"]
meaning = "A file of the destination differs from the hash the receipt recorded: someone saved it after the snapshot or after Fenolite's last write, or the receipt does not name it. Publishing would overwrite that work, so nothing was written."
fix = "Merge that file by hand, or take a new snapshot and edit it again; `--skip-changed` publishes the other files and leaves this one."
see = "publish"

["safety.open-session"]
meaning = "A file the command would write has a CAD tool's lock file beside it: the file is open in that tool (or was, before a crash). A save in the tool would overwrite this write, or this write would be lost on the tool's next save."
fix = "Close the file in the tool and run the command again. A lock file left by a crash may be deleted once the tool is closed."
see = "doctor"

["safety.placeholder"]
meaning = "`fenolite doctor --sessions` found a file that a sync client keeps only online."
fix = "Make it available offline before a command reads it; a command that would read it exits 3 with FEN-3007."
see = "doctor"

["safety.skipped"]
meaning = "With --skip-changed, a file of the destination that changed since the receipt was left as it is, and the other files were published."
fix = "Merge that file by hand from the copy."
see = "publish"

["safety.unstable"]
meaning = "After three shared retry rounds, a complete-set hash check still found a file whose observed hash differs from the collected bytes. That file need not have changed in every round. No copy was made."
fix = "Close the tool that keeps saving, or wait until it is done, and run the snapshot again."
see = "snapshot"

["silk.check-failed"]
meaning = "A designator that silk placed, or a silkscreen piece that --clip cut, fails the check of the written board: a designator within the clearance of a pad, a hole, other silkscreen, a courtyard, the edge or another designator, too small, turned or mirrored wrongly; a piece within the margin of a mask opening. Nothing is written."
fix = "Report the board and the command line; every candidate is checked before it is chosen, so this is a bug. Meanwhile place that part's text by hand and run silk with --keep."
see = "silk"

["silk.clip-skipped"]
meaning = "With --clip, a filled silkscreen shape (a filled rectangle, polygon or circle) meets a mask opening or a pad hole. A filled shape is not cut, so it stays as it is."
fix = "Edit the shape by hand (draw it as an outline, or move it off the pad), then run silk --clip again; --drc has KiCad judge the board."
see = "silk"

["silk.cut-by-other"]
meaning = "With --clip, the silkscreen of a footprint was also cut at another part's pad. That cut depends on where the parts sit, so this instance now differs from the other instances of its footprint, and fenolite library would make it a footprint of its own."
fix = "Move the parts apart so that no outline crosses another part's pads, then run silk --clip on the board again."
see = "silk"

["silk.drc-new"]
meaning = "With --drc, kicad-cli DRC finds more violations of one type on the board as silk would write it (placed designators, cut silkscreen) than on the board as it is. Nothing is written."
fix = "Read the type in where and report the board; a larger --clearance may avoid it."
see = "silk"

["silk.estimated"]
meaning = "No kicad-cli was found (or --measure estimate was given), so the ink of every text was estimated from Fenolite's glyph table instead of measured. The estimate holds the ink KiCad draws for the glyphs of the table; another glyph is taken as the widest."
fix = "Install KiCad 9 or 10, set FENOLITE_KICAD_CLI or pass --kicad-cli to measure; add --drc to have KiCad judge the result."
see = "silk"

["silk.footprint-changed"]
meaning = "With --clip, the silkscreen of a footprint was cut at its own pads, the same way on every instance. The board now differs from the footprint's library copy: the next update or rebuild from that library brings the cut ink back."
fix = "Write the library from the board with fenolite library BOARD --out LIB.pretty, or compare it with fenolite library BOARD --diff LIB.pretty, before the next rebuild."
see = "silk"

["silk.item-skipped"]
meaning = "A footprint holds drawn items that Fenolite does not model (a text box, a curve, a dimension, or a stroke that is not solid), so designators are not kept clear of them and --clip does not cut them."
fix = "Check the result with --drc, or look at the part named in where."
see = "silk"

["silk.no-outline"]
meaning = "The board has no closed edge, so silk cannot keep the designators inside it."
fix = "Close the outline on Edge.Cuts, then run silk again."
see = "silk"

["silk.no-place"]
meaning = "No candidate place beside the part is free: each one meets a pad, a hole, other silkscreen, a courtyard, the edge or another designator. The text stays where it was, and stands in the way of the others."
fix = "Allow a smaller size (--sizes) or both angles (--angles 0,90), lower --clearance, or move the part; the message names what blocks its best place."
see = "silk"

["specctra.pad-approximated"]
meaning = "A pad shape has no exact Specctra form and was given to the router as a larger simple shape."
fix = "Nothing to do; the router keeps a little more distance from that pad."
see = "route"

["specctra.renamed"]
meaning = "A name was changed for the Specctra file, because the format cannot hold it."
fix = "Nothing to do; the board keeps the original name."
see = "route"

["specctra.rounded"]
meaning = "A coordinate was rounded to the resolution of the Specctra file."
fix = "Nothing to do."
see = "route"

["specctra.session-moved"]
meaning = "The router's result places a component elsewhere than the board does, so the result was refused."
fix = "Run the router again; do not let it move components."
see = "route"

["specctra.unknown-list"]
meaning = "The router's result holds a list that Fenolite does not read; it was skipped."
fix = "Nothing to do."
see = "route"

["specctra.unknown-padstack"]
meaning = "The router's result uses a via that the design file did not offer."
fix = "Run the router again; report it if it repeats."
see = "route"

["specctra.plane-skipped"]
meaning = "A zone on a plane layer has no outline of three points or more, so the Specctra file holds no plane for it and the router does not count its net as joined there."
fix = "Give the zone an outline, or let design.zone() take the board outline."
see = "route"

["specctra.rule-not-sent"]
meaning = "A design rule is not in the Specctra file, because the format has no list for it: a rule on single nets, references or item kinds, a glob, a 'not', or a kind other than clearance, track width and edge clearance."
fix = "Nothing to do for the router; KiCad's design-rule check still judges the routed board against the rule."
see = "route"

["specctra.rule-widened"]
meaning = "A clearance or edge-clearance rule names layers. The Specctra file has no clearance per layer, so the rule was written for every layer and the router keeps it everywhere."
fix = "Nothing to do; the router keeps at least what the rule asks."
see = "route"

["sync.conflict"]
meaning = "A property changed both in the script (or edits.toml) and in the CAD file since the last build, to different values, or an edit of edits.toml was made over a script value that changed since (stale-edit); nothing is written."
fix = "Choose a side with fenolite build ... --take code:PATH#PROPERTY or --take cad:PATH#PROPERTY (board or schematic when the two CAD sides disagree), then run fenolite sync --to-source."
see = "build"

["sync.net-dropped"]
meaning = "The board holds copper on a net that the design no longer has and that no alias covers; the next build drops that copper."
fix = "Keep the net in the script, or name its new name with moved_net(old, new) before building."
see = "sync"

["sync.orphan"]
meaning = "A footprint that Fenolite placed is on the board and its part is not in the design; the next build removes it."
fix = "Keep the part in the script, or name its new path with moved(old, new) before building."
see = "sync"

["sync.placements-migrated"]
meaning = "No edits.toml was beside the script: the entries of the legacy placements.toml are carried into the edits.toml that sync writes."
fix = "Review edits.toml, commit it, then delete placements.toml."
see = "sync"

["sync.symbol-off-grid"]
meaning = "A symbol of the schematic is off the 1.27 mm grid or has a rotation and mirror that the schematic writer does not produce, so its placement cannot be written to schematic-placements.toml."
fix = "Move the symbol onto the grid in KiCad and run sync again."
see = "sync"

["sync.value-differs"]
meaning = "The value, the library footprint or a user property of a part differs between the board and the script; the next build writes the script's."
fix = "Change the script when the board is right; otherwise nothing to do."
see = "sync"

["sync.would-change"]
meaning = "With --check, a file beside the script is not what sync would write: the committed copy of the layout is stale."
fix = "Run fenolite sync --to-source --confirm and commit the file."
see = "sync"

["template.bad-value"]
meaning = "The sheet specification has a wrong type or value, a missing required key, or a TOML syntax error."
fix = "Correct the key that 'where' names."
see = "template"

["template.bitmap-not-png"]
meaning = "A bitmap file of the specification is not a PNG file."
fix = "Convert the image to PNG."
see = "template"

["template.cell-outside"]
meaning = "A cell of the title block lies outside its grid."
fix = "Correct the cell's row, column or span."
see = "template"

["template.cell-overlap"]
meaning = "Two cells of the title block cover the same grid position."
fix = "Change the span or the position of one of them."
see = "template"

["template.resolution"]
meaning = "A length of the specification is not a whole number of micrometres."
fix = "Round the length to a micrometre."
see = "template"

["template.too-wide"]
meaning = "The title block is wider or taller than the area inside the margins of a listed page size."
fix = "Make the block smaller, or drop that page size."
see = "template"

["template.unknown-key"]
meaning = "The specification holds a key or a table that the format does not define."
fix = "Remove it or correct its spelling."
see = "template"

["template.unknown-token"]
meaning = "A cell's token or label is not a valid token text."
fix = "Use a token that docs/sheet-templates.md lists."
see = "template"

["template.unproven-value"]
meaning = "A number of the specification has no entry in its provenance table, which this template requires."
fix = "Add the number to [provenance.values] with its source."
see = "template"

["template.zone-letters"]
meaning = "A listed page size would need more than 8 letter rows for its zones."
fix = "Use fewer rows, or drop that page size."
see = "template"

["tidy.acute"]
meaning = "The style report (fenolite tidy --report) found two tracks of one net that meet at an angle below 90°. Acute joints trap etchant and are hard to inspect; where names the two tracks and the message the point."
fix = "Route the joint again, or run fenolite tidy --straighten and look at the report once more."
see = "tidy"

["tidy.chamfer-undone"]
meaning = "A chamfer of a right-angle joint, a 45° entry of a T-joint or a cut of a zone corner was undone: it would have changed the connected groups of its net, or the copper check found something with it that the board before lacked. The message names the two tracks, the leg and the finding."
fix = "Nothing is needed: the joint stays a right angle. A shorter --leg may fit; or move the copper that is too close."
see = "tidy"

["tidy.check-failed"]
meaning = "The copper check finds a short or a clearance violation on the tidied board that the board before lacks, although every chamfer was checked on its own. Nothing is written."
fix = "Report the board and the command line; run tidy with one step at a time (--prune or --chamfer) meanwhile."
see = "tidy"

["tidy.drc-new"]
meaning = "With --drc, kicad-cli DRC finds more violations of one type on the tidied board than on the board as it is. Nothing is written."
fix = "Read the type in where, run tidy without the step that made it, and report the board."
see = "tidy"

["tidy.fill-stale"]
meaning = "Tidy changed copper of a board whose zones are filled, so the fills no longer match the copper."
fix = "Run 'fenolite fill' on the written board before 'fenolite check'."
see = "tidy"

["tidy.kept"]
meaning = "A track or an arc has a free end, but removing it would split the copper of its net: it is the only path between two parts of the net, so prune keeps it."
fix = "Trim the part past the last joint by hand, or route the net again."
see = "tidy"

["tidy.net-skipped"]
meaning = "A selected net holds a copper item that could not be shaped (a pad without copper entries, a degenerate track or zone outline), so tidy leaves the whole net as it is."
fix = "Read the issues of the board read; tidy the other nets with --nets."
see = "tidy"

["tidy.project-unread"]
meaning = "The project file or the rules file beside the board could not be read, so the copper check that judges each edit runs without its net classes and rules."
fix = "Repair or remove the file named in where, then run tidy again."
see = "tidy"

["tidy.straighten-skipped"]
meaning = "A net is in a differential pair, or a length, skew or pair-skew rule selects it, so straighten leaves its runs as they are: a new shape would change its length or its coupling."
fix = "Nothing is needed. Tidy a pair by hand, or route it again with the router."
see = "tidy"
["library.drift"]
meaning = "With --diff, a footprint made from the board differs from the library's footprint of the same name in the kinds the message names (pads, silkscreen, courtyard, models, fields), or the library lacks it (missing). Nothing is written."
fix = "Write the library again from the board with fenolite library --out, or edit the board's instances to match the library."
see = "library"

["library.instances-differ"]
meaning = "Two placed instances of one footprint name differ once brought back to their origin, rotation 0 and the top side, so the second is written as <name>_2 (then _3)."
fix = "Make the instances equal on the board if they should be one footprint; otherwise keep both footprints."
see = "library"

["library.not-local"]
meaning = "A bottom-side footprint could not be flipped back to the top side, so it is left out of the library."
fix = "Report the board; meanwhile copy that footprint from its library by hand."
see = "library"

["testpoint.board-only"]
meaning = "testpoints --place wrote its probes as footprints of the board only, without fenolite.path: a rebuild of the design script keeps them and their tracks (layout.board-only); 'where' names the probes."
fix = "Nothing to do. To author the probes in the design script instead, add design.test_point() calls and delete the probes from the board."
see = "testpoints"

["testpoint.check-failed"]
meaning = "Fenolite's copper check, with the project's rules, finds a short or a clearance finding with a probe or its track that testpoints --place chose, so that probe is not written; 'where' is its net."
fix = "A clearance rule of the project is larger than the clearance of the search; report the board."
see = "testpoints"

["testpoint.drc-new"]
meaning = "With --drc, kicad-cli DRC finds more of a type on the board with the probes than on the board as it is (library-table types aside), so nothing is written; 'where' is the type."
fix = "Report the board: every probe and track passed Fenolite's own copper check."
see = "testpoints"

["testpoint.no-site"]
meaning = "testpoints --place found no grid site for a probe of a net within --reach of its copper on the side's outer layer; the message names the nearest site and what blocks it. 'where' is the net."
fix = "Raise --reach, lower --size or --grid, or make room near the net's copper."
see = "testpoints"

["testpoint.coverage-low"]
meaning = "Fewer nets hold a reachable test point than --min-coverage asks. A net counts when it has two pads or more, and it is covered when a pad marked as a test point on it is open on the asked side."
fix = "Add test points to the nets the hint names with design.test_point(), or lower --min-coverage."
see = "testpoints"

["testpoint.covered"]
meaning = "A pad marked as a test point has no side where its copper layer and its mask layer are both present, so a probe does not reach it; 'where' is the pad."
fix = "Give the pad the mask layer of its copper side: F.Mask with F.Cu, B.Mask with B.Cu."
see = "testpoints"

["testpoint.no-net"]
meaning = "A pad marked as a test point is on no net, so it probes nothing; 'where' is the pad."
fix = "Connect the test point to the net it is for, or remove it."
see = "testpoints"

["testpoint.none"]
meaning = "No pad of the board carries the test-point mark, so the report lists no test point. KiCad's library test points carry no mark."
fix = "Place test points with design.test_point(), or mark an authored pad with Footprint.pad(fab_property=\"test_point\")."
see = "testpoints"

["testpoint.too-close"]
meaning = "Two test points that share an access side are closer, centre to centre, than --min-pitch asks; 'where' names both."
fix = "Move one of the two, or lower --min-pitch to the pitch of the test fixture."
see = "testpoints"

["trial.not-refilled"]
meaning = "fenolite.api.trial ran with refill on a kicad-cli older than 10.0, which cannot refill zones: both copies were checked with their stored fills, so a new finding against a zone may be one a refill would remove."
fix = "Run the trial with kicad-cli 10, or refill the board with 'fenolite fill' first and pass refill=False."
see = "check"

["zone.fill-mismatch"]
meaning = "A zone exists in only one of the two boards, so the refilled board is not a refill of this one."
fix = "Pass the refill of the same board to --from."
see = "fill"

["zone.fill-stale"]
meaning = "The saved copper of a zone differs from what KiCad fills now."
fix = "Run 'fenolite fill' on the board."
see = "check"

["zone.fill-unchecked"]
meaning = "The selected tool cannot refill zones, or two refills differ, so the fills were not checked."
fix = "Use kicad-cli 10 for this stage."
see = "check"

["zone.fill-unstable"]
meaning = "Another refill does not reproduce a zone's fill, so it cannot be relied on to be repeatable."
fix = "Nothing to do; the fill is still written."
see = "fill"

["zone.none"]
meaning = "The board has no zone with a net, so there is nothing to refill."
fix = "Nothing to do."
see = "fill"

["zone.unfilled"]
meaning = "KiCad's refill produces copper for a zone, but the saved board has none for it."
fix = "Run 'fenolite fill' on the board."
see = "check"

["place.constraint"]
meaning = "A hard placement constraint is violated."
fix = "Review the named outline, keepout, drill, copper or volume condition."
see = "place"


["place.incomplete"]
meaning = "Placement review has missing or conservative inputs."
fix = "Supply the named geometry, electrical or assembly inputs; retain the incomplete state."
see = "place"


["place.objective"]
meaning = "A supplied pad-distance objective is unmet or unknown."
fix = "Review the named pad identities and distance target; routing remains a separate stage."
see = "place"

["build.altium-layout-conflict"]
meaning = "A saved native schematic sheet no longer matches the fresh generated baseline, or was removed. No output is written."
fix = "Keep the native layout snapshot and resolve the source change. To deliberately regenerate, archive altium-schematic-layout.json and build into a new folder; --discard-layout does not bypass a source snapshot."
see = "build"

["sync.altium-connectivity-changed"]
meaning = "Native schematic edits changed component identities, symbol assignments, parameters or electrical connectivity."
fix = "Resolve the difference between the saved sheets and the Python circuit before synchronising."
see = "sync"

["sync.altium-unverified"]
meaning = "The generated baselines or edited sheets are incomplete, altered or unresolved, or the project sheet list or netlist options changed."
fix = "Restore the complete generated project, retain component IDs and resolve reader findings before synchronising."
see = "sync"

["composition.invalid-intent"]
meaning = "Block declarations or sheet membership conflict."
fix = "Resolve the named members, anchors or ordering."
see = "build"

["composition.overflow"]
meaning = "A block cannot fit the selected paper."
fix = "Choose a larger sheet or split the functional blocks."
see = "build"

["composition.overlap"]
meaning = "Computed presentation geometry intersects occupied content."
fix = "Separate the named blocks or simplify their contents."
see = "build"

["composition.template-unverified"]
meaning = "Template occupancy cannot be verified."
fix = "Use a template with bounded graphics and text."
see = "build"

["composition.transform-unsupported"]
meaning = "A symbol transformation cannot preserve its geometry."
fix = "Use a supported symbol or retain its original orientation."
see = "build"

["composition.connectivity-changed"]
meaning = "The composed native schematic changes electrical meaning."
fix = "Report the named net or pin as a generator defect."
see = "build"

["composition.budget-exhausted"]
meaning = "Deterministic placement search exhausted its candidate budget."
fix = "Reduce sheet congestion or split blocks."
see = "build"

["composition.label-fallback"]
meaning = "A local wire could not be drawn safely; labels retain the net."
fix = "Inspect the named endpoints in the generated preview."
see = "build"

["panel.vscore-copper"]
meaning = "Copper of a copy lies nearer to a V-score line than the clearance (0.45 mm by default, S-0799): the scoring blade may cut or expose it. 'where' names the copy and the score line."
fix = "Move the copper away from that board edge, separate that edge set with tabs (separate('tabs', between=…)), or give your fabricator's figure with vscore(clearance=…) or limits={'vscore_copper': …}."
see = "panel"

["panel.vscore-shape"]
meaning = "A V-scored edge set was given a gap: scored boards touch, the score line runs on their common edge."
fix = "Drop the gap of that axis from grid(), or separate that edge set with tabs."
see = "panel"

["panel.vscore-spacing"]
meaning = "Two parallel score lines are nearer than a fabricator allows: an error under 2 mm (S-0796), a warning under 5 mm (S-0801)."
fix = "Use larger boards, tab one of the edge sets, or give your fabricator's figure with limits={'vscore_spacing': …}."
see = "panel"

["panel.vscore-thickness"]
meaning = "The board is too thin for V-score (an error under 0.6 mm, S-0794; a warning under 0.8 mm, S-0801), or states no thickness (info)."
fix = "Tab the edge sets instead, or confirm with your fabricator and set limits={'vscore_thickness': …}."
see = "panel"

["panel.tab-copper"]
meaning = "Copper of a copy lies nearer to a mouse-bite hole than 0.25 mm (outer layers) or 0.40 mm (inner layers) (S-0799): breaking the tab may damage it."
fix = "Move the copper away from the edge, move the tabs with tabs(pitch=…), or keep the holes tangent (tabs(inset=0))."
see = "panel"

["panel.gap"]
meaning = "A routed gap is narrower than the routing tool: an error under 1.2 mm (S-0795), a warning under 2 mm (S-0798)."
fix = "Widen the gap with grid(gap=…), or give your fabricator's figure with limits={'gap': …}."
see = "panel"

["panel.tab-count"]
meaning = "A mouse bite has fewer holes than advised (5, S-0795), a copy is held by one tab (warning), or a copy is held by nothing (error)."
fix = "Use tabs(holes=5) or more, or a smaller tabs(pitch=…), so that every copy is held by two tabs or a score line."
see = "panel"

["panel.tab-spacing"]
meaning = "Tabs along one edge lie farther apart than advised (60 mm, S-0795)."
fix = "Give a smaller tabs(pitch=…)."
see = "panel"

["panel.fiducial-place"]
meaning = "A fiducial is off the rails, its centre is nearer than 3.85 mm to the panel's edge (S-0794), or a side has fewer than three (S-0797)."
fix = "Place fiducials on the rails with fiducials(), or move them with fiducial(ref, x, y)."
see = "panel"

["panel.tooling-place"]
meaning = "A tooling hole is not wholly on a rail (S-0800), or tooling_holes() found no pair of rails to hold them."
fix = "Add rails with rails(…), or place the hole with tooling_hole(ref, x, y)."
see = "panel"

["panel.size"]
meaning = "The panel is smaller than 50 mm or larger than 250 mm a side (S-0800, S-0795), or a scored panel is under 70 × 70 mm (S-0794)."
fix = "Change the grid or the rails; confirm the sizes your fabricator takes."
see = "panel"

["panel.board-outline"]
meaning = "The board named by the panel has no closed outline, or its outline is not one rectangle: this release panels rectangular boards."
fix = "Give the board a closed rectangular outline on Edge.Cuts and build it again."
see = "panel"

["panel.no-fit"]
meaning = "fit() found no copy of the board that fits the asked size with these rails and gaps."
fix = "Ask for a larger size, or narrower rails or gaps."
see = "panel"

["panel.net-collision"]
meaning = "Two copies' nets would take the same name B<k>/<name>."
fix = "Rename the board's nets so that none starts with B<k>/."
see = "panel"

["panel.source-unreachable"]
meaning = "The panel's Altium document cannot name the board's document by a path relative to it."
fix = "Write the panel in a folder on the same drive as the board's document."
see = "panel"

["panel.altium-cutout"]
meaning = "A copy has cut-outs or slots, which a flattened Altium panel cannot hold yet (board cut-out regions wait on Part S)."
fix = "Panel the board for KiCad, or remove its cut-outs and slots."
see = "panel"

["altium.panel-flattened"]
meaning = "The Altium panel is written flattened (copies of every item of the board), not as Altium's Embedded Board Array, which waits on the maintainer's kit (pcbdoc.EMBEDDED_ARRAYS). 'message' gives the reason."
fix = "Nothing to do; Altium can still place an array by hand on the flattened panel."
see = "panel"

["panel.output-changed"]
meaning = "A file that the last fenolite panel wrote was changed since; the panel is not written over it."
fix = "Run again with --discard-layout to replace it (a .bak copy is kept), or write the panel to another --out."
see = "panel"

["fidelity.build-failed"]
meaning = "verify-source built the script in its temporary folder and the build wrote no file, so no level ran; the build's own errors are listed beside this issue."
fix = "Fix the script or the libraries it names until fenolite build writes the project, then verify again."
see = "verify-source"

["fidelity.accepted-unused"]
meaning = "An accepted difference of fidelity.accepted in PROVENANCE.json matched no difference in a level that ran: the difference it accepted is gone."
fix = "Remove the entry from fidelity.accepted, so acceptances shrink as Fenolite improves."
see = "verify-source"

["fidelity.level-skipped"]
meaning = "verify-source skipped a level that a side cannot reach; the message names the reason (no-footprints, no-copper, no-board, no-schematic, drawn-unavailable, altium-drawing-unread, build-failed)."
fix = "Nothing to do when the reason is expected; a skipped level is never a pass."
see = "verify-source"

["fidelity.input-upgraded"]
meaning = "verify-source upgraded a copy of an original older than KiCad 9.0 with kicad-cli pcb upgrade (--upgrade); the message names the tool version and both SHA-256."
fix = "Nothing to do; the original itself is unchanged."
see = "verify-source"

["catalog.pin-without-pad"]
meaning = "fenolite catalog import: a symbol pin has no footprint pad of its number, and no --pin maps it. Nothing is written."
fix = "Map the pin with --pin FUNCTION=PIN:PAD, or pick the footprint the symbol is meant for."
see = "catalog"

["catalog.pad-unmapped"]
meaning = "fenolite catalog import: a footprint pad is named by no symbol pin and is left out of the device."
fix = "Nothing for a mechanical pad (list it in unused_pads when you review the file); else map it with --pin."
see = "catalog"

["circuit.rail-voltage"]
meaning = "A rail's voltage is not what a port on it needs: the voltages set on the rail (by the design rail and by out power ports) do not meet, or the rail's range is not within the operating range an in power port accepts. The message names the rail, the port and both ranges."
fix = "Change the rail's voltage or its source, choose a part that accepts the rail, or power the port from another rail."
see = "check"

["circuit.rail-current"]
meaning = "The loads of a rail can draw more than its sources give, worst case: the sum of the upper bounds of the draws of its in power ports exceeds the sum of the lower bounds of the capacities of its out power ports. A block's out port replaces the out ports inside it."
fix = "Lower the loads, choose a source of more current, or split the loads over two rails."
see = "check"

["circuit.rail-sources"]
meaning = "Two or more out power ports drive one rail, and neither the rail is declared shared nor every source port has share."
fix = "Drive the rail from one source, or declare the rail shared (design.rail(..., shared=True)) when the sources are made to share it."
see = "check"

["circuit.rail-unset"]
meaning = "Something on a rail could not be judged: ports state limits and no voltage is set, or loads state a draw and no source states a capacity, or a draw has no upper bound."
fix = "Give the rail a voltage (design.rail(..., voltage=...)) or its source port one, and state the source's current."
see = "check"

["circuit.logic-level"]
meaning = "A logic driver and a reader on one net refer to different rails, and one of three worst-case comparisons fails: the driver's output_high_min is below the reader's input_high_min, its output_low_max is above the reader's input_low_max, or its rail's upper bound is above the reader's abs_max."
fix = "Add a level shifter, move both ports to one reference rail, or choose parts whose levels meet."
see = "check"

["circuit.logic-unknown"]
meaning = "A logic driver and a reader on one net refer to different rails, and a threshold that a comparison needs is not stated; the comparison is never passed by assuming that the driver's level is its rail."
fix = "State the missing threshold on the port or in the device record, from the part's datasheet."
see = "check"

["circuit.bus-pullup"]
meaning = "A pull-up of an I2C line goes to a rail other than the bus's reference rail, its resistance range is not within the accepted pullup range of the bus and its ports, or its worst-case current exceeds a bus port's output_current_max."
fix = "Pull the bus up to its reference rail with a resistance in the accepted range."
see = "check"

["circuit.requires-missing"]
meaning = "A port declares a companion it needs (requires: pullup, supply or chip_select) and the board does not give it: a line without a pull-up, a reference rail without a voltage and a source, or a chip select that goes nowhere."
fix = "Connect the companion, or remove the entry when the board does not need it."
see = "check"

["circuit.port-split"]
meaning = "The pins of one member of a device port are on two nets (such as VDD and VDDA on separate rails), so the member is left out of the model port and its parameters are not judged."
fix = "Join the pins of the member, or accept the split."
see = "check"
