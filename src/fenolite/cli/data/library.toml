# The releases of fenolite-library known to this Fenolite (change c0279, ADR-0008, docs/library-repo.md).
# Each row pins the index of one release: its size and SHA-256. A release published after this version is
# reached with `fenolite get --index-sha256 HEX` or through the `index` digest of a lock entry.
schema = "fenolite.library-releases.v0"
repository = "lgili/fenolite-library"
url_template = "https://github.com/lgili/fenolite-library/releases/download/v{version}/{asset}"

