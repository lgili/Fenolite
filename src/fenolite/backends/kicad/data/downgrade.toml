# The capability resolver of the KiCad downgrade (openspec change c0162, capability kicad-version-gating,
# "Downgrade resolver").
#
# Authored by hand for Fenolite. One row per token row of tokens.toml whose since_major is above a target
# of TARGET_MAJORS, per such form row, and per key path of pro.TEN_ONLY_PATHS (ids "project:<path>"),
# plus the project's net_settings version and the rows the board writer decides (resolver.WRITER_ROWS). Each row says what a downgrade for `target` does with the
# construct (resolver.py):
#   rewrite       written in the target's form (`form`, from `sources`); reported as changed
#   same          dropped: the target behaves as the source with that value; reported as changed
#   presentation  dropped: a drawing, a text or metadata changes; reported as a loss (report)
#   design        dropped: what is made or checked changes; a loss that needs --allow-lossy (refuse)
# `when` lists the values for which `action` holds (every symbol value of the node and of its children
# must be one of them); `else` is the action for any other value, and of a rewrite the target cannot
# hold. A row's bench (tests/kicad/downgrade/test_rows.py, probe down-row-<id>) proves it on 9.0.9 and
# 10.0.6; a row whose bench differs moves to design, never the reverse without a new bench.
# Rendered in the column "downgrade" of docs/formats/kicad/tokens.md by tools/gen_token_docs.py.
format = 1

