<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- Copyright (c) 2026 Fenolite contributors -->
<!-- The fonts of the visual tests (change c0191): DejaVu only, from the fonts-dejavu-core package (2.37-8 on
     Ubuntu 24.04), so every family the page names renders with the same glyphs here and in CI. -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <cachedir>/tmp/fenolite-visual-fontconfig</cachedir>
  <match target="pattern">
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <config><rescan><int>0</int></rescan></config>
</fontconfig>
