# Token fuzz examples (openspec change c0007, capability kicad-token-inventory). Authored for Fenolite,
# CC0-1.0, ASCII only. Each example is inserted into the skeleton of its kind (host + mode + fragment)
# or is a whole file; tools/kicad_token_fuzz.py derives the header and the expected outcome from the
# inventory. Controls carry an explicit expect per major.

# ------------------------------------------------------------------------------------- controls

[[example]]
id = "positive-baseline"
kinds = ["kicad_pcb", "kicad_mod", "kicad_wks", "kicad_dru", "kicad_sch", "kicad_sym"]
