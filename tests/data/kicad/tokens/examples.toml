# ----------------------------------------------------------------------------------------- rules

[[example]]
id = "rules-floor-basic"
kinds = ["kicad_dru"]
host = "kicad_dru"
mode = "append"
fragment = """(rule floor_basic (layer outer) (severity warning) (condition "A.NetName == 'A'")
  (constraint track_width (min 0.1mm) (opt 0.2mm) (max 5mm)))"""

[[example]]
id = "rules-floor-types"
kinds = ["kicad_dru"]
host = "kicad_dru"
mode = "append"
fragment = """
(rule t1 (constraint annular_width (min 0.1mm)))
(rule t2 (constraint hole_clearance (min 0.1mm)))
(rule t3 (constraint hole_size (min 0.1mm) (max 6mm)))
(rule t4 (constraint hole_to_hole (min 0.1mm)))
(rule t5 (constraint edge_clearance (min 0.1mm)))
(rule t6 (constraint courtyard_clearance (min 0mm)))
(rule t7 (constraint silk_clearance (min 0mm)))
(rule t8 (constraint via_diameter (min 0.3mm)))
(rule t9 (constraint text_height (min 0.5mm)))
(rule t10 (constraint text_thickness (min 0.05mm)))
(rule t11 (constraint physical_clearance (min 0mm)))
(rule t12 (constraint physical_hole_clearance (min 0mm)))
(rule t13 (constraint connection_width (min 0.1mm)))
(rule t14 (constraint thermal_relief_gap (min 0.1mm)))
(rule t15 (constraint thermal_spoke_width (min 0.1mm)))
(rule t16 (constraint min_resolved_spokes 2))
(rule t17 (constraint zone_connection solid))
(rule t18 (constraint length (min 1mm) (max 500mm)))
(rule t19 (constraint skew (max 10mm) (within_diff_pairs)))
(rule t20 (constraint diff_pair_gap (min 0.1mm) (max 1mm)))
(rule t21 (constraint diff_pair_uncoupled (max 5mm)))
(rule t22 (constraint via_count (max 100)))
(rule t23 (constraint track_angle (min 1)))
(rule t24 (constraint track_segment_length (min 0.01mm)))
(rule t25 (constraint creepage (min 0.1mm)))
(rule t26 (constraint assertion "A.NetName != ''"))
(rule t27 (constraint disallow track via micro_via buried_via pad zone text graphic hole footprint) (condition "A.NetName == 'fenolite_none'"))
"""

