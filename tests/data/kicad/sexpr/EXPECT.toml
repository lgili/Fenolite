# Expected outcomes of the S-expression fixtures (openspec change c0006, capability kicad-sexpr).
#
# expect_parse: "accept" or the rule named in the FormatError of fenolite.backends.kicad.parse_bytes.
# expect_kicad_10: exit code of `kicad-cli pcb export svg -l Edge.Cuts --mode-single -o <svg> <file>`,
# observed once with kicad-cli 10.0.6 on 2026-10-01. expect_kicad_9 is added by the kicad-9 job (c0007).
# class: mirror (parser rejects exactly when KiCad exits 3), unmirrored (Fenolite-only strictness, KiCad's
# outcome recorded only), semantic (number spellings that parse; KiCad may refuse them).
# All fixtures are authored for Fenolite and released under CC0-1.0.

[[fixture]]
file = "minimal.kicad_pcb"
class = "mirror"
expect_parse = "accept"
expect_kicad_10 = 0
hypothesis = "H-K-SEXPR-LEX-10"
note = "minimal 10.0 board with an Edge.Cuts rectangle; numeric heads in the layer table"

